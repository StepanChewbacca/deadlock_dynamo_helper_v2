<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deadlock Build HUD Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      :root {
        --bg-glass: rgba(12, 12, 16, 0.72);
        --bg-card: rgba(22, 22, 30, 0.5);
        --border: rgba(255, 255, 255, 0.08);
        --text-primary: #f3f4f6;
        --text-secondary: #9ca3af;
        --accent: #ff6b4a;
        --success: #10b981;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Outfit', sans-serif;
        background-color: transparent;
        color: var(--text-primary);
        width: 100vw;
        height: 100vh;
        padding: 0.75rem;
        overflow: hidden;
      }

      /* Glassmorphism Panel Container */
      .hud-container {
        width: 100%;
        height: 100%;
        background: var(--bg-glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        overflow: hidden;
        min-width: 0;
        min-height: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      .hud-container.compact #guide-build-desc,
      .hud-container.compact #guide-adjustments {
        display: none !important;
      }
      .guide-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.5rem;
        cursor: move;
        flex: 0 0 auto;
        min-width: 0;
        user-select: none;
        -webkit-user-select: none;
      }

      .guide-header > div {
        flex: 0 1 auto;
        min-width: 0;
        max-width: 190px;
      }

      .guide-header button {
        flex: 0 0 26px;
        width: 26px;
        height: 26px;
        line-height: 1;
      }

      .guide-title {
        flex: 1 1 auto;
        min-width: 0;
        max-width: 145px;
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .build-selector {
        min-width: 0;
        max-width: 118px;
        background: rgba(30, 30, 40, 0.8);
        border: 1px solid var(--border);
        color: var(--text-primary);
        font-family: inherit;
        font-size: 0.7rem;
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        cursor: pointer;
        outline: none;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .build-desc {
        font-size: 0.75rem;
        color: var(--text-secondary);
        line-height: 1.3;
        flex: 0 0 auto;
        max-height: 2.65rem;
        overflow: hidden;
        overflow-wrap: anywhere;
      }

      /* Compact vertical list of phases */
      .phases-vertical {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding-right: 0.1rem;
      }

      .phase-col {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        flex: 0 0 auto;
        min-width: 0;
        background-color: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.5rem;
      }

      .phase-col-title {
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--text-secondary);
        letter-spacing: 0.05em;
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.25rem;
        margin-bottom: 0.15rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .phase-items {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        min-width: 0;
      }

      .guide-item-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.45rem;
        min-width: 0;
        background-color: rgba(27, 27, 34, 0.4);
        border: 1px solid var(--border);
        padding: 0.35rem 0.45rem;
        border-radius: 6px;
        font-size: 0.7rem;
      }

      .guide-item-main {
        display: flex;
        flex: 1 1 auto;
        min-width: 0;
        flex-direction: column;
        gap: 0.1rem;
      }

      .guide-item-title {
        min-width: 0;
        color: var(--text-primary);
        font-weight: 700;
        line-height: 1.15;
        overflow-wrap: anywhere;
      }

      .guide-item-subtitle {
        min-width: 0;
        color: var(--text-secondary);
        font-size: 0.66rem;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      .guide-item-row.weapon {
        border-left: 3px solid #f59e0b;
      }

      .guide-item-row.vitality {
        border-left: 3px solid #10b981;
      }

      .guide-item-row.spirit {
        border-left: 3px solid #a855f7;
      }

      .item-popularity {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.6rem;
        font-weight: 600;
        color: var(--text-secondary);
        flex: 0 0 auto;
        max-width: 4.5rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Adjustment rows */
      .adjustment-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: rgba(27, 27, 34, 0.5);
        border: 1px solid var(--border);
        padding: 0.35rem 0.5rem;
        border-radius: 6px;
        font-size: 0.7rem;
        gap: 0.45rem;
        min-width: 0;
      }

      .adjustment-row.counter {
        border-left: 3px solid var(--danger);
      }

      .adjustment-row.synergy {
        border-left: 3px solid var(--success);
      }

      .adjustment-info {
        display: flex;
        flex-direction: column;
        gap: 0.05rem;
        min-width: 0;
      }

      .adjustment-reason {
        font-size: 0.6rem;
        color: var(--text-secondary);
        overflow-wrap: anywhere;
      }

      .adjustment-time {
        font-size: 0.6rem;
        color: var(--text-secondary);
        font-family: 'JetBrains Mono', monospace;
        opacity: 0.75;
      }

      .adjustment-advantage {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.6rem;
        font-weight: 700;
        color: var(--success);
      }

      /* Skill Grid Layout */
      .skill-grid-container {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        background-color: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.65rem;
        flex: 0 0 auto;
        min-width: 0;
        overflow: hidden;
      }

      .skill-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        min-width: 0;
      }

      .skill-label {
        width: 100px;
        font-size: 0.68rem;
        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 0 0 100px;
      }

      .skill-cells {
        display: flex;
        gap: 2px;
        flex: 1;
        min-width: 0;
      }

      .skill-cell {
        flex: 1;
        aspect-ratio: 1;
        max-width: 13px;
        min-width: 9px;
        border: 1px solid var(--border);
        border-radius: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.5rem;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.05);
        background-color: rgba(0, 0, 0, 0.15);
      }

      .skill-cell.active-1 {
        background-color: rgba(245, 158, 11, 0.25);
        border-color: #f59e0b;
        color: #f59e0b;
      }

      .skill-cell.active-2 {
        background-color: rgba(16, 185, 129, 0.25);
        border-color: #10b981;
        color: #10b981;
      }

      .skill-cell.active-3 {
        background-color: rgba(59, 130, 246, 0.25);
        border-color: #3b82f6;
        color: #3b82f6;
      }

      .skill-cell.active-4 {
        background-color: rgba(168, 85, 247, 0.25);
        border-color: #a855f7;
        color: #a855f7;
      }

      .skill-grid-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        min-width: 0;
      }

      .skill-header-label {
        width: 100px;
      }

      .skill-header-cells {
        display: flex;
        gap: 2px;
        flex: 1;
        min-width: 0;
      }

      .skill-header-cell {
        flex: 1;
        max-width: 13px;
        min-width: 9px;
        text-align: center;
        font-size: 0.5rem;
        font-family: 'JetBrains Mono', monospace;
        color: var(--text-secondary);
        font-weight: 500;
      }

      /* Empty State */
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 0.5rem;
        height: 100%;
        min-width: 0;
        min-height: 0;
        color: var(--text-secondary);
      }

      .empty-state-icon {
        font-size: 2rem;
        color: var(--border);
      }

      /* Scrollbars */
      ::-webkit-scrollbar {
        width: 3px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      .item-adjustment-badge {
        font-size: 0.62rem;
        font-weight: 600;
        padding: 0.15rem 0.4rem;
        border-radius: 4px;
        white-space: nowrap;
        flex: 0 0 auto;
        max-width: 6.75rem;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item-adjustment-badge.counter {
        background-color: rgba(239, 68, 68, 0.18);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #f87171;
      }
      .item-adjustment-badge.synergy {
        background-color: rgba(16, 185, 129, 0.18);
        border: 1px solid rgba(16, 185, 129, 0.4);
        color: #34d399;
      }
      .guide-item-row.adjustment-injected {
        background-color: rgba(255, 107, 74, 0.08) !important;
        border: 1px dashed rgba(255, 107, 74, 0.3) !important;
      }
      .skill-badge {
        font-size: 0.65rem;
        font-weight: 700;
        padding: 0.15rem 0.4rem;
        border-radius: 4px;
        white-space: nowrap;
        flex: 0 0 auto;
      }
      .skill-badge.active-1 {
        background-color: rgba(245, 158, 11, 0.25);
        border: 1px solid #f59e0b;
        color: #f59e0b;
      }
      .skill-badge.active-2 {
        background-color: rgba(16, 185, 129, 0.25);
        border: 1px solid #10b981;
        color: #10b981;
      }
      .skill-badge.active-3 {
        background-color: rgba(59, 130, 246, 0.25);
        border: 1px solid #3b82f6;
        color: #3b82f6;
      }
      .skill-badge.active-4 {
        background-color: rgba(168, 85, 247, 0.25);
        border: 1px solid #a855f7;
        color: #a855f7;
      }

      #guide-active {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }

      #guide-skills {
        flex: 0 0 auto;
        min-width: 0;
        overflow: hidden;
      }

      #situational-recommendation-panel {
        flex: 0 0 auto;
        min-width: 0;
        max-height: 116px;
        overflow: hidden;
      }

      #situational-recommendation-panel img {
        flex: 0 0 auto;
      }

      #situational-recommendation-panel > div {
        min-width: 0;
      }

      #rec-decision-title,
      #rec-item-name,
      #rec-reason {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #rec-decision-title,
      #rec-item-name {
        white-space: nowrap;
      }

      #rec-reason {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div class="hud-container">
      <!-- Default Empty State -->
      <div class="empty-state" id="guide-empty">
        <div class="empty-state-icon">🛡️</div>
        <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-primary);">Deadlock HUD Overlay</div>
        <div style="font-size: 0.72rem; line-height: 1.4; max-width: 240px; margin-bottom: 0.5rem;">Select a hero in-game to load the dynamic composition builds. Use <strong>Ctrl+Tab</strong> to hide this overlay.</div>
      </div>

      <!-- Active Guide State -->
      <div id="guide-active" style="display: none; flex-direction: column; gap: 0.45rem; height: 100%;">
        <div class="guide-header">
          <h2 class="guide-title" id="guide-title">Build HUD</h2>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <select class="build-selector" id="build-select" onchange="switchActiveBuild()">
              <!-- Options populated dynamically -->
            </select>
            <button id="hud-refresh-build" onclick="refreshBuild()" style="background: rgba(30, 30, 40, 0.8); border: 1px solid var(--border); color: var(--text-primary); font-size: 0.75rem; padding: 0.25rem 0.4rem; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none;" title="Refresh Build">🔄</button>
            <button id="hud-toggle-mode" onclick="toggleHudMode()" style="background: rgba(30, 30, 40, 0.8); border: 1px solid var(--border); color: var(--text-primary); font-size: 0.75rem; padding: 0.25rem 0.4rem; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none;">🗕</button>
          </div>
        </div>

        <!-- Dynamic Recommendation Banner -->
        <div id="situational-recommendation-panel" style="display: none; align-items: center; gap: 0.65rem; background: rgba(255, 107, 74, 0.12); border: 1px solid #ff6b4a; padding: 0.5rem 0.65rem; border-radius: 8px; margin-bottom: 0.25rem;">
          <img src="dynamo.png" style="width: 42px; height: 42px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2);" />
          <div style="display: flex; flex-direction: column; gap: 0.1rem; flex: 1;">
            <strong style="color: #ff6b4a; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em;" id="rec-decision-title">Спецсовет от Динамо</strong>
            <span style="color: #f3f4f6; font-size: 0.78rem; font-weight: 700;" id="rec-item-name">Предмет</span>
            <span style="color: #9ca3af; font-size: 0.62rem; line-height: 1.2;" id="rec-reason">Причина</span>
          </div>
        </div>

        <p class="build-desc" id="guide-build-desc">Loading...</p>

        <div class="phases-vertical">
          <div class="phase-col">
            <span class="phase-col-title">Early Game (0-10m)</span>
            <div class="phase-items" id="phase-early"></div>
          </div>
          <div class="phase-col">
            <span class="phase-col-title">Mid Game (10-20m)</span>
            <div class="phase-items" id="phase-mid"></div>
          </div>
          <div class="phase-col">
            <span class="phase-col-title">Late Game (20m+)</span>
            <div class="phase-items" id="phase-late"></div>
          </div>
        </div>

        <!-- Skill Level-up Path -->
        <div id="guide-skills"></div>
      </div>
    </div>


    <!-- Same index.js loaded. It detects what window context it is in -->
    <script src="dist/index.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dynamo Warning Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <style>
      * {
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: transparent;
        font-family: 'Outfit', sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }

      .popup-shell {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        box-sizing: border-box;
      }

      .popup-card {
        display: none;
        align-items: center;
        gap: 0.75rem;
        width: 100%;
        max-width: 380px;
        min-height: 94px;
        background: rgba(22, 10, 10, 0.92);
        border: 2px solid #ef4444;
        border-radius: 12px;
        padding: 0.75rem;
        box-shadow: 0 10px 30px rgba(239, 68, 68, 0.5);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-sizing: border-box;
        cursor: default;
      }

      .popup-drag-handle {
        flex: 0 0 14px;
        align-self: stretch;
        border-radius: 7px;
        background: linear-gradient(180deg, rgba(255, 107, 74, 0.45), rgba(239, 68, 68, 0.18));
        border: 1px solid rgba(255, 255, 255, 0.12);
        cursor: move;
      }

      .popup-image {
        flex: 0 0 auto;
        width: 50px;
        height: 50px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        object-fit: cover;
      }

      .popup-content {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        min-width: 0;
      }

      .popup-title {
        color: #ef4444;
        font-size: 0.8rem;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      .popup-text {
        color: #f3f4f6;
        font-size: 0.75rem;
        line-height: 1.3;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div class="popup-shell">
      <div class="popup-card">
        <div class="popup-drag-handle" title="Drag warning window"></div>
        <img src="dynamo.png" class="popup-image" />
        <div class="popup-content">
          <span class="popup-title">Внимание от Динамо</span>
          <span class="popup-text">Ты умираешь как мусор, играй аккуратно!</span>
        </div>
      </div>
    </div>

    <script src="dist/dynamo_warning.js"></script>
  </body>
</html>

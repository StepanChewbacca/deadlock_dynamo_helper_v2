<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deadlock Live Probe Client</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-main: #0b0b0e;
        --bg-card: #14141a;
        --border: #23232f;
        --text-primary: #f3f4f6;
        --text-secondary: #9ca3af;
        --accent: #ff6b4a; /* Deadlock themed orange/rust */
        --accent-glow: rgba(255, 107, 74, 0.2);
        --success: #10b981;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--bg-main);
        color: var(--text-primary);
        width: 100vw;
        height: 100vh;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.75rem;
      }

      .logo-container {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .logo-icon {
        width: 8px;
        height: 20px;
        background-color: var(--accent);
        border-radius: 2px;
        box-shadow: 0 0 8px var(--accent);
      }

      h1 {
        font-size: 1.125rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: linear-gradient(135deg, var(--text-primary) 30%, var(--accent) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .version-tag {
        font-size: 0.65rem;
        color: var(--text-secondary);
        background-color: var(--border);
        padding: 0.125rem 0.375rem;
        border-radius: 4px;
        font-family: 'JetBrains Mono', monospace;
      }

      .status-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin: 1rem 0;
      }

      .status-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .status-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--text-secondary);
        letter-spacing: 0.05em;
      }

      .status-value {
        font-size: 1.125rem;
        font-weight: 600;
        font-family: 'JetBrains Mono', monospace;
      }

      #status {
        color: var(--accent);
      }

      #status.connected {
        color: var(--success);
      }

      #status.error {
        color: var(--danger);
      }

      .console-log {
        flex: 1;
        background-color: #050507;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.75rem;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.7rem;
        color: #34d399;
        overflow-y: auto;
        white-space: pre-wrap;
        margin-bottom: 1rem;
      }

      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.7rem;
        color: var(--text-secondary);
        border-top: 1px solid var(--border);
        padding-top: 0.75rem;
      }

      .indicator {
        display: flex;
        align-items: center;
        gap: 0.375rem;
      }

      .indicator-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: var(--accent);
        box-shadow: 0 0 6px var(--accent);
      }

      .indicator-dot.active {
        background-color: var(--success);
        box-shadow: 0 0 6px var(--success);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo-container">
        <div class="logo-icon"></div>
        <h1>Deadlock Live Probe</h1>
      </div>
      <span class="version-tag">v0.0.1</span>
    </header>

    <div class="status-grid">
      <div class="status-card">
        <span class="status-label">GEP Integration</span>
        <span class="status-value" id="status">INIT</span>
      </div>
      <div class="status-card">
        <span class="status-label">Events Sent</span>
        <span class="status-value" id="last-send">0</span>
      </div>
      <div class="status-card" style="grid-column: span 2">
        <span class="status-label">Last GEP Event</span>
        <span class="status-value" id="last-event" style="font-size: 0.875rem">Waiting...</span>
      </div>
    </div>

    <div class="console-log" id="console">Initializing telemetry bridge...</div>

    <footer>
      <div class="indicator">
        <div class="indicator-dot" id="indicator-dot"></div>
        <span id="indicator-text">Connecting to NestJS API...</span>
      </div>
      <span>Port 3000 Ingest</span>
    </footer>

    <script src="dist/index.js"></script>
  </body>
</html>

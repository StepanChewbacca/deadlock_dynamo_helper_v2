name: Apply Contextual V3 final-test audit gate

on:
  push:
    branches:
      - agent/contextual-v3-future-final-test
    paths:
      - .github/workflows/apply-contextual-v3-final-test-audit-gate.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/contextual-v3-future-final-test
          fetch-depth: 0
      - name: Apply fix
        run: python3 scripts/apply-contextual-v3-final-test-audit-gate.py
      - name: Validate diff
        run: git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/deadlock-live/hero-build-contextual-v3-final-test.service.ts
          git commit -m "fix: require final-test audit for shadow eligibility"
          git push origin HEAD:agent/contextual-v3-future-final-test

name: Apply recommendation Value V4 context model

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-recommendation-value-v4-context-model.yml
      - .github/scripts/apply-recommendation-value-v4-context-model.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/improve-recommendation-value-v4-context-model'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply context model patch
        run: python3 .github/scripts/apply-recommendation-value-v4-context-model.py

      - name: Remove temporary implementation files
        run: rm -f .github/workflows/apply-recommendation-value-v4-context-model.yml .github/scripts/apply-recommendation-value-v4-context-model.py

      - name: Verify diff
        run: git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/deadlock-live/recommendation-value-v4-training.service.ts apps/api/src/deadlock-live/recommendation-policy-v4-evaluation.service.ts apps/api/test/recommendation-value-v4-training.spec.ts docs/recommendation-value-v4-training.md .github/workflows/apply-recommendation-value-v4-context-model.yml .github/scripts/apply-recommendation-value-v4-context-model.py
          git commit -m "feat: improve recommendation value v4 context model"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

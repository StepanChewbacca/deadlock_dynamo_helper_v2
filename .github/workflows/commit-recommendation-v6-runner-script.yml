name: Commit Recommendation V6 runner script

on:
  push:
    branches:
      - diagnostics/run-recommendation-v6-cycle-20260726
    paths:
      - .github/workflows/commit-recommendation-v6-runner-script.yml

permissions:
  contents: write

jobs:
  commit-script:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: diagnostics/run-recommendation-v6-cycle-20260726
          fetch-depth: 0

      - name: Extract and apply validated edits
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /node <<'"'"'NODE'"'"'/ { capture=1; next }
            capture && /^          NODE$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-recommendation-v6-runner-safety.yml > /tmp/apply-runner-safety.cjs
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const path = '/tmp/apply-runner-safety.cjs';
          const source = readFileSync(path, 'utf8');
          const before = `            if (count !== 1) {
              throw new Error(\`${'${path}'}: expected one replacement target, found ${'${count}'}\`);
            }
            writeFileSync(path, content.replace(before, after), 'utf8');`;
          const after = `            if (count === 0 && content.includes(after)) {
              return;
            }
            if (count !== 1) {
              throw new Error(\`${'${path}'}: expected one replacement target, found ${'${count}'}\`);
            }
            writeFileSync(path, content.replace(before, after), 'utf8');`;
          if (!source.includes(before)) {
            throw new Error('Unable to make runner-safety replacements idempotent.');
          }
          writeFileSync(path, source.replace(before, after), 'utf8');
          NODE
          node /tmp/apply-runner-safety.cjs
          node --check scripts/run-recommendation-v6-full-crawler-cycle.mjs

      - name: Commit script only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-recommendation-v6-full-crawler-cycle.mjs
          git diff --cached --exit-code && { echo 'No script changes to commit'; exit 1; } || true
          git commit -m "fix: recover and serialize Recommendation V6 runs"
          git push origin HEAD:diagnostics/run-recommendation-v6-cycle-20260726

name: Apply V6 Refresh Hotfix

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply hotfix
        run: python3 scripts/apply-v6-refresh-hotfix.py
      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/deadlock-live
          git commit -m 'fix: prevent V6 recommendation refresh hangs'
          git push origin HEAD:${{ github.head_ref }}

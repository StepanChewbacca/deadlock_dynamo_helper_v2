name: Inspect Recommendation storage

on:
  push:
    branches:
      - diagnostics/run-recommendation-v6-cycle-20260726
    paths:
      - .github/workflows/inspect-recommendation-storage.yml

permissions:
  contents: read

jobs:
  inspect-storage:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: diagnostics/run-recommendation-v6-cycle-20260726

      - name: Inspect production and training storage
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/recommendation-storage-report.txt"
          {
            echo '=== DISK ==='
            df -h
            echo
            echo '=== DOCKER VOLUMES ==='
            sudo docker volume ls
            VOLUME_NAME="$(sudo docker volume ls --format '{{.Name}}' | grep 'deadlock-storage' | head -n 1)"
            echo "VOLUME_NAME=$VOLUME_NAME"
            VOLUME_ROOT="$(sudo docker volume inspect -f '{{.Mountpoint}}' "$VOLUME_NAME")"
            echo "VOLUME_ROOT=$VOLUME_ROOT"
            echo
            echo '=== PRODUCTION API ENV ==='
            cd /home/ubuntu/apps/deadlock_dynamo_helper
            API_CONTAINER="$(sudo docker compose ps -q api)"
            echo "API_CONTAINER=$API_CONTAINER"
            sudo docker inspect "$API_CONTAINER" --format '{{range .Config.Env}}{{println .}}{{end}}' \
              | grep -E 'DEADLOCK_(CONTEXTUAL|RECOMMENDATION|BUILD_EVALUATION)' \
              | sort || true
            echo
            echo '=== LIVE STATUS ==='
            curl --max-time 15 --silent --show-error http://127.0.0.1:3000/deadlock/analysis/contextual-v3-live/status || true
            echo
            curl --max-time 15 --silent --show-error http://127.0.0.1:3000/deadlock/analysis/recommendation-telemetry/status || true
            echo
            echo '=== STORAGE DIRECTORIES ==='
            sudo find "$VOLUME_ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | grep -E '^(recommendation|contextual-v3)' \
              | sort \
              | while read -r name; do
                  dir="$VOLUME_ROOT/$name"
                  echo
                  echo "--- $name ---"
                  sudo du -sh "$dir" || true
                  sudo find "$dir" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
                  for json in manifest.json audit.json evaluation.json model.json; do
                    if sudo test -f "$dir/$json"; then
                      echo "[$json]"
                      sudo jq '{datasetVersion,modelVersion,schemaVersion,passed,releaseGatePassed,releaseGate,artifact,artifacts,source,training,createdAt,completedAt}' "$dir/$json" 2>/dev/null || sudo head -c 4000 "$dir/$json"
                      echo
                    fi
                  done
                done
            echo
            echo '=== FINAL DISK ==='
            df -h
          } | tee "$REPORT"

      - name: Upload storage report
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-storage-report-${{ github.sha }}
          path: ${{ runner.temp }}/recommendation-storage-report.txt
          if-no-files-found: error
          retention-days: 3

name: Recommendation V8 Audit Ready Restart V3

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-v8-prebaseline-filter-v1.json'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: recommendation-v8-audit-ready-restart-v3
  cancel-in-progress: false

jobs:
  release-runner:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.gate.outputs.should-run }}
    steps:
      - name: Checkout training branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Validate request gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          request='.github/training-requests/recommendation-v8-prebaseline-filter-v1.json'
          state="$(jq -r '.state' "$request")"
          if [ "$state" != 'REQUESTED' ]; then
            echo 'should-run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(jq -r '.operation' "$request")" = 'APPLY_AUDIT_READY_FALLBACK_AND_RESTART_5000_V3'
          test "$(jq -r '.matchLimit' "$request")" = '5000'
          test "$(jq -r '.futureSnapshotFallbackEnabled' "$request")" = 'true'
          test "$(jq -r '.maximumFutureSnapshotLagS' "$request")" = '300'
          test "$(jq -r '.historicalOfflineCandidateLimit' "$request")" = '256'
          test "$(jq -r '.compactReplayCandidates' "$request")" = 'true'
          test "$(jq -r '.minimumTimelineCoverage' "$request")" = '0.99'
          test "$(jq -r '.minimumCandidateMetadataCoverage' "$request")" = '0.999'
          test "$(jq -r '.minimumObservedActionCandidateCoverage' "$request")" = '0.995'
          test "$(jq -r '.candidateCoveragePreflightRequired' "$request")" = 'true'
          test "$(jq -r '.deleteFailedDerivedArtifactsAuthorized' "$request")" = 'true'
          test "$(jq -r '.restartAfterCandidateCoverageReview' "$request")" = 'true'
          test "$(jq -r '.lowerAuditThresholdsAuthorized' "$request")" = 'false'
          test "$(jq -r '.observedActionInjectionAuthorized' "$request")" = 'false'
          test "$(jq -r '.productionRankingChanged' "$request")" = 'false'
          test "$(jq -r '.passiveShadowActivated' "$request")" = 'false'
          test "$(jq -r '.randomizedCanaryAuthorized' "$request")" = 'false'
          echo 'should-run=true' >> "$GITHUB_OUTPUT"

      - name: Cancel stale Recommendation V8 runs
        if: steps.gate.outputs.should-run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const current = Number(context.runId);
            for (const status of ['queued', 'in_progress', 'pending']) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  status,
                  per_page: 100,
                },
              );
              for (const run of runs) {
                if (
                  run.id === current ||
                  typeof run.name !== 'string' ||
                  !run.name.startsWith('Recommendation V8')
                ) {
                  continue;
                }
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                  core.notice(`Cancelled stale run ${run.id}: ${run.name}`);
                } catch (error) {
                  if (![404, 409].includes(error.status)) {
                    throw error;
                  }
                }
              }
            }

  patch-test-cleanup-and-restart:
    needs: release-runner
    if: needs.release-runner.outputs.should-run == 'true'
    runs-on: self-hosted
    timeout-minutes: 480
    steps:
      - name: Checkout training branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Refuse active training replacement
        shell: bash
        run: |
          set -euo pipefail
          container='deadlock-recommendation-v8-training'
          if sudo docker ps --format '{{.Names}}' | grep -Fxq "$container"; then
            if sudo docker exec "$container" sh -lc "pgrep -f '[r]un-recommendation-v8-diagnostic-only-pipeline.mjs|[r]un-recommendation-v8-training-supervisor.mjs|[r]un-recommendation-v8-clean-diagnostic-supervisor.mjs' >/dev/null"; then
              echo 'An active Recommendation V8 training process exists; refusing source mutation.' >&2
              exit 1
            fi
          fi

      - name: Apply audit-ready source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch-recommendation-v8-prebaseline-filter-v1.py
          python3 scripts/patch-recommendation-v8-prebaseline-filter-v1.py
          git diff --check
          grep -R "RECOMMENDATION_HISTORICAL_PRO_REPLAY_2" apps/api/src/deadlock-live/recommendation-historical-pro-replay.ts
          grep -R "RECOMMENDATION_PRO_DECISION_DATASET_V6_2" apps/api/src/deadlock-live/recommendation-pro-decision-dataset-v6.ts
          grep -R "minimumObservedActionCandidateCoverage: 0.995" apps/api/src/deadlock-live/recommendation-historical-pro-replay.ts
          grep -R "RECOMMENDATION_HISTORICAL_OFFLINE_CANDIDATE_LIMIT = 256" apps/api/src/deadlock-live/recommendation-candidate-generator-snapshot.ts

      - name: Build validation image
        shell: bash
        run: |
          set -euo pipefail
          image="deadlock-recommendation-v8-audit-ready-builder:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo docker build --target builder -t "$image" .
          echo "BUILDER_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Run replay, Dataset V6 and behavioral regression suites
        shell: bash
        run: |
          set -euo pipefail
          sudo docker run --rm --entrypoint yarn "$BUILDER_IMAGE" \
            workspace @deadlock-live-probe/api test \
            recommendation-v8-audit-ready-fallback.spec.ts \
            recommendation-historical-pro-replay-artifact.spec.ts \
            recommendation-historical-pro-replay-terminal-outcomes.spec.ts \
            recommendation-historical-pro-replay-fractional-snapshot.spec.ts \
            recommendation-historical-pro-replay-streaming-audit.spec.ts \
            recommendation-pro-decision-dataset-v6.spec.ts \
            recommendation-pro-decision-dataset-v6-artifact.spec.ts \
            recommendation-behavioral-v5.spec.ts \
            --runInBand

      - name: Run full candidate coverage preflight
        shell: bash
        run: |
          set -euo pipefail
          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          replay="$storage/recommendation-historical-pro-replay-terminal-5000-v2/dataset.ndjson"
          snapshot="$storage/recommendation-candidate-generator-snapshots-5000-v1/v8-5000-c6637-30701422914.json"
          run_root='/home/ubuntu/apps/deadlock_dynamo_helper-training-5000'
          preflight_dir="$run_root/runs/audit-ready-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo test -s "$replay"
          sudo test -s "$snapshot"
          sudo mkdir -p "$preflight_dir"
          sudo chown -R "$(id -u):$(id -g)" "$run_root"
          sudo docker run --rm \
            --memory=7g \
            --memory-swap=7g \
            -e NODE_OPTIONS=--max-old-space-size=6144 \
            -e RECOMMENDATION_V8_PREFLIGHT_REPLAY_PATH=/storage/recommendation-historical-pro-replay-terminal-5000-v2/dataset.ndjson \
            -e RECOMMENDATION_V8_PREFLIGHT_SNAPSHOT_PATH=/storage/recommendation-candidate-generator-snapshots-5000-v1/v8-5000-c6637-30701422914.json \
            -e RECOMMENDATION_V8_PREFLIGHT_REPORT_PATH=/preflight/candidate-coverage-preflight.json \
            --mount "type=bind,src=$storage,dst=/storage,readonly" \
            --mount "type=bind,src=$preflight_dir,dst=/preflight" \
            --entrypoint yarn \
            "$BUILDER_IMAGE" \
            workspace @deadlock-live-probe/api test \
            recommendation-v8-candidate-coverage-preflight.spec.ts \
            --runInBand
          jq -e '.projectedCoverage >= .minimumRequiredCoverage' \
            "$preflight_dir/candidate-coverage-preflight.json"
          jq -e '.observedActionInjected == false' \
            "$preflight_dir/candidate-coverage-preflight.json"
          cat "$preflight_dir/candidate-coverage-preflight.json"
          echo "PREFLIGHT_DIR=$preflight_dir" >> "$GITHUB_ENV"

      - name: Commit validated implementation and consume request
        shell: bash
        run: |
          set -euo pipefail
          branch='agent/recommendation-value-v8-passive-shadow-1'
          request='.github/training-requests/recommendation-v8-prebaseline-filter-v1.json'
          implementation_sha="$(git rev-parse HEAD)"
          tmp="$(mktemp)"
          jq \
            --arg completedAt "$(date --iso-8601=seconds)" \
            --arg validationBaseSha "$implementation_sha" \
            '.state = "CONSUMED" | .completedAt = $completedAt | .validationBaseSha = $validationBaseSha' \
            "$request" > "$tmp"
          mv "$tmp" "$request"
          git config user.name 'Recommendation V8 Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make Recommendation V8 replay audit-ready'
          git fetch origin "$branch"
          git rebase "origin/$branch"
          git push origin "HEAD:$branch"
          git rev-parse HEAD | tee implementation-sha.txt

      - name: Delete failed derived artifacts and restart bounded run
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-recommendation-v8-terminal-outcome-cleanup-restart-5000-v3.sh

      - name: Capture restarted status
        if: always()
        shell: bash
        run: |
          set +e
          {
            date --iso-8601=seconds
            df -hT /
            sudo docker ps -a --filter 'name=deadlock-recommendation-v8-training'
            sudo docker inspect deadlock-recommendation-v8-training --format='running={{.State.Running}} status={{.State.Status}} exitCode={{.State.ExitCode}} oomKilled={{.State.OOMKilled}} startedAt={{.State.StartedAt}}'
            sudo docker exec deadlock-recommendation-v8-training sh -lc "pgrep -af '[r]un-recommendation-v8-diagnostic-only-pipeline.mjs' || true"
            curl -s --max-time 15 http://127.0.0.1:3010/deadlock/analysis/recommendation-historical-pro-replay/status | jq
          } | tee restarted-status.txt

      - name: Upload validation and restart evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v8-audit-ready-restart-v3-${{ github.run_id }}
          path: |
            implementation-sha.txt
            restarted-status.txt
            ${{ env.PREFLIGHT_DIR }}/candidate-coverage-preflight.json
          if-no-files-found: warn
          retention-days: 14

name: Apply inventory transaction reconstruction

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-inventory-transaction-reconstruction.yml
      - scripts/apply-inventory-transaction-reconstruction.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/reconstruct-inventory-transactions'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Apply implementation
        run: python3 scripts/apply-inventory-transaction-reconstruction.py

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build shared package
        run: yarn workspace @deadlock-live-probe/shared build

      - name: Build domain package
        run: yarn workspace @deadlock-live-probe/build-domain build

      - name: Build API
        shell: bash
        run: |
          set +e
          yarn workspace @deadlock-live-probe/api build > "$RUNNER_TEMP/api-build.log" 2>&1
          status=$?
          tail -n 200 "$RUNNER_TEMP/api-build.log"
          exit "$status"

      - name: Upload failed API build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reconstruction-api-build-log-${{ github.sha }}
          path: ${{ runner.temp }}/api-build.log
          if-no-files-found: error
          retention-days: 3

      - name: Test API
        run: yarn workspace @deadlock-live-probe/api test

      - name: Remove temporary implementation files
        run: rm .github/workflows/apply-inventory-transaction-reconstruction.yml scripts/apply-inventory-transaction-reconstruction.py

      - name: Verify diff
        run: git diff --check

      - name: Commit verified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: reconstruct inventory transactions"
          git push

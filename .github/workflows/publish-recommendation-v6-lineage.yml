name: Update Recommendation V6 expected commit

on:
  push:
    branches:
      - diagnostics/run-recommendation-v6-cycle-20260726
    paths:
      - .github/workflows/publish-recommendation-v6-lineage.yml

permissions:
  contents: write

jobs:
  update-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: diagnostics/run-recommendation-v6-cycle-20260726
          fetch-depth: 0

      - name: Update deployment commit
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const path = 'scripts/run-recommendation-v6-full-crawler-cycle.mjs';
          const previous = "const expectedCommit = '9590df07f7cb62db8ddae03794f9ba84339c5851';";
          const next = "const expectedCommit = '251660fc3dd541925b8ade9c55d216a91a975d85';";
          const content = readFileSync(path, 'utf8');
          const previousCount = content.split(previous).length - 1;
          const nextCount = content.split(next).length - 1;
          if (previousCount === 0 && nextCount === 1) {
            console.log('Expected deployment commit is already current.');
            process.exit(0);
          }
          if (previousCount !== 1) {
            throw new Error(`Expected exactly one old deployment commit, found ${previousCount}.`);
          }
          writeFileSync(path, content.replace(previous, next), 'utf8');
          NODE
          node --check scripts/run-recommendation-v6-full-crawler-cycle.mjs
          node --check scripts/validate-recommendation-v6-full-crawler-result.mjs

      - name: Commit runner update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-recommendation-v6-full-crawler-cycle.mjs
          git diff --cached --quiet && { echo 'No runner update to commit'; exit 0; }
          git commit -m "chore: run Recommendation V6 on lineage commit"
          git push origin HEAD:diagnostics/run-recommendation-v6-cycle-20260726

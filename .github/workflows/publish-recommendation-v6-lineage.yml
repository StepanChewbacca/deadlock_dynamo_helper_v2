name: Publish Recommendation V6 lineage

on:
  push:
    branches:
      - diagnostics/run-recommendation-v6-cycle-20260726
    paths:
      - .github/workflows/publish-recommendation-v6-lineage.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout lineage branch
        uses: actions/checkout@v4
        with:
          ref: agent/recommendation-v6-lineage
          fetch-depth: 0

      - name: Apply verified lineage edits
        shell: bash
        run: |
          set +e
          node .github/scripts/apply-recommendation-v6-lineage.cjs > "$RUNNER_TEMP/lineage-publish.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/lineage-publish.log"
          if [ "$status" -ne 0 ] && ! grep -q 'value-doc-lineage: expected one target' "$RUNNER_TEMP/lineage-publish.log"; then
            exit "$status"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build shared package
        run: yarn workspace @deadlock-live-probe/shared build

      - name: Build domain package
        run: yarn workspace @deadlock-live-probe/build-domain build

      - name: Build API
        run: yarn workspace @deadlock-live-probe/api build

      - name: Run lineage tests
        run: >-
          yarn workspace @deadlock-live-probe/api jest --runInBand
          recommendation-value-v6-training.spec.ts
          recommendation-policy-v6-evaluation.spec.ts
          recommendation-policy-v6-evaluation-integration.spec.ts

      - name: Commit lineage implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/deadlock-live/recommendation-value-v6-training.service.ts \
            apps/api/src/deadlock-live/recommendation-policy-v6-evaluation.service.ts \
            apps/api/test/recommendation-value-v6-training.spec.ts \
            apps/api/test/recommendation-policy-v6-evaluation-integration.spec.ts
          git diff --cached --quiet && { echo 'No lineage source changes to commit'; exit 1; }
          git commit -m "fix: verify Recommendation V6 dataset lineage"
          git push origin HEAD:agent/recommendation-v6-lineage

name: Recommendation V8 Audit Probe V1

on:
  push:
    branches:
      - agent/recommendation-value-v8-passive-shadow-1
    paths:
      - '.github/training-requests/recommendation-v8-audit-probe-v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Inspect bounded replay audit
        shell: bash
        run: |
          set -euo pipefail
          container='deadlock-recommendation-v8-training'
          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          replay="$storage/recommendation-historical-pro-replay-v1"
          bounded_root='/home/ubuntu/apps/deadlock_dynamo_helper-training-5000'
          bounded_run_dir="$(readlink -f "$bounded_root/current" 2>/dev/null || true)"
          report="$RUNNER_TEMP/recommendation-v8-audit-probe.txt"

          {
            echo "generatedAt=$(date --iso-8601=seconds)"
            echo "boundedRunDir=$bounded_run_dir"
            echo
            echo '=== container ==='
            sudo docker ps -a --filter "name=^/${container}$" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
            sudo docker inspect --format='running={{.State.Running}} status={{.State.Status}} exitCode={{.State.ExitCode}} oomKilled={{.State.OOMKilled}} startedAt={{.State.StartedAt}}' "$container" 2>/dev/null || true
            echo
            echo '=== replay status ==='
            curl --silent --show-error --max-time 20 http://127.0.0.1:3010/deadlock/analysis/recommendation-historical-pro-replay/status || true
            echo
            echo '=== replay audit endpoint ==='
            curl --silent --show-error --max-time 20 http://127.0.0.1:3010/deadlock/analysis/recommendation-historical-pro-replay/audit || true
            echo
            echo '=== replay audit file ==='
            sudo cat "$replay/audit.json" 2>/dev/null || true
            echo
            echo '=== replay manifest ==='
            sudo cat "$replay/manifest.json" 2>/dev/null || true
            echo
            echo '=== downstream status ==='
            curl --silent --show-error --max-time 20 http://127.0.0.1:3010/deadlock/analysis/recommendation-pro-decision-dataset-v6/status || true
            echo
            curl --silent --show-error --max-time 20 http://127.0.0.1:3010/deadlock/analysis/recommendation-behavioral-v5-training/status || true
            echo
            curl --silent --show-error --max-time 20 http://127.0.0.1:3010/deadlock/analysis/recommendation-value-v8-diagnostic/status || true
            echo
            echo '=== bounded training files ==='
            if [ -n "$bounded_run_dir" ]; then
              cat "$bounded_run_dir/run.json" 2>/dev/null || true
              cat "$bounded_run_dir/status.json" 2>/dev/null || true
              tail -n 240 "$bounded_run_dir/training.log" 2>/dev/null || true
            fi
            echo
            echo '=== recent container audit logs ==='
            sudo docker logs --since=3h "$container" 2>&1 | grep -E 'audit|Audit|failed|FAILED|COMPLETE|coverage|Replay|Dataset V6|Behavioral|diagnostic' | tail -n 300 || true
            echo
            echo '=== storage ==='
            df -hT /
            sudo du -sh "$replay" 2>/dev/null || true
          } | tee "$report"

          sudo cp "$replay/audit.json" "$RUNNER_TEMP/recommendation-historical-pro-replay-audit.json" 2>/dev/null || true
          sudo cp "$replay/manifest.json" "$RUNNER_TEMP/recommendation-historical-pro-replay-manifest.json" 2>/dev/null || true
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP"/recommendation-historical-pro-replay-*.json 2>/dev/null || true

      - name: Upload audit probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v8-audit-probe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/recommendation-v8-audit-probe.txt
            ${{ runner.temp }}/recommendation-historical-pro-replay-audit.json
            ${{ runner.temp }}/recommendation-historical-pro-replay-manifest.json
          if-no-files-found: warn
          retention-days: 7

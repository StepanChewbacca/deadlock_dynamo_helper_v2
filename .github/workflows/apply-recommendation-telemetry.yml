name: Apply recommendation telemetry

on:
  push:
    branches:
      - agent/persist-model-only-recommendation-decisions
    paths:
      - scripts/apply-recommendation-telemetry.py
      - scripts/fix-recommendation-telemetry-build.py
      - .github/workflows/apply-recommendation-telemetry.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/persist-model-only-recommendation-decisions' || github.ref_name == 'agent/persist-model-only-recommendation-decisions'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/persist-model-only-recommendation-decisions
          fetch-depth: 0

      - name: Apply implementation
        run: |
          python3 scripts/apply-recommendation-telemetry.py
          python3 scripts/fix-recommendation-telemetry-build.py

      - name: Validate patch
        run: git diff --check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build shared package
        run: yarn workspace @deadlock-live-probe/shared build

      - name: Build API
        shell: bash
        run: |
          set +e
          yarn workspace @deadlock-live-probe/api build > "$RUNNER_TEMP/api-build.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/api-build.log"
          exit "$status"

      - name: Upload failed API build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-telemetry-api-build-${{ github.run_id }}
          path: ${{ runner.temp }}/api-build.log
          if-no-files-found: error
          retention-days: 3

      - name: Test API
        shell: bash
        run: |
          set +e
          yarn workspace @deadlock-live-probe/api test > "$RUNNER_TEMP/api-test.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/api-test.log"
          exit "$status"

      - name: Upload failed API test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-telemetry-api-test-${{ github.run_id }}
          path: ${{ runner.temp }}/api-test.log
          if-no-files-found: error
          retention-days: 3

      - name: Test Overwolf client
        run: yarn workspace @deadlock-live-probe/overwolf-client test

      - name: Build Overwolf client
        env:
          OVERWOLF_PUBLIC_TARGET: ${{ runner.temp }}/overwolf-client/public
        run: yarn workspace @deadlock-live-probe/overwolf-client build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: persist model-only recommendation decisions"
          git push origin HEAD:agent/persist-model-only-recommendation-decisions

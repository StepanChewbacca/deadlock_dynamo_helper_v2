name: Recommendation V8 PostgreSQL Timeline Diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/recommendation-v8-postgres-timeline-diagnostics.yml'

permissions:
  actions: write
  contents: read

jobs:
  release-stale-recoveries:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only superseded recovery runs
        uses: actions/github-script@v7
        with:
          script: |
            const staleRunIds = [
              30401396801,
              30401396747,
              30401396668,
              30401396785,
              30401396750,
              30401396736,
            ];
            for (const runId of staleRunIds) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId,
                });
                core.notice(`Cancellation requested for superseded run ${runId}.`);
              } catch (error) {
                if (error.status === 409 || error.status === 404) {
                  core.notice(`Run ${runId} is already terminal or unavailable.`);
                } else {
                  throw error;
                }
              }
            }

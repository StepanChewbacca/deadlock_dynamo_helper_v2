name: Recommendation V8 PostgreSQL Timeline Diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/recommendation-v8-postgres-timeline-diagnostics.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: recommendation-v8-postgres-timeline-diagnostics
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Inspect PostgreSQL timeline sources
        shell: bash
        run: |
          set -euo pipefail
          db_container='aboba-telegramovich-postgres-1'
          db_name='deadlock_builds'
          report="$RUNNER_TEMP/recommendation-v8-postgres-timeline.md"
          psql_cmd=(sudo docker exec "$db_container" psql -X -U postgres -d "$db_name" -v ON_ERROR_STOP=1 -P pager=off)
          {
            echo '# Recommendation V8 PostgreSQL timeline diagnostics'
            echo
            echo "Generated: $(date --iso-8601=seconds)"
            echo
            echo '## Candidate database tables'
            echo '```text'
            "${psql_cmd[@]}" -Atc "SELECT schemaname || '.' || tablename FROM pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema') AND (tablename ILIKE '%timeline%' OR tablename ILIKE '%event%' OR tablename ILIKE '%match%' OR tablename ILIKE '%player%') ORDER BY 1;"
            echo '```'
            echo
            echo '## Table row estimates'
            echo '```text'
            "${psql_cmd[@]}" -Atc "SELECT relname || E'\t' || n_live_tup FROM pg_stat_user_tables WHERE relname ILIKE '%timeline%' OR relname ILIKE '%event%' OR relname ILIKE '%match%' OR relname ILIKE '%player%' ORDER BY relname;"
            echo '```'
            echo
            echo '## Raw metadata source counts'
            echo '```text'
            "${psql_cmd[@]}" -Atc "SELECT source || E'\t' || COUNT(*) FROM raw_match_metadata GROUP BY source ORDER BY COUNT(*) DESC;"
            echo '```'
            echo
            echo '## Latest payload top-level keys'
            echo '```text'
            "${psql_cmd[@]}" -Atc "WITH sample AS (SELECT payload FROM raw_match_metadata ORDER BY fetched_at DESC, id DESC LIMIT 20) SELECT key || E'\t' || COUNT(*) FROM sample CROSS JOIN LATERAL jsonb_object_keys(payload) AS key GROUP BY key ORDER BY COUNT(*) DESC, key;"
            echo '```'
            echo
            echo '## Latest match_info keys'
            echo '```text'
            "${psql_cmd[@]}" -Atc "WITH sample AS (SELECT payload->'match_info' AS info FROM raw_match_metadata WHERE jsonb_typeof(payload->'match_info')='object' ORDER BY fetched_at DESC, id DESC LIMIT 20) SELECT key || E'\t' || COUNT(*) FROM sample CROSS JOIN LATERAL jsonb_object_keys(info) AS key GROUP BY key ORDER BY COUNT(*) DESC, key;"
            echo '```'
            echo
            echo '## Latest player keys'
            echo '```text'
            "${psql_cmd[@]}" -Atc "WITH sample AS (SELECT player FROM raw_match_metadata raw CROSS JOIN LATERAL jsonb_array_elements(CASE WHEN jsonb_typeof(raw.payload#>'{match_info,players}')='array' THEN raw.payload#>'{match_info,players}' ELSE '[]'::jsonb END) player ORDER BY raw.fetched_at DESC, raw.id DESC LIMIT 240) SELECT key || E'\t' || COUNT(*) FROM sample CROSS JOIN LATERAL jsonb_object_keys(player) AS key GROUP BY key ORDER BY COUNT(*) DESC, key;"
            echo '```'
            echo
            echo '## Player fields related to time or stats'
            echo '```text'
            "${psql_cmd[@]}" -Atc "WITH sample AS (SELECT player FROM raw_match_metadata raw CROSS JOIN LATERAL jsonb_array_elements(CASE WHEN jsonb_typeof(raw.payload#>'{match_info,players}')='array' THEN raw.payload#>'{match_info,players}' ELSE '[]'::jsonb END) player ORDER BY raw.fetched_at DESC, raw.id DESC LIMIT 240), keys AS (SELECT DISTINCT key FROM sample CROSS JOIN LATERAL jsonb_object_keys(player) AS key) SELECT key FROM keys WHERE key ~* '(time|stat|gold|worth|damage|kill|death|assist|timeline|history|event)' ORDER BY key;"
            echo '```'
            echo
            echo '## JSON arrays in player payloads'
            echo '```text'
            "${psql_cmd[@]}" -Atc "WITH sample AS (SELECT player FROM raw_match_metadata raw CROSS JOIN LATERAL jsonb_array_elements(CASE WHEN jsonb_typeof(raw.payload#>'{match_info,players}')='array' THEN raw.payload#>'{match_info,players}' ELSE '[]'::jsonb END) player ORDER BY raw.fetched_at DESC, raw.id DESC LIMIT 240) SELECT key || E'\t' || COUNT(*) FROM sample CROSS JOIN LATERAL jsonb_each(player) entry(key,value) WHERE jsonb_typeof(value)='array' GROUP BY key ORDER BY COUNT(*) DESC, key;"
            echo '```'
            echo
            echo '## Example player payload structure'
            echo '```json'
            "${psql_cmd[@]}" -Atc "SELECT jsonb_pretty(player) FROM raw_match_metadata raw CROSS JOIN LATERAL jsonb_array_elements(CASE WHEN jsonb_typeof(raw.payload#>'{match_info,players}')='array' THEN raw.payload#>'{match_info,players}' ELSE '[]'::jsonb END) player ORDER BY raw.fetched_at DESC, raw.id DESC LIMIT 1;"
            echo '```'
            echo
            echo '## Timeline filesystem coverage'
            echo '```text'
            sudo docker exec deadlock-recommendation-v8-training sh -lc "find /app/apps/api/storage/match-timeline-events-v1 -mindepth 1 -maxdepth 1 -type d | wc -l" 2>&1 || true
            echo '```'
          } > "$report"
          echo "REPORT=$report" >> "$GITHUB_ENV"

      - name: Publish diagnostics issue
        uses: actions/github-script@v7
        env:
          REPORT: ${{ env.REPORT }}
        with:
          script: |
            const fs = require('fs');
            const title = '[debug] Recommendation V8 PostgreSQL timeline source';
            const raw = fs.readFileSync(process.env.REPORT, 'utf8');
            const body = raw.length > 62000 ? `${raw.slice(0, 62000)}\n\n[truncated]` : raw;
            const { data } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100 });
            const existing = data.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body, state: 'open' });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

name: Recommendation V8 PostgreSQL Timeline Diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/recommendation-v8-postgres-timeline-diagnostics.yml'

permissions:
  actions: write
  contents: read

jobs:
  release-stuck-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only stale diagnostic run
        uses: actions/github-script@v7
        with:
          script: |
            const staleRunId = 30400339075;
            try {
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: staleRunId,
              });
              core.notice(`Cancellation requested for stale diagnostic run ${staleRunId}.`);
            } catch (error) {
              if (error.status === 409 || error.status === 404) {
                core.notice(`Diagnostic run ${staleRunId} is already terminal or unavailable.`);
              } else {
                throw error;
              }
            }

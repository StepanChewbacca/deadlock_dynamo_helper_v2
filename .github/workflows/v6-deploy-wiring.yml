name: Wire V6 Deployment

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wire-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Add V6 deployment gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy.yml')
          content = path.read_text(encoding='utf-8')
          expected_sha = '799803f4882ca2ece436ab1087c41641713377f8a33f9bab0f0f4636a381938e'

          if 'Promote Recommendation Value V6 candidate' not in content:
              marker = '      - name: Rebuild and restart API\n'
              addition = (
                  '      - name: Promote Recommendation Value V6 candidate\n'
                  '        run: |\n'
                  '          set -euo pipefail\n'
                  '          cd /home/ubuntu/apps/deadlock_dynamo_helper\n'
                  '          sudo bash scripts/promote-recommendation-value-v6-live.sh\n\n'
              )
              if marker not in content:
                  raise RuntimeError('Rebuild deployment marker was not found.')
              content = content.replace(marker, addition + marker, 1)

          if 'Verify Recommendation Value V6 global canary locally' not in content:
              marker = '      - name: Restore DuckDNS record when needed\n'
              addition = (
                  '      - name: Verify Recommendation Value V6 global canary locally\n'
                  '        run: |\n'
                  '          set -euo pipefail\n'
                  '          cd /home/ubuntu/apps/deadlock_dynamo_helper\n'
                  '          sudo docker compose exec -T api node -e "const expectedSha = \'%s\'; fetch(\'http://127.0.0.1:3000/deadlock/analysis/recommendation-value-v6-live/status\').then(async (response) => { const status = await response.json(); console.log(JSON.stringify(status)); if (!response.ok || status.mode !== \'CANARY\' || status.rolloutScope !== \'ALL_USERS\' || status.allowlistCount !== 0 || status.model?.state !== \'READY\' || status.model?.modelSha256 !== expectedSha) process.exit(1); }).catch((error) => { console.error(error); process.exit(1); });"\n\n'
              ) % expected_sha
              if marker not in content:
                  raise RuntimeError('DuckDNS deployment marker was not found.')
              content = content.replace(marker, addition + marker, 1)

          if 'Verify Recommendation Value V6 through local HTTPS' not in content:
              marker = '      - name: Verify public API route\n'
              addition = (
                  '      - name: Verify Recommendation Value V6 through local HTTPS\n'
                  '        shell: bash\n'
                  '        run: |\n'
                  '          set -euo pipefail\n'
                  '          public_host="${PUBLIC_API_BASE_URL#https://}"\n'
                  '          public_host="${public_host%%/*}"\n'
                  '          public_host="${public_host%%:*}"\n'
                  '          status="$(curl --fail --show-error --silent \\\n'
                  '            --retry 10 \\\n'
                  '            --retry-delay 1 \\\n'
                  '            --retry-all-errors \\\n'
                  '            --resolve "$public_host:443:127.0.0.1" \\\n'
                  '            "$PUBLIC_API_BASE_URL/deadlock/analysis/recommendation-value-v6-live/status")"\n'
                  '          echo "$status"\n'
                  '          echo "$status" | grep -q \'"mode":"CANARY"\'\n'
                  '          echo "$status" | grep -q \'"rolloutScope":"ALL_USERS"\'\n'
                  '          echo "$status" | grep -q \'"allowlistCount":0\'\n'
                  '          echo "$status" | grep -q \'"state":"READY"\'\n'
                  '          echo "$status" | grep -q \'"modelSha256":"%s"\'\n\n'
              ) % expected_sha
              if marker not in content:
                  raise RuntimeError('Public API deployment marker was not found.')
              content = content.replace(marker, addition + marker, 1)

          if 'Verify Recommendation Value V6 public route' not in content:
              marker = '      - name: Show API logs on failure\n'
              addition = (
                  '      - name: Verify Recommendation Value V6 public route\n'
                  '        shell: bash\n'
                  '        run: |\n'
                  '          set -euo pipefail\n'
                  '          status="$(curl --fail --show-error --silent \\\n'
                  '            --retry 10 \\\n'
                  '            --retry-delay 3 \\\n'
                  '            --retry-all-errors \\\n'
                  '            "$PUBLIC_API_BASE_URL/deadlock/analysis/recommendation-value-v6-live/status")"\n'
                  '          echo "$status"\n'
                  '          echo "$status" | grep -q \'"mode":"CANARY"\'\n'
                  '          echo "$status" | grep -q \'"rolloutScope":"ALL_USERS"\'\n'
                  '          echo "$status" | grep -q \'"allowlistCount":0\'\n'
                  '          echo "$status" | grep -q \'"state":"READY"\'\n'
                  '          echo "$status" | grep -q \'"modelSha256":"%s"\'\n\n'
              ) % expected_sha
              if marker not in content:
                  raise RuntimeError('Failure-log deployment marker was not found.')
              content = content.replace(marker, addition + marker, 1)

          Path('deploy-patched.yml').write_text(content, encoding='utf-8')
          PY
      - name: Upload patched deployment workflow
        uses: actions/upload-artifact@v4
        with:
          name: v6-deploy-workflow-${{ github.sha }}
          path: deploy-patched.yml
          if-no-files-found: error
          retention-days: 1

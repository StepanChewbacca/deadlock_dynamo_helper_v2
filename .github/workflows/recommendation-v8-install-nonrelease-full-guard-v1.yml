name: Recommendation V8 Install Nonrelease Full Guard V1

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-v8-install-nonrelease-full-guard-v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recommendation-v8-install-nonrelease-full-guard-v1
  cancel-in-progress: false

jobs:
  install:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout guard source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Install fail-closed full-training guard
        shell: bash
        run: |
          set -euo pipefail
          container='deadlock-recommendation-v8-training'
          run_root='/home/ubuntu/apps/deadlock_dynamo_helper-training'
          run_dir="$(readlink -f "$run_root/current")"
          request='.github/training-requests/recommendation-v8-install-nonrelease-full-guard-v1.json'
          test "$(jq -r '.operation' "$request")" = 'INSTALL_NONRELEASE_FULL_GUARD_V1'
          test "$(jq -r '.productionRankingChanged' "$request")" = 'false'
          sudo docker inspect "$container" >/dev/null
          test -s "$run_dir/resolved-training-config.json"
          test "$(jq -r '.catalog.releaseEligible' "$run_dir/resolved-training-config.json")" = 'false'
          cp scripts/run-recommendation-v8-replay-audit-recovery-v2.mjs "$run_dir/run-recommendation-v8-replay-audit-recovery-v2.next.mjs"
          cat > "$run_dir/nonrelease-full-pipeline-guard.mjs" <<'JS'
          console.error(
            'Recommendation V8 full training blocked: historical catalog lineage is not release eligible.',
          );
          process.exitCode = 42;
          JS
          sudo docker cp "$run_dir/nonrelease-full-pipeline-guard.mjs" "$container:/app/scripts/run-recommendation-v8-pipeline.mjs"
          sudo docker exec "$container" node --check /app/scripts/run-recommendation-v8-pipeline.mjs
          sudo docker exec "$container" sh -lc "grep -F 'historical catalog lineage is not release eligible' /app/scripts/run-recommendation-v8-pipeline.mjs >/dev/null"
          cat > "$run_dir/nonrelease-full-guard.json" <<JSON
          {
            "installedAt": "$(date --iso-8601=seconds)",
            "container": "$container",
            "runDir": "$run_dir",
            "catalogReleaseEligible": false,
            "fullTrainingAllowed": false,
            "productionRankingChanged": false,
            "passiveShadowActivated": false,
            "randomizedCanaryAuthorized": false
          }
          JSON
          cat "$run_dir/nonrelease-full-guard.json"

      - name: Upload guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v8-nonrelease-full-guard-${{ github.run_id }}
          path: /home/ubuntu/apps/deadlock_dynamo_helper-training/current/nonrelease-full-guard.json
          if-no-files-found: warn
          retention-days: 14

name: Recommendation V8 Catalog Readiness SQL V1

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-v8-catalog-readiness-sql-v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recommendation-v8-catalog-readiness-sql-v1
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Query catalog and match lineage
        shell: bash
        run: |
          set -euo pipefail
          postgres='aboba-telegramovich-postgres-1'
          report="$RUNNER_TEMP/recommendation-v8-catalog-readiness.txt"
          sudo docker inspect "$postgres" >/dev/null
          {
            echo "generatedAt=$(date --iso-8601=seconds)"
            echo
            echo '=== item catalog versions ==='
            sudo docker exec "$postgres" psql -U postgres -d deadlock_builds -X -P pager=off -c 'SELECT id, "clientVersion", "contentCatalogVersionId", "rulesetId", "isCurrent", "importedAt", "payloadHash" FROM item_catalog_versions ORDER BY "clientVersion";'
            echo
            echo '=== game ruleset windows ==='
            sudo docker exec "$postgres" psql -U postgres -d deadlock_builds -X -P pager=off -c 'SELECT id, "rulesetKey", "clientVersion", status, source, "validFrom", "validTo" FROM game_rulesets ORDER BY "clientVersion";'
            echo
            echo '=== raw metadata client versions ==='
            sudo docker exec "$postgres" psql -U postgres -d deadlock_builds -X -P pager=off -c 'SELECT "clientVersion", COUNT(DISTINCT "matchId") AS matches, MIN("fetchedAt") AS first_fetched, MAX("fetchedAt") AS last_fetched FROM raw_match_metadata GROUP BY "clientVersion" ORDER BY "clientVersion";'
            echo
            echo '=== raw metadata resolution methods ==='
            sudo docker exec "$postgres" psql -U postgres -d deadlock_builds -X -P pager=off -c 'SELECT "rulesetResolutionMethod", COUNT(DISTINCT "matchId") AS matches, COUNT(*) AS rows FROM raw_match_metadata GROUP BY "rulesetResolutionMethod" ORDER BY "rulesetResolutionMethod";'
            echo
            echo '=== resolved catalog distribution ==='
            sudo docker exec "$postgres" psql -U postgres -d deadlock_builds -X -P pager=off -c 'SELECT r."resolvedCatalogVersionId", c."clientVersion", COUNT(DISTINCT r."matchId") AS matches FROM raw_match_metadata r LEFT JOIN item_catalog_versions c ON c.id = r."resolvedCatalogVersionId" GROUP BY r."resolvedCatalogVersionId", c."clientVersion" ORDER BY c."clientVersion";'
            echo
            echo '=== V3 match-window raw metadata distribution ==='
            sudo docker exec "$postgres" psql -U postgres -d deadlock_builds -X -P pager=off -c 'SELECT r."clientVersion", r."rulesetResolutionMethod", COUNT(DISTINCT r."matchId") AS matches FROM raw_match_metadata r JOIN matches m ON m."matchId" = r."matchId" WHERE m."startTime" >= TIMESTAMPTZ ''2026-07-18T12:31:22Z'' AND m."startTime" <= TIMESTAMPTZ ''2026-07-28T15:34:17Z'' GROUP BY r."clientVersion", r."rulesetResolutionMethod" ORDER BY r."clientVersion", r."rulesetResolutionMethod";'
            echo
            echo '=== policy-window raw metadata distribution ==='
            sudo docker exec "$postgres" psql -U postgres -d deadlock_builds -X -P pager=off -c 'SELECT r."clientVersion", r."rulesetResolutionMethod", COUNT(DISTINCT r."matchId") AS matches FROM raw_match_metadata r JOIN matches m ON m."matchId" = r."matchId" WHERE m."startTime" >= TIMESTAMPTZ ''2026-07-18T12:31:22Z'' AND m."startTime" <= TIMESTAMPTZ ''2026-07-22T09:32:54Z'' GROUP BY r."clientVersion", r."rulesetResolutionMethod" ORDER BY r."clientVersion", r."rulesetResolutionMethod";'
          } | tee "$report"

      - name: Upload SQL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v8-catalog-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/recommendation-v8-catalog-readiness.txt
          if-no-files-found: warn
          retention-days: 14

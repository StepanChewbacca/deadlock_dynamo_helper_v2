name: Apply recommendation V4 historical bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-recommendation-v4-historical-bootstrap.yml
      - scripts/apply-recommendation-v4-historical-bootstrap.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/add-recommendation-v4-historical-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Apply integration patch
        run: python3 scripts/apply-recommendation-v4-historical-bootstrap.py

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build shared package
        run: yarn workspace @deadlock-live-probe/shared build

      - name: Build domain package
        run: yarn workspace @deadlock-live-probe/build-domain build

      - name: Build API
        shell: bash
        run: |
          set +e
          yarn workspace @deadlock-live-probe/api build > "$RUNNER_TEMP/api-build.log" 2>&1
          status=$?
          tail -n 240 "$RUNNER_TEMP/api-build.log"
          exit "$status"

      - name: Upload failed API build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: historical-bootstrap-api-build-${{ github.sha }}
          path: ${{ runner.temp }}/api-build.log
          if-no-files-found: error
          retention-days: 3

      - name: Test API
        shell: bash
        run: |
          set +e
          yarn workspace @deadlock-live-probe/api test > "$RUNNER_TEMP/api-test.log" 2>&1
          status=$?
          tail -n 300 "$RUNNER_TEMP/api-test.log"
          exit "$status"

      - name: Upload failed API test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: historical-bootstrap-api-test-${{ github.sha }}
          path: ${{ runner.temp }}/api-test.log
          if-no-files-found: error
          retention-days: 3

      - name: Remove temporary implementation files
        run: rm .github/workflows/apply-recommendation-v4-historical-bootstrap.yml scripts/apply-recommendation-v4-historical-bootstrap.py

      - name: Verify diff
        run: git diff --check

      - name: Commit verified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add recommendation v4 historical bootstrap"
          git push

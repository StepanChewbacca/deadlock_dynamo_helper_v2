name: Recommendation V8 Bounded Diagnostic Recovery

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-v8-bounded-diagnostic-recovery.json'

permissions:
  contents: read

concurrency:
  group: recommendation-v8-bounded-diagnostic-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout recovery request
        uses: actions/checkout@v4

      - name: Validate and recover bounded diagnostic
        shell: bash
        run: |
          set -euo pipefail
          request='.github/training-requests/recommendation-v8-bounded-diagnostic-recovery.json'
          jq -e '.operation == "RECOVER_RECOMMENDATION_V8_DIAGNOSTIC_START" and .fullTrainingAuthorized == false and .productionRankingChanged == false and .passiveShadowActivated == false and .randomizedCanaryAuthorized == false and .auditThresholdsLowered == false and .observedActionInjected == false' "$request"

          container='deadlock-recommendation-v8-training'
          run_root='/home/ubuntu/apps/deadlock_dynamo_helper-training-5000'
          run_dir="$(readlink -f "$run_root/current")"
          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          replay="$storage/recommendation-historical-pro-replay-terminal-5000-v2"
          dataset="$storage/recommendation-pro-decision-dataset-v6-terminal-5000-v2"
          behavioral="$storage/recommendation-behavioral-v5-terminal-5000-v2"
          report="$RUNNER_TEMP/recommendation-v8-bounded-diagnostic-recovery.txt"

          replay_status="$(curl --silent --show-error --max-time 30 http://127.0.0.1:3010/deadlock/analysis/recommendation-historical-pro-replay/status || true)"
          dataset_status="$(curl --silent --show-error --max-time 30 http://127.0.0.1:3010/deadlock/analysis/recommendation-pro-decision-dataset-v6/status || true)"
          behavioral_status="$(curl --silent --show-error --max-time 30 http://127.0.0.1:3010/deadlock/analysis/recommendation-behavioral-v5-training/status || true)"

          sudo test -s "$replay/audit.json"
          sudo test -s "$replay/manifest.json"
          sudo test -s "$dataset/audit.json"
          sudo test -s "$dataset/manifest.json"
          sudo test -s "$behavioral/audit.json"
          sudo test -s "$behavioral/manifest.json"
          sudo test -s "$behavioral/evaluation.json"

          replay_audit="$(sudo cat "$replay/audit.json")"
          replay_manifest="$(sudo cat "$replay/manifest.json")"
          dataset_audit="$(sudo cat "$dataset/audit.json")"
          dataset_manifest="$(sudo cat "$dataset/manifest.json")"
          behavioral_audit="$(sudo cat "$behavioral/audit.json")"
          behavioral_manifest="$(sudo cat "$behavioral/manifest.json")"
          behavioral_evaluation="$(sudo cat "$behavioral/evaluation.json")"

          jq -e '.passed == true and .trainingArtifactEligible == true' <<<"$replay_audit"
          jq -e '.auditPassed == true and .trainingArtifactEligible == true' <<<"$replay_manifest"
          jq -e '.passed == true and .trainingArtifactEligible == true' <<<"$dataset_audit"
          jq -e '.auditPassed == true and .trainingArtifactEligible == true' <<<"$dataset_manifest"
          jq -e '.passed == true' <<<"$behavioral_audit"

          expected_replay_sha="$(jq -r '.replaySha256' "$run_dir/run.json")"
          test -n "$expected_replay_sha"
          actual_replay_sha="$(sudo sha256sum "$replay/dataset.ndjson" | awk '{print $1}')"
          test "$actual_replay_sha" = "$expected_replay_sha"

          value_status_before="$(curl --silent --show-error --max-time 30 http://127.0.0.1:3010/deadlock/analysis/recommendation-value-v8-diagnostic/status || true)"
          if jq -e '.state == "FAILED"' <<<"$value_status_before" >/dev/null 2>&1; then
            sudo rm -rf "$storage/recommendation-value-v8-diagnostic-terminal-5000-v2"
          fi

          sudo docker exec "$container" sh -lc "pkill -f '[r]un-recommendation-v8-diagnostic-only-pipeline.mjs' || true"
          catalog_version_id="$(sudo docker exec aboba-telegramovich-postgres-1 psql -U postgres -d deadlock_builds -X -A -t -c 'SELECT c.id FROM item_catalog_versions c WHERE c."clientVersion" = 6637 ORDER BY c.id DESC LIMIT 1;')"
          test -n "$catalog_version_id"

          sudo docker exec -d \
            -e API_BASE_URL=http://127.0.0.1:3000 \
            -e SNAPSHOT_ID=v8-5000-c6637-30701422914 \
            -e CANDIDATE_GENERATOR_VERSION=RECOMMENDATION_CANDIDATE_GENERATOR_V6_2_SUPPORT_UNION_5000 \
            -e CANDIDATE_POLICY_VERSION=RECOMMENDATION_CANDIDATE_POLICY_V6_2_SUPPORT_UNION_5000 \
            -e CATALOG_VERSION_ID="$catalog_version_id" \
            -e TRAINING_WINDOW_START=2026-07-18T12:31:22.000Z \
            -e TRAINING_WINDOW_END=2026-07-22T09:32:54.000Z \
            -e TUNING_START=2026-07-26T05:57:36.000Z \
            -e FUTURE_TEST_START=2026-07-27T20:43:24.000Z \
            -e REPLAY_PARTITION_COUNT=16 \
            -e REPLAY_SNAPSHOT_STALENESS_S=300 \
            -e DATASET_DECISION_SNAPSHOT_STALENESS_S=300 \
            -e DIAGNOSTIC_MAX_ROWS=50000 \
            -e PIPELINE_POLL_INTERVAL_MS=10000 \
            -e PIPELINE_TIMEOUT_MS=172800000 \
            -e PIPELINE_REQUEST_TIMEOUT_MS=30000 \
            -e PIPELINE_REQUEST_RETRY_COUNT=240 \
            -e PIPELINE_REQUEST_RETRY_DELAY_MS=5000 \
            "$container" \
            sh -lc 'node /app/scripts/run-recommendation-v8-diagnostic-only-pipeline.mjs >> /runner/training.log 2>&1'

          recovered=false
          value_status='{}'
          for attempt in $(seq 1 60); do
            value_status="$(curl --silent --show-error --max-time 15 http://127.0.0.1:3010/deadlock/analysis/recommendation-value-v8-diagnostic/status || true)"
            value_state="$(jq -r '.state // empty' <<<"$value_status" 2>/dev/null || true)"
            if [ "$value_state" = 'RUNNING' ] || [ "$value_state" = 'COMPLETE' ]; then
              recovered=true
              break
            fi
            if [ "$value_state" = 'FAILED' ]; then
              break
            fi
            sleep 2
          done

          {
            echo "generatedAt=$(date --iso-8601=seconds)"
            echo "replaySha256=$actual_replay_sha"
            echo "=== replay status ==="
            echo "$replay_status"
            echo "=== replay audit ==="
            echo "$replay_audit"
            echo "=== Dataset V6 status ==="
            echo "$dataset_status"
            echo "=== Dataset V6 audit ==="
            echo "$dataset_audit"
            echo "=== Behavioral V5 status ==="
            echo "$behavioral_status"
            echo "=== Behavioral V5 audit ==="
            echo "$behavioral_audit"
            echo "=== Behavioral V5 evaluation ==="
            echo "$behavioral_evaluation"
            echo "=== Value V8 before ==="
            echo "$value_status_before"
            echo "=== Value V8 after ==="
            echo "$value_status"
            echo "=== processes ==="
            sudo docker exec "$container" sh -lc "ps -eo pid,etime,rss,args | grep -E 'run-recommendation-v8-diagnostic-only-pipeline|monitor-recommendation-v8-disk-reserve' | grep -v grep || true"
            echo "=== container ==="
            sudo docker inspect --format='running={{.State.Running}} status={{.State.Status}} exitCode={{.State.ExitCode}} oomKilled={{.State.OOMKilled}} startedAt={{.State.StartedAt}}' "$container"
            echo "=== disk ==="
            df -hT /
            df -B1 /
            echo "=== training tail ==="
            tail -n 160 "$run_dir/training.log" || true
            echo "=== recent errors ==="
            sudo docker logs --since=60m "$container" 2>&1 | grep -E 'ERROR|WARN|failed|ENOSPC|OOM|killed|audit' | tail -n 200 || true
          } | tee "$report"

          test "$recovered" = 'true'
          sudo docker exec "$container" sh -lc "pgrep -f '[m]onitor-recommendation-v8-disk-reserve-v1.sh' >/dev/null"
          test "$(sudo docker inspect --format='{{.State.Running}}' "$container")" = 'true'
          test "$(sudo docker inspect --format='{{.State.OOMKilled}}' "$container")" = 'false'

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v8-bounded-diagnostic-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/recommendation-v8-bounded-diagnostic-recovery.txt
          if-no-files-found: warn
          retention-days: 7

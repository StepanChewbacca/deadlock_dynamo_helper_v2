name: Repair recovery API reset

on:
  pull_request:
    paths:
      - '.github/workflows/repair-recovery-api-reset.yml'
      - 'scripts/patch-full-crawler-recovery-api-reset.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: diagnostics/run-full-crawler-value-v5-20260725
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch recovery script and restart service when needed
        shell: bash
        run: |
          set +e
          mkdir -p repair-output
          {
            set -euxo pipefail
            unit=deadlock-full-crawler-recovery-v3-20260725.service
            installed=/home/ubuntu/deadlock-training-jobs/full-crawler-recovery-v3-20260725.mjs
            deploy=/home/ubuntu/apps/deadlock_dynamo_helper
            work="$RUNNER_TEMP/recovery-fixed.mjs"
            deployed_commit=$(git -C "$deploy" rev-parse HEAD)
            sudo cp "$installed" "$work"
            sudo chown "$(id -u):$(id -g)" "$work"
            python3 scripts/patch-full-crawler-recovery-api-reset.py "$work" "$deployed_commit"
            node --check "$work"
            changed=0
            sudo cmp -s "$work" "$installed" || changed=1
            sudo install -o ubuntu -g ubuntu -m 0644 "$work" "$installed"
            gzip -9 -c "$work" | base64 -w 0 > scripts/full-crawler-recovery-v3-20260725.mjs.gz.b64
            printf '\n' >> scripts/full-crawler-recovery-v3-20260725.mjs.gz.b64
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add scripts/full-crawler-recovery-v3-20260725.mjs.gz.b64
            if ! git diff --cached --quiet; then
              git commit -m 'fix: pin recovery to deployed production commit'
              git push origin HEAD:diagnostics/run-full-crawler-value-v5-20260725
            fi
            if [ "$changed" -eq 1 ]; then
              sudo systemctl restart "$unit"
              sleep 30
            fi
            sudo systemctl status --no-pager "$unit"
            sudo cat /home/ubuntu/deadlock-training-results/full-crawler-recovery-v3-20260725/state.json
            sudo tail -n 100 /home/ubuntu/deadlock-training-results/full-crawler-recovery-v3-20260725/service.log
          } > repair-output/repair.log 2>&1
          rc=$?
          cat repair-output/repair.log
          exit "$rc"
      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-api-reset-repair
          path: repair-output
          if-no-files-found: error
          retention-days: 3

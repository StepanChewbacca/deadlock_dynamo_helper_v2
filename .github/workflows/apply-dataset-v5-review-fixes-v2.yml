name: Apply Dataset V5 review fixes v2

on:
  push:
    branches:
      - agent/recommendation-dataset-v5
    paths:
      - .github/workflows/apply-dataset-v5-review-fixes-v2.yml

permissions:
  contents: write

concurrency:
  group: apply-dataset-v5-review-fixes-v2
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recommendation-dataset-v5
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Apply review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          collector_path = Path('apps/api/src/deadlock-live/match-timeline-collector.service.ts')
          collector = collector_path.read_text()
          old = """      passed:
                  session.status.eventCount > 0 &&
                  session.writeErrorCount === 0 &&
                  session.status.state !== 'FAILED',"""
          if old not in collector:
              old = """      passed:
                session.status.eventCount > 0 &&
                session.writeErrorCount === 0 &&
                session.status.state !== 'FAILED',"""
          new = """      passed:
                session.ended &&
                session.status.eventCount > 0 &&
                session.writeErrorCount === 0 &&
                session.status.state === 'COMPLETE',"""
          if old not in collector:
              raise SystemExit('collector audit block not found')
          collector_path.write_text(collector.replace(old, new, 1))

          dataset_path = Path('apps/api/src/deadlock-live/recommendation-decision-dataset-v5.service.ts')
          dataset = dataset_path.read_text()

          old = """      const previousActions: string[] = [];
              for (let index = 0; index < group.length; index += 1) {
                const row = group[index];"""
          if old not in dataset:
              old = """      const previousActions: string[] = [];
              for (let index = 0; index < group.length; index += 1) {
                const row = group[index];"""
          new = """      let previousActions = [...group[0].previousActionKeys];
              for (let index = 0; index < group.length; index += 1) {
                const row = group[index];
                const rowPreviousActions = mergeActionHistories(
                  previousActions,
                  row.previousActionKeys,
                );"""
          if old not in dataset:
              # Source uses six-space indentation in this block.
              old = """      const previousActions: string[] = [];
      for (let index = 0; index < group.length; index += 1) {
        const row = group[index];"""
              new = """      let previousActions = [...group[0].previousActionKeys];
      for (let index = 0; index < group.length; index += 1) {
        const row = group[index];
        const rowPreviousActions = mergeActionHistories(
          previousActions,
          row.previousActionKeys,
        );"""
          if old not in dataset:
              raise SystemExit('trajectory group block not found')
          dataset = dataset.replace(old, new, 1)

          old = """          previousActions,
                  timeline,"""
          if old not in dataset:
              old = """          previousActions,
          timeline,"""
          new = """          previousActions: rowPreviousActions,
          timeline,"""
          if old not in dataset:
              raise SystemExit('trajectory enrich argument not found')
          dataset = dataset.replace(old, new, 1)

          old = """        const action = row.observedLabel.exactActionKey;
                if (action) {
                  previousActions.push(action);
                }"""
          if old not in dataset:
              old = """        const action = row.observedLabel.exactActionKey;
        if (action) {
          previousActions.push(action);
        }"""
          new = """        previousActions = mergeActionHistories(
          rowPreviousActions,
          row.observedLabel.observedActionKeys,
        );"""
          if old not in dataset:
              raise SystemExit('trajectory append block not found')
          dataset = dataset.replace(old, new, 1)

          marker = '\nfunction enrich(input: {'
          helper = """
function mergeActionHistories(
  accumulated: readonly string[],
  additional: readonly string[],
): string[] {
  const normalizedAdditional = additional.filter((actionKey) => actionKey.length > 0);
  if (normalizedAdditional.length === 0) {
    return [...accumulated];
  }
  const maximumOverlap = Math.min(accumulated.length, normalizedAdditional.length);
  for (let overlap = maximumOverlap; overlap > 0; overlap -= 1) {
    const accumulatedSuffix = accumulated.slice(accumulated.length - overlap);
    const additionalPrefix = normalizedAdditional.slice(0, overlap);
    if (
      accumulatedSuffix.every(
        (actionKey, index) => actionKey === additionalPrefix[index],
      )
    ) {
      return [...accumulated, ...normalizedAdditional.slice(overlap)];
    }
  }
  return [...accumulated, ...normalizedAdditional];
}
"""
          if marker not in dataset:
              raise SystemExit('enrich marker not found')
          dataset = dataset.replace(marker, f'\n{helper}\nfunction enrich(input: {{', 1)

          old = """        input.timeline.objectives,
                    liveTeam(input.row.teamId),
                  ),"""
          if old not in dataset:
              old = """        input.timeline.objectives,
        liveTeam(input.row.teamId),
      ),"""
          new = """        input.timeline.objectives,
        liveTeam(input.row.teamId),
        input.snapshotStalenessS,
      ),"""
          if old not in dataset:
              raise SystemExit('horizon call not found')
          dataset = dataset.replace(old, new, 1)

          start = dataset.index('function horizonOutcome(')
          end = dataset.index('function snapshotFeature(', start)
          horizon = """function horizonOutcome(
  decisionTime: number,
  seconds: number,
  baseline: MatchTimelinePlayerSnapshot | undefined,
  snapshots: readonly MatchTimelinePlayerSnapshot[],
  objectives: readonly MatchTimelineObjectiveEvent[],
  teamId: number | undefined,
  snapshotStalenessS: number,
): Record<string, unknown> {
  const upper = decisionTime + seconds;
  const target = latestInWindow(snapshots, decisionTime, upper);
  const baselineStalenessS = baseline
    ? Math.max(0, decisionTime - baseline.gameTimeS)
    : undefined;
  const targetStalenessS = target
    ? Math.max(0, upper - target.gameTimeS)
    : undefined;
  const baselineFresh =
    baseline !== undefined &&
    baselineStalenessS !== undefined &&
    baselineStalenessS <= snapshotStalenessS;
  const targetFresh =
    target !== undefined &&
    targetStalenessS !== undefined &&
    targetStalenessS <= snapshotStalenessS;
  const events = objectives.filter(
    (event) => event.gameTimeS > decisionTime && event.gameTimeS <= upper,
  );
  if (!baselineFresh || !targetFresh || !baseline || !target) {
    return {
      available: false,
      horizonS: seconds,
      lowerBoundGameTimeS: decisionTime,
      upperBoundGameTimeS: upper,
      baselineAvailable: Boolean(baseline),
      baselineFresh,
      baselineStalenessS,
      targetAvailable: Boolean(target),
      targetFresh,
      targetStalenessS,
      objectiveEventCount: events.length,
      unavailableReason: !baseline
        ? 'MISSING_SNAPSHOT_AT_OR_BEFORE_DECISION'
        : !baselineFresh
          ? 'STALE_SNAPSHOT_AT_DECISION'
          : !target
            ? 'MISSING_SNAPSHOT_IN_HORIZON_WINDOW'
            : 'STALE_SNAPSHOT_AT_HORIZON',
    };
  }
  const ownObjectiveLossCount =
    teamId === undefined
      ? undefined
      : events.filter((event) => event.teamId === teamId).length;
  const enemyObjectiveLossCount =
    teamId === undefined
      ? undefined
      : events.filter(
          (event) => event.teamId !== undefined && event.teamId !== teamId,
        ).length;
  return {
    available: true,
    horizonS: seconds,
    lowerBoundGameTimeS: decisionTime,
    upperBoundGameTimeS: upper,
    baselineSnapshotGameTimeS: baseline.gameTimeS,
    baselineStalenessS,
    targetSnapshotGameTimeS: target.gameTimeS,
    targetStalenessS,
    killsDelta: target.kills - baseline.kills,
    deathsDelta: target.deaths - baseline.deaths,
    assistsDelta: target.assists - baseline.assists,
    netWorthDelta: target.netWorth - baseline.netWorth,
    heroDamageDelta: target.heroDamage - baseline.heroDamage,
    killParticipationDelta:
      target.kills + target.assists - baseline.kills - baseline.assists,
    survived: target.deaths === baseline.deaths,
    objectiveEventCount: events.length,
    ownObjectiveLossCount,
    enemyObjectiveLossCount,
  };
}

"""
          dataset = dataset[:start] + horizon + dataset[end:]

          old = """  const spikeCosts = progress
              .map((entry) => numeric(entry.missingCost))
              .filter((value) => value > 0);"""
          if old not in dataset:
              old = """  const spikeCosts = progress
    .map((entry) => numeric(entry.missingCost))
    .filter((value) => value > 0);"""
          new = """  const spikeCosts = progress
    .filter((entry) => entry.complete !== true)
    .map((entry) => numeric(entry.missingCost))
    .filter((value) => value > 0);"""
          if old not in dataset:
              raise SystemExit('power spike block not found')
          dataset = dataset.replace(old, new, 1)
          dataset_path.write_text(dataset)

          test_path = Path('apps/api/test/recommendation-decision-dataset-v5.spec.ts')
          test = test_path.read_text()
          old = "createRow({ decisionId: 'decision-1', gameTimeS: 100, inventoryStateKey: 'EMPTY', exactActionKey: 'BUY:1', candidateActionKeys: ['BUY:1', 'BUY:2'] })"
          new = "createRow({ decisionId: 'decision-1', gameTimeS: 100, inventoryStateKey: 'EMPTY', exactActionKey: 'BUY:1', candidateActionKeys: ['BUY:1', 'BUY:2'], previousActionKeys: ['BUY:9', 'SELL:9'] })"
          if old not in test:
              raise SystemExit('first test row not found')
          test = test.replace(old, new, 1)
          test = test.replace(
              "expect(first.trajectory.fullPreviousActionKeys).toEqual([]);",
              "expect(first.trajectory.fullPreviousActionKeys).toEqual(['BUY:9', 'SELL:9']);",
              1,
          )
          marker = "    expect(first.trajectory.nextObservedActionKey).toBe('BUY:2');"
          replacement = """    expect(first.trajectory.nextObservedActionKey).toBe('BUY:2');
    const second = outputRows.find((row) => row.decisionId === 'decision-2') as any;
    expect(second.trajectory.fullPreviousActionKeys).toEqual([
      'BUY:9',
      'SELL:9',
      'BUY:1',
    ]);"""
          if marker not in test:
              raise SystemExit('trajectory assertion marker not found')
          test = test.replace(marker, replacement, 1)
          old = "function createRow(input: { decisionId: string; gameTimeS: number; inventoryStateKey: string; exactActionKey: string; candidateActionKeys: string[] }): RecommendationDecisionDatasetV4Row {"
          new = "function createRow(input: { decisionId: string; gameTimeS: number; inventoryStateKey: string; exactActionKey: string; candidateActionKeys: string[]; previousActionKeys?: string[] }): RecommendationDecisionDatasetV4Row {"
          if old not in test:
              raise SystemExit('createRow signature not found')
          test = test.replace(old, new, 1)
          test = test.replace('    previousActionKeys: [],', '    previousActionKeys: input.previousActionKeys ?? [],', 1)
          test_path.write_text(test)
          PY
          rm -f .github/workflows/apply-dataset-v5-review-fixes.yml
          rm -f .github/workflows/apply-dataset-v5-review-fixes-v2.yml

      - name: Verify
        run: |
          yarn install --frozen-lockfile --ignore-engines
          yarn workspace @deadlock-live-probe/shared build
          yarn workspace @deadlock-live-probe/build-domain build
          yarn workspace @deadlock-live-probe/api build
          yarn workspace @deadlock-live-probe/api test --runInBand match-timeline-collector.spec.ts recommendation-decision-dataset-v5.spec.ts

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: require complete timeline outcomes"
          git push origin HEAD:agent/recommendation-dataset-v5

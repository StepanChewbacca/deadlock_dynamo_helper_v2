name: Recommendation V8 Training Monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: recommendation-v8-training-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check and recover detached training
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check training and apply safe recovery
        id: monitor
        shell: bash
        run: |
          set -uo pipefail

          run_root='/home/ubuntu/apps/deadlock_dynamo_helper-training'
          runs_root="$run_root/runs"
          current_link="$run_root/current"
          monitor_root="$run_root/monitor-audits"
          monitor_dir="$monitor_root/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          report="$monitor_dir/report.txt"
          summary="$monitor_dir/summary.json"
          monitor_state="$run_root/hourly-monitor-state.json"
          container='deadlock-recommendation-v8-training'
          api_base='http://127.0.0.1:3010'
          minimum_free_bytes=$((8 * 1024 * 1024 * 1024))
          repaired=false
          health='HEALTHY'
          reason='Training is healthy.'
          action_taken='NONE'

          sudo mkdir -p "$monitor_dir"
          sudo chown -R "$(id -u):$(id -g)" "$run_root"

          set_result() {
            health="$1"
            reason="$2"
            action_taken="$3"
          }

          append_report() {
            printf '%s\n' "$*" | tee -a "$report"
          }

          wait_for_api() {
            local attempt
            for attempt in $(seq 1 30); do
              if curl --fail --silent --max-time 10 "$api_base/deadlock/analysis/build-decision-dataset-v3/status" >/dev/null; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          supervisor_running() {
            sudo docker exec "$container" sh -lc "pgrep -f 'run-recommendation-v8-training-supervisor.mjs' >/dev/null" 2>/dev/null
          }

          start_supervisor() {
            local run_dir="$1"
            local run_id
            run_id="$(basename "$run_dir")"
            if [ ! -s "$run_dir/run-recommendation-v8-training-supervisor.mjs" ] || [ ! -s "$run_dir/run-recommendation-v8-real-data-v2.mjs" ]; then
              return 1
            fi
            sudo docker exec -d \
              -e API_BASE_URL=http://127.0.0.1:3000 \
              -e TRAINING_RUN_ID="$run_id" \
              -e TRAINING_LOG_PATH=/runner/training.log \
              -e TRAINING_STATUS_PATH=/runner/status.json \
              -e TRAINING_PIPELINE_SCRIPT=/runner/run-recommendation-v8-real-data-v2.mjs \
              -e MINIMUM_SOURCE_MATCH_COUNT=25000 \
              -e DIAGNOSTIC_MAX_ROWS=10000 \
              -e PIPELINE_POLL_INTERVAL_MS=15000 \
              -e PIPELINE_TIMEOUT_MS=172800000 \
              "$container" \
              node /runner/run-recommendation-v8-training-supervisor.mjs
            for attempt in $(seq 1 20); do
              if supervisor_running; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          {
            echo "Monitor generated at: $(date --iso-8601=seconds)"
            echo "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '=== Host resources ==='
            df -hT /
            df -ih /
            free -h
            echo
          } > "$report"

          active_run=''
          if [ -s "$current_link/status.json" ]; then
            active_run="$(readlink -f "$current_link")"
          fi
          if [ -z "$active_run" ] || [ ! -s "$active_run/status.json" ]; then
            active_run="$(find "$runs_root" -mindepth 2 -maxdepth 2 -type f -name status.json -printf '%T@ %h\n' 2>/dev/null | sort -nr | awk 'NR == 1 { print $2 }')"
            if [ -n "$active_run" ] && [ -s "$active_run/status.json" ]; then
              ln -sfn "$active_run" "$current_link"
              repaired=true
              action_taken='RESTORED_CURRENT_SYMLINK'
              append_report "Restored current symlink to $active_run."
            fi
          fi

          if [ -z "$active_run" ] || [ ! -s "$active_run/status.json" ]; then
            set_result 'FAILED' 'No detached Recommendation V8 training status file was found.' 'DIAGNOSTICS_ONLY'
          fi

          overall_state='UNKNOWN'
          overall_stage='UNKNOWN'
          if [ "$health" != 'FAILED' ]; then
            overall_state="$(jq -r '.state // "UNKNOWN"' "$active_run/status.json" 2>/dev/null || echo UNKNOWN)"
            overall_stage="$(jq -r '.stage // "UNKNOWN"' "$active_run/status.json" 2>/dev/null || echo UNKNOWN)"
            append_report "Active run: $active_run"
            append_report "Overall state/stage: $overall_state/$overall_stage"
            cat "$active_run/status.json" >> "$report"
            echo >> "$report"
          fi

          free_bytes="$(df --output=avail -B1 / | tail -n 1 | tr -d ' ')"
          if [ "$health" != 'FAILED' ] && [ "${free_bytes:-0}" -lt "$minimum_free_bytes" ]; then
            append_report 'Free disk space is below 8 GiB. Pruning old Docker build cache and dangling images.'
            sudo docker builder prune -af --filter 'until=168h' >> "$report" 2>&1 || true
            sudo docker image prune -f >> "$report" 2>&1 || true
            free_bytes="$(df --output=avail -B1 / | tail -n 1 | tr -d ' ')"
            repaired=true
            action_taken='PRUNED_OLD_DOCKER_CACHE'
            if [ "${free_bytes:-0}" -lt "$minimum_free_bytes" ]; then
              set_result 'FAILED' 'Free disk space remains below 8 GiB after safe Docker cache cleanup.' 'DIAGNOSTICS_ONLY'
            fi
          fi

          container_exists=false
          container_running=false
          if sudo docker inspect "$container" >/dev/null 2>&1; then
            container_exists=true
            if [ "$(sudo docker inspect --format='{{.State.Running}}' "$container" 2>/dev/null)" = 'true' ]; then
              container_running=true
            fi
          fi

          if [ "$health" != 'FAILED' ] && [ "$overall_state" = 'COMPLETE' ]; then
            set_result 'COMPLETE' 'Recommendation V8 offline training completed.' 'NONE'
          elif [ "$health" != 'FAILED' ]; then
            if [ "$container_exists" != 'true' ]; then
              set_result 'FAILED' 'Training container is missing and cannot be recreated safely without its original mount metadata.' 'DIAGNOSTICS_ONLY'
            elif [ "$container_running" != 'true' ]; then
              append_report 'Training container is stopped. Starting it.'
              if sudo docker start "$container" >> "$report" 2>&1 && wait_for_api; then
                repaired=true
                action_taken='STARTED_TRAINING_CONTAINER'
                container_running=true
              else
                set_result 'FAILED' 'Training container could not be started or its API did not recover.' 'DIAGNOSTICS_ONLY'
              fi
            fi
          fi

          if [ "$health" != 'FAILED' ] && [ "$health" != 'COMPLETE' ]; then
            if ! wait_for_api; then
              append_report 'Training API is unavailable. Restarting the isolated training container once.'
              if sudo docker restart "$container" >> "$report" 2>&1 && wait_for_api; then
                repaired=true
                action_taken='RESTARTED_TRAINING_CONTAINER'
              else
                set_result 'FAILED' 'Training API remained unavailable after one isolated-container restart.' 'DIAGNOSTICS_ONLY'
              fi
            fi
          fi

          source_json='{}'
          source_state='UNKNOWN'
          if [ "$health" != 'FAILED' ] && [ "$health" != 'COMPLETE' ]; then
            source_json="$(curl --fail --silent --max-time 15 "$api_base/deadlock/analysis/build-decision-dataset-v3/status" 2>/dev/null || echo '{}')"
            source_state="$(printf '%s' "$source_json" | jq -r '.state // "UNKNOWN"' 2>/dev/null || echo UNKNOWN)"
            append_report "Source Dataset V3 state: $source_state"
            printf '%s\n' "$source_json" >> "$report"

            if ! supervisor_running; then
              append_report 'Detached supervisor is not running.'
              if [ "$source_state" = 'RUNNING' ]; then
                set_result 'FAILED' 'The API auto-resumed Dataset V3, but the detached supervisor is missing. Blindly starting another supervisor would conflict with the active extraction.' 'WAIT_FOR_SAFE_RECOVERY'
              elif start_supervisor "$active_run"; then
                repaired=true
                action_taken='RESTARTED_TRAINING_SUPERVISOR'
                append_report 'Detached supervisor restarted successfully.'
              else
                set_result 'FAILED' 'Detached supervisor could not be restarted.' 'DIAGNOSTICS_ONLY'
              fi
            fi
          fi

          fingerprint_file="$monitor_dir/fingerprint.txt"
          if [ "$health" != 'FAILED' ] && [ "$health" != 'COMPLETE' ]; then
            {
              cat "$active_run/status.json" 2>/dev/null || true
              printf '%s\n' "$source_json"
              for endpoint in \
                recommendation-historical-pro-replay/status \
                recommendation-pro-decision-dataset-v6/status \
                recommendation-behavioral-v5-training/status \
                recommendation-value-v8-diagnostic/status \
                recommendation-value-v8-full-evaluation/status; do
                curl --silent --max-time 10 "$api_base/deadlock/analysis/$endpoint" 2>/dev/null || true
                echo
              done
              stat -c '%Y %s' "$active_run/training.log" 2>/dev/null || true
            } > "$fingerprint_file"
            fingerprint="$(sha256sum "$fingerprint_file" | awk '{print $1}')"
            previous_fingerprint="$(jq -r '.fingerprint // ""' "$monitor_state" 2>/dev/null || true)"
            previous_stale_count="$(jq -r '.staleCount // 0' "$monitor_state" 2>/dev/null || echo 0)"
            if [ "$fingerprint" = "$previous_fingerprint" ]; then
              stale_count=$((previous_stale_count + 1))
            else
              stale_count=0
            fi
            cat > "$monitor_state" <<JSON
          {
            "schemaVersion": 1,
            "checkedAt": "$(date --iso-8601=seconds)",
            "runDirectory": "$active_run",
            "fingerprint": "$fingerprint",
            "staleCount": $stale_count,
            "state": "$overall_state",
            "stage": "$overall_stage"
          }
          JSON
            append_report "Consecutive unchanged hourly fingerprints: $stale_count"
            if [ "$stale_count" -ge 3 ]; then
              set_result 'FAILED' 'Training progress was unchanged for at least three hourly checks. Automatic restart was withheld because a long model pass can legitimately be quiet.' 'DIAGNOSTICS_ONLY'
            fi
          fi

          if [ "$health" = 'HEALTHY' ] && [ "$repaired" = 'true' ]; then
            health='RECOVERED'
            reason='A recoverable training infrastructure problem was fixed automatically.'
          fi

          {
            echo
            echo '=== Container ==='
            sudo docker ps -a --filter name="$container" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
            sudo docker inspect --format='{{json .State}}' "$container" 2>/dev/null || true
            echo
            echo '=== Recent container logs ==='
            sudo docker logs --tail=200 "$container" 2>&1 || true
            echo
            echo '=== Recent training log ==='
            tail -n 200 "$active_run/training.log" 2>/dev/null || true
            echo
            echo '=== Final resources ==='
            df -hT /
            free -h
          } >> "$report"

          cat > "$summary" <<JSON
          {
            "schemaVersion": 1,
            "checkedAt": "$(date --iso-8601=seconds)",
            "health": "$health",
            "reason": $(jq -Rn --arg value "$reason" '$value'),
            "actionTaken": "$action_taken",
            "activeRun": "$active_run",
            "overallState": "$overall_state",
            "overallStage": "$overall_stage",
            "sourceState": "$source_state",
            "productionRankingChanged": false,
            "passiveShadowActivated": false,
            "randomizedCanaryAuthorized": false
          }
          JSON

          echo "MONITOR_HEALTH=$health" >> "$GITHUB_ENV"
          echo "MONITOR_REASON=$reason" >> "$GITHUB_ENV"
          echo "MONITOR_ACTION=$action_taken" >> "$GITHUB_ENV"
          echo "MONITOR_DIR=$monitor_dir" >> "$GITHUB_ENV"
          echo "MONITOR_REPORT=$report" >> "$GITHUB_ENV"
          echo "MONITOR_SUMMARY=$summary" >> "$GITHUB_ENV"
          cat "$summary"

      - name: Upload monitor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v8-training-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MONITOR_DIR }}
          if-no-files-found: warn
          retention-days: 30

      - name: Open or update incident
        if: env.MONITOR_HEALTH == 'FAILED'
        uses: actions/github-script@v7
        env:
          MONITOR_REASON: ${{ env.MONITOR_REASON }}
          MONITOR_ACTION: ${{ env.MONITOR_ACTION }}
        with:
          script: |
            const title = '[monitor] Recommendation V8 training needs attention';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The hourly Recommendation V8 training monitor detected a condition that was not safe to repair blindly.',
              '',
              `Reason: ${process.env.MONITOR_REASON}`,
              `Action: ${process.env.MONITOR_ACTION}`,
              `Workflow run: ${runUrl}`,
              '',
              'Production ranking was not changed. Passive shadow was not activated. Randomized canary remains unauthorized.',
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close resolved incident
        if: env.MONITOR_HEALTH != 'FAILED'
        uses: actions/github-script@v7
        env:
          MONITOR_HEALTH: ${{ env.MONITOR_HEALTH }}
          MONITOR_ACTION: ${{ env.MONITOR_ACTION }}
        with:
          script: |
            const title = '[monitor] Recommendation V8 training needs attention';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (!existing) return;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `Monitor state is now ${process.env.MONITOR_HEALTH}. Action: ${process.env.MONITOR_ACTION}. Run: ${runUrl}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Fail unsafe monitor result
        if: env.MONITOR_HEALTH == 'FAILED'
        run: exit 1

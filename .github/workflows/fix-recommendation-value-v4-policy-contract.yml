name: Fix recommendation Value V4 policy contract

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-recommendation-value-v4-policy-contract.yml
      - .github/scripts/fix-recommendation-value-v4-policy-contract.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/improve-recommendation-value-v4-context-model'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply policy contract fix
        run: python3 .github/scripts/fix-recommendation-value-v4-policy-contract.py

      - name: Remove temporary files
        run: rm -f .github/workflows/fix-recommendation-value-v4-policy-contract.yml .github/scripts/fix-recommendation-value-v4-policy-contract.py

      - name: Verify diff
        run: git diff --check

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/deadlock-live/recommendation-policy-v4-evaluation.service.ts apps/api/test/recommendation-policy-v4-evaluation.spec.ts .github/workflows/fix-recommendation-value-v4-policy-contract.yml .github/scripts/fix-recommendation-value-v4-policy-contract.py
          git commit -m "fix: update policy evaluator for value v4 context model"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

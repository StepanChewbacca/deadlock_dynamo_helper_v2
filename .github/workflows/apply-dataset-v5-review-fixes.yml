name: Apply Dataset V5 review fixes

on:
  push:
    branches:
      - agent/recommendation-dataset-v5
    paths:
      - .github/workflows/apply-dataset-v5-review-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-dataset-v5-review-fixes
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recommendation-dataset-v5
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Apply fixes
        run: python3 .github/scripts/apply-dataset-v5-review-fixes.py

      - name: Remove one-time files
        run: |
          rm -f .github/workflows/apply-dataset-v5-review-fixes.yml
          rm -f .github/workflows/apply-dataset-v5-review-fixes-v2.yml
          rm -f .github/scripts/apply-dataset-v5-review-fixes.py

      - name: Verify
        run: |
          yarn install --frozen-lockfile --ignore-engines
          yarn workspace @deadlock-live-probe/shared build
          yarn workspace @deadlock-live-probe/build-domain build
          yarn workspace @deadlock-live-probe/api build
          yarn workspace @deadlock-live-probe/api test --runInBand match-timeline-collector.spec.ts recommendation-decision-dataset-v5.spec.ts

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: require complete timeline outcomes"
          git push origin HEAD:agent/recommendation-dataset-v5

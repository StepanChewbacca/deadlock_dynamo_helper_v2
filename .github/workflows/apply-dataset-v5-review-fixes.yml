name: Apply Dataset V5 review fixes

on:
  push:
    branches:
      - agent/recommendation-dataset-v5
    paths:
      - .github/workflows/apply-dataset-v5-review-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-dataset-v5-review-fixes
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recommendation-dataset-v5
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Apply review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          collector = Path('apps/api/src/deadlock-live/match-timeline-collector.service.ts')
          collector_text = collector.read_text()
          old_audit = """      passed:
                  session.status.eventCount > 0 &&
                  session.writeErrorCount === 0 &&
                  session.status.state !== 'FAILED',"""
          new_audit = """      passed:
                  session.ended &&
                  session.status.eventCount > 0 &&
                  session.writeErrorCount === 0 &&
                  session.status.state === 'COMPLETE',"""
          if old_audit not in collector_text:
              raise SystemExit('Collector audit block was not found')
          collector.write_text(collector_text.replace(old_audit, new_audit, 1))

          dataset = Path('apps/api/src/deadlock-live/recommendation-decision-dataset-v5.service.ts')
          dataset_text = dataset.read_text()

          old_group_start = """      const previousActions: string[] = [];
              for (let index = 0; index < group.length; index += 1) {
                const row = group[index];"""
          new_group_start = """      let previousActions = [...group[0].previousActionKeys];
              for (let index = 0; index < group.length; index += 1) {
                const row = group[index];
                const rowPreviousActions = mergeActionHistories(
                  previousActions,
                  row.previousActionKeys,
                );"""
          if old_group_start not in dataset_text:
              raise SystemExit('Trajectory group start was not found')
          dataset_text = dataset_text.replace(old_group_start, new_group_start, 1)

          old_pass = """          previousActions,
                  timeline,"""
          new_pass = """          previousActions: rowPreviousActions,
                  timeline,"""
          if old_pass not in dataset_text:
              raise SystemExit('Trajectory enrich argument was not found')
          dataset_text = dataset_text.replace(old_pass, new_pass, 1)

          old_append = """        const action = row.observedLabel.exactActionKey;
                if (action) {
                  previousActions.push(action);
                }"""
          new_append = """        previousActions = mergeActionHistories(
                  rowPreviousActions,
                  row.observedLabel.observedActionKeys,
                );"""
          if old_append not in dataset_text:
              raise SystemExit('Trajectory append block was not found')
          dataset_text = dataset_text.replace(old_append, new_append, 1)

          helper_marker = "\nfunction enrich(input: {"
          helper = """
          function mergeActionHistories(
            accumulated: readonly string[],
            additional: readonly string[],
          ): string[] {
            const normalizedAdditional = additional.filter((actionKey) => actionKey.length > 0);
            if (normalizedAdditional.length === 0) {
              return [...accumulated];
            }
            const maximumOverlap = Math.min(accumulated.length, normalizedAdditional.length);
            for (let overlap = maximumOverlap; overlap > 0; overlap -= 1) {
              const accumulatedSuffix = accumulated.slice(accumulated.length - overlap);
              const additionalPrefix = normalizedAdditional.slice(0, overlap);
              if (
                accumulatedSuffix.every(
                  (actionKey, index) => actionKey === additionalPrefix[index],
                )
              ) {
                return [...accumulated, ...normalizedAdditional.slice(overlap)];
              }
            }
            return [...accumulated, ...normalizedAdditional];
          }
          """
          if helper_marker not in dataset_text:
              raise SystemExit('Enrich marker was not found')
          dataset_text = dataset_text.replace(helper_marker, f"\n{helper}\nfunction enrich(input: {{", 1)

          old_horizon_call = """        input.timeline.objectives,
                    liveTeam(input.row.teamId),
                  ),"""
          new_horizon_call = """        input.timeline.objectives,
                    liveTeam(input.row.teamId),
                    input.snapshotStalenessS,
                  ),"""
          if old_horizon_call not in dataset_text:
              raise SystemExit('Horizon call was not found')
          dataset_text = dataset_text.replace(old_horizon_call, new_horizon_call, 1)

          horizon_pattern = re.compile(
              r"function horizonOutcome\([\s\S]*?\n}\n\nfunction snapshotFeature\(",
              re.MULTILINE,
          )
          horizon_replacement = """function horizonOutcome(
            decisionTime: number,
            seconds: number,
            baseline: MatchTimelinePlayerSnapshot | undefined,
            snapshots: readonly MatchTimelinePlayerSnapshot[],
            objectives: readonly MatchTimelineObjectiveEvent[],
            teamId: number | undefined,
            snapshotStalenessS: number,
          ): Record<string, unknown> {
            const upper = decisionTime + seconds;
            const target = latestInWindow(snapshots, decisionTime, upper);
            const baselineStalenessS = baseline
              ? Math.max(0, decisionTime - baseline.gameTimeS)
              : undefined;
            const targetStalenessS = target
              ? Math.max(0, upper - target.gameTimeS)
              : undefined;
            const baselineFresh =
              baseline !== undefined &&
              baselineStalenessS !== undefined &&
              baselineStalenessS <= snapshotStalenessS;
            const targetFresh =
              target !== undefined &&
              targetStalenessS !== undefined &&
              targetStalenessS <= snapshotStalenessS;
            const events = objectives.filter(
              (event) => event.gameTimeS > decisionTime && event.gameTimeS <= upper,
            );
            if (!baselineFresh || !targetFresh || !baseline || !target) {
              return {
                available: false,
                horizonS: seconds,
                lowerBoundGameTimeS: decisionTime,
                upperBoundGameTimeS: upper,
                baselineAvailable: Boolean(baseline),
                baselineFresh,
                baselineStalenessS,
                targetAvailable: Boolean(target),
                targetFresh,
                targetStalenessS,
                objectiveEventCount: events.length,
                unavailableReason: !baseline
                  ? 'MISSING_SNAPSHOT_AT_OR_BEFORE_DECISION'
                  : !baselineFresh
                    ? 'STALE_SNAPSHOT_AT_DECISION'
                    : !target
                      ? 'MISSING_SNAPSHOT_IN_HORIZON_WINDOW'
                      : 'STALE_SNAPSHOT_AT_HORIZON',
              };
            }
            const ownObjectiveLossCount =
              teamId === undefined
                ? undefined
                : events.filter((event) => event.teamId === teamId).length;
            const enemyObjectiveLossCount =
              teamId === undefined
                ? undefined
                : events.filter(
                    (event) => event.teamId !== undefined && event.teamId !== teamId,
                  ).length;
            return {
              available: true,
              horizonS: seconds,
              lowerBoundGameTimeS: decisionTime,
              upperBoundGameTimeS: upper,
              baselineSnapshotGameTimeS: baseline.gameTimeS,
              baselineStalenessS,
              targetSnapshotGameTimeS: target.gameTimeS,
              targetStalenessS,
              killsDelta: target.kills - baseline.kills,
              deathsDelta: target.deaths - baseline.deaths,
              assistsDelta: target.assists - baseline.assists,
              netWorthDelta: target.netWorth - baseline.netWorth,
              heroDamageDelta: target.heroDamage - baseline.heroDamage,
              killParticipationDelta:
                target.kills + target.assists - baseline.kills - baseline.assists,
              survived: target.deaths === baseline.deaths,
              objectiveEventCount: events.length,
              ownObjectiveLossCount,
              enemyObjectiveLossCount,
            };
          }

          function snapshotFeature("""
          dataset_text, count = horizon_pattern.subn(horizon_replacement, dataset_text, count=1)
          if count != 1:
              raise SystemExit(f'Horizon function replacement count was {count}')

          old_spikes = """  const spikeCosts = progress
              .map((entry) => numeric(entry.missingCost))
              .filter((value) => value > 0);"""
          new_spikes = """  const spikeCosts = progress
              .filter((entry) => entry.complete !== true)
              .map((entry) => numeric(entry.missingCost))
              .filter((value) => value > 0);"""
          if old_spikes not in dataset_text:
              raise SystemExit('Power spike block was not found')
          dataset_text = dataset_text.replace(old_spikes, new_spikes, 1)
          dataset.write_text(dataset_text)

          test = Path('apps/api/test/recommendation-decision-dataset-v5.spec.ts')
          test_text = test.read_text()
          test_text = test_text.replace(
              "createRow({ decisionId: 'decision-1', gameTimeS: 100, inventoryStateKey: 'EMPTY', exactActionKey: 'BUY:1', candidateActionKeys: ['BUY:1', 'BUY:2'] })",
              "createRow({ decisionId: 'decision-1', gameTimeS: 100, inventoryStateKey: 'EMPTY', exactActionKey: 'BUY:1', candidateActionKeys: ['BUY:1', 'BUY:2'], previousActionKeys: ['BUY:9', 'SELL:9'] })",
              1,
          )
          test_text = test_text.replace(
              "expect(first.trajectory.fullPreviousActionKeys).toEqual([]);",
              "expect(first.trajectory.fullPreviousActionKeys).toEqual(['BUY:9', 'SELL:9']);",
              1,
          )
          assertion_marker = """    expect(first.trajectory.nextObservedActionKey).toBe('BUY:2');"""
          assertion_replacement = """    expect(first.trajectory.nextObservedActionKey).toBe('BUY:2');
              const second = outputRows.find((row) => row.decisionId === 'decision-2') as any;
              expect(second.trajectory.fullPreviousActionKeys).toEqual([
                'BUY:9',
                'SELL:9',
                'BUY:1',
              ]);"""
          if assertion_marker not in test_text:
              raise SystemExit('Trajectory assertion marker was not found')
          test_text = test_text.replace(assertion_marker, assertion_replacement, 1)
          old_input_type = """function createRow(input: { decisionId: string; gameTimeS: number; inventoryStateKey: string; exactActionKey: string; candidateActionKeys: string[] }): RecommendationDecisionDatasetV4Row {"""
          new_input_type = """function createRow(input: { decisionId: string; gameTimeS: number; inventoryStateKey: string; exactActionKey: string; candidateActionKeys: string[]; previousActionKeys?: string[] }): RecommendationDecisionDatasetV4Row {"""
          if old_input_type not in test_text:
              raise SystemExit('createRow input type was not found')
          test_text = test_text.replace(old_input_type, new_input_type, 1)
          test_text = test_text.replace(
              "    previousActionKeys: [],",
              "    previousActionKeys: input.previousActionKeys ?? [],",
              1,
          )
          test.write_text(test_text)
          PY
          rm .github/workflows/apply-dataset-v5-review-fixes.yml

      - name: Verify
        run: |
          yarn install --frozen-lockfile --ignore-engines
          yarn workspace @deadlock-live-probe/shared build
          yarn workspace @deadlock-live-probe/build-domain build
          yarn workspace @deadlock-live-probe/api build
          yarn workspace @deadlock-live-probe/api test --runInBand match-timeline-collector.spec.ts recommendation-decision-dataset-v5.spec.ts

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/deadlock-live/match-timeline-collector.service.ts apps/api/src/deadlock-live/recommendation-decision-dataset-v5.service.ts apps/api/test/recommendation-decision-dataset-v5.spec.ts .github/workflows/apply-dataset-v5-review-fixes.yml
          git commit -m "fix: require complete timeline outcomes"
          git push origin HEAD:agent/recommendation-dataset-v5

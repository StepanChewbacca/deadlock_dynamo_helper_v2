name: Diagnose full-roster matchup signals

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-matchup-full-roster.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Verify deployed model-only full-roster signal
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/apps/deadlock_dynamo_helper
          expected='614febb85ce5bab0a28b691d7ee248dbf5aa0ed9'
          for attempt in $(seq 1 36); do
            current="$(git rev-parse HEAD)"
            if git merge-base --is-ancestor "$expected" "$current"; then
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "Deployment did not reach $expected; current HEAD is $current" >&2
              exit 1
            fi
            sleep 5
          done

          status="$(curl --fail --show-error --silent --max-time 20 http://127.0.0.1:3000/deadlock/analysis/contextual-v3-live/status)"
          echo "$status"
          echo "$status" | python3 -c "import json,sys; x=json.load(sys.stdin); assert x['mode']=='PRODUCTION'; assert x['model']['state']=='READY'; assert x['modelOnly'] is True; assert x['fallbackEnabled'] is False; assert x['baselineResponseCount']==0; assert x['fallbackCount']==0; assert x['modelErrorCount']==0"

          sudo docker compose exec -T api node <<'NODE'
          const fs = require('node:fs');

          void (async () => {
            const model = JSON.parse(
              fs.readFileSync('/app/apps/api/storage/contextual-v3-training/model.json', 'utf8'),
            );
            const heroIds = Object.keys(model.counts.hero)
              .map(Number)
              .filter((value) => Number.isSafeInteger(value) && value > 0)
              .sort((left, right) => left - right);
            const enemyIds = [...new Set(
              Object.keys(model.counts.enemy)
                .map((key) => Number(key.split('|')[2]))
                .filter((value) => Number.isSafeInteger(value) && value > 0),
            )].sort((left, right) => left - right);
            const phaseTimes = [0, 600, 1200];
            let attempts = 0;
            let found;

            outer:
            for (const heroId of heroIds) {
              const roster = enemyIds.filter((enemyId) => enemyId !== heroId).slice(0, 5);
              if (roster.length !== 5) {
                continue;
              }
              for (const gameTimeS of phaseTimes) {
                attempts += 1;
                const response = await fetch(
                  'http://127.0.0.1:3000/deadlock/analysis/build-recommendation',
                  {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                      heroId,
                      itemIds: [],
                      gameTimeS,
                      alliedHeroIds: [],
                      enemyHeroIds: roster,
                      previousActionKeys: [],
                      limit: 20,
                      minAlternativeHistoricalCount: 0,
                      minAlternativeConfidence: 0,
                    }),
                  },
                );
                if (!response.ok) {
                  throw new Error(`Recommendation HTTP ${response.status}`);
                }
                const recommendation = await response.json();
                if (recommendation.recommendationModel !== 'CONTEXTUAL_V3') {
                  throw new Error('Recommendation did not come from Contextual V3');
                }
                const normalizedRoster = recommendation.contextualFeatures?.enemyHeroIds ?? [];
                if (normalizedRoster.length !== 5) {
                  continue;
                }
                const actions = [recommendation.action, ...recommendation.alternatives];
                const action = actions.find(
                  (candidate) =>
                    Array.isArray(candidate.matchupSignals) &&
                    candidate.matchupSignals.length > 0,
                );
                if (action) {
                  found = {
                    attempts,
                    heroId,
                    gameTimeS,
                    enemyHeroIds: normalizedRoster,
                    actionKey: action.actionKey,
                    label: action.label,
                    matchupSignals: action.matchupSignals,
                    recommendationModel: recommendation.recommendationModel,
                  };
                  break outer;
                }
              }
            }

            if (!found) {
              throw new Error(`No full-roster matchup signal found in ${attempts} recommendations`);
            }
            const strongest = found.matchupSignals[0];
            if (!(strongest.modelLiftPercent >= 0.5)) {
              throw new Error('Full-roster signal was still below the visibility threshold');
            }
            console.log(JSON.stringify(found));
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

          final_status="$(curl --fail --show-error --silent --max-time 20 http://127.0.0.1:3000/deadlock/analysis/contextual-v3-live/status)"
          echo "$final_status"
          echo "$final_status" | python3 -c "import json,sys; x=json.load(sys.stdin); assert x['modelOnly'] is True; assert x['fallbackEnabled'] is False; assert x['baselineResponseCount']==0; assert x['fallbackCount']==0; assert x['modelErrorCount']==0"

name: Recommendation V8 Release Stage Watch V1

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-v8-release-stage-watch-v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recommendation-v8-release-stage-watch-v1
  cancel-in-progress: true

jobs:
  watch:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Checkout watch request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Watch snapshot to replay transition
        shell: bash
        run: |
          set -euo pipefail
          run_root='/home/ubuntu/apps/deadlock_dynamo_helper-training'
          run_dir="$(readlink -f "$run_root/current")"
          container='deadlock-recommendation-v8-training'
          report="$RUNNER_TEMP/recommendation-v8-release-stage-watch.txt"
          expected_run='30638488726-1-release-c6637-v2'
          test "$(jq -r '.runId' "$run_dir/status.json")" = "$expected_run"
          : > "$report"
          previous=''
          for attempt in $(seq 1 180); do
            now="$(date --iso-8601=seconds)"
            supervisor="$(cat "$run_dir/status.json" 2>/dev/null || echo '{}')"
            snapshot="$(curl --silent --show-error --max-time 15 http://127.0.0.1:3010/deadlock/analysis/recommendation-candidate-generator-snapshots/status || echo '{}')"
            replay="$(curl --silent --show-error --max-time 15 http://127.0.0.1:3010/deadlock/analysis/recommendation-historical-pro-replay/status || echo '{}')"
            summary="$(jq -cn --arg now "$now" --argjson supervisor "$supervisor" --argjson snapshot "$snapshot" --argjson replay "$replay" '{time:$now,supervisor:{state:$supervisor.state,stage:$supervisor.stage,error:$supervisor.error},snapshot:{state:$snapshot.state,phase:$snapshot.phase,sourceRowCount:$snapshot.sourceRowCount,selectedRowCount:$snapshot.selectedRowCount,heroCount:$snapshot.heroCount,stateCount:$snapshot.stateCount,actionOptionCount:$snapshot.actionOptionCount,error:$snapshot.error},replay:{state:$replay.state,phase:$replay.phase,sourceRowCount:$replay.sourceRowCount,processedPartitionCount:$replay.processedPartitionCount,partitionCount:$replay.partitionCount,outputRowCount:$replay.outputRowCount,auditPassed:$replay.auditPassed,error:$replay.error}}')"
            if [ "$summary" != "$previous" ]; then
              echo "$summary" | tee -a "$report"
              previous="$summary"
            fi
            supervisor_state="$(echo "$supervisor" | jq -r '.state // empty')"
            snapshot_state="$(echo "$snapshot" | jq -r '.state // empty')"
            replay_state="$(echo "$replay" | jq -r '.state // empty')"
            if [ "$supervisor_state" = 'FAILED' ] || [ "$snapshot_state" = 'FAILED' ] || [ "$replay_state" = 'FAILED' ]; then
              break
            fi
            if [ "$snapshot_state" = 'COMPLETE' ] || [ "$replay_state" = 'RUNNING' ] || [ "$replay_state" = 'COMPLETE' ]; then
              break
            fi
            if ! sudo docker inspect "$container" >/dev/null 2>&1 || [ "$(sudo docker inspect --format='{{.State.Running}}' "$container")" != 'true' ]; then
              echo '{"error":"isolated container is not running"}' | tee -a "$report"
              break
            fi
            sleep 30
          done
          {
            echo
            echo '=== final supervisor status ==='
            cat "$run_dir/status.json" 2>/dev/null || true
            echo
            echo '=== snapshot status ==='
            curl --silent --show-error --max-time 20 http://127.0.0.1:3010/deadlock/analysis/recommendation-candidate-generator-snapshots/status || true
            echo
            echo
            echo '=== replay status ==='
            curl --silent --show-error --max-time 20 http://127.0.0.1:3010/deadlock/analysis/recommendation-historical-pro-replay/status || true
            echo
            echo
            echo '=== replay audit ==='
            curl --silent --show-error --max-time 20 http://127.0.0.1:3010/deadlock/analysis/recommendation-historical-pro-replay/audit || true
            echo
            echo
            echo '=== artifact files ==='
            sudo find /var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data/recommendation-candidate-generator-snapshots /var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data/recommendation-historical-pro-replay-v1 -maxdepth 3 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TS %s %p\n' 2>/dev/null | sort | tail -n 100 || true
            echo
            echo '=== training log tail ==='
            tail -n 400 "$run_dir/training.log" 2>/dev/null || true
            echo
            echo '=== container log tail ==='
            sudo docker logs --tail=300 "$container" 2>&1 || true
          } | tee -a "$report"

      - name: Upload stage watch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v8-release-stage-watch-${{ github.run_id }}
          path: ${{ runner.temp }}/recommendation-v8-release-stage-watch.txt
          if-no-files-found: warn
          retention-days: 14

name: Apply Recommendation V6 lineage

on:
  push:
    branches:
      - agent/recommendation-v6-lineage
    paths:
      - .github/patches/recommendation-v6-lineage.patch
      - .github/workflows/apply-recommendation-v6-lineage.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout lineage branch
        uses: actions/checkout@v4
        with:
          ref: agent/recommendation-v6-lineage
          fetch-depth: 0

      - name: Apply verified TypeScript edits
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync, writeFileSync, rmSync } = require('node:fs');

          const lines = (...values) => values.join('\n');
          const replaceOnce = (path, before, after) => {
            const content = readFileSync(path, 'utf8');
            const count = content.split(before).length - 1;
            if (count !== 1) {
              throw new Error(`${path}: expected one replacement target, found ${count}`);
            }
            writeFileSync(path, content.replace(before, after), 'utf8');
          };

          const valuePath = 'apps/api/src/deadlock-live/recommendation-value-v6-training.service.ts';
          replaceOnce(
            valuePath,
            lines(
              'interface SourceArtifacts {',
              '  manifest: Record<string, unknown>;',
              '  audit: Record<string, unknown>;',
              '  sha256: string;',
              '  rowCount: number;',
              '}',
            ),
            lines(
              'interface SourceArtifacts {',
              '  manifest: Record<string, unknown>;',
              '  audit: Record<string, unknown>;',
              '  sha256: string;',
              '  upstreamDatasetV4Sha256: string;',
              '  rowCount: number;',
              '}',
            ),
          );
          replaceOnce(
            valuePath,
            lines(
              '          datasetVersion: source.manifest.datasetVersion,',
              '          expectedSha256: options.expectedSourceSha256,',
            ),
            lines(
              '          datasetVersion: source.manifest.datasetVersion,',
              '          upstreamDatasetV4Sha256: source.upstreamDatasetV4Sha256,',
              '          expectedSha256: options.expectedSourceSha256,',
            ),
          );
          replaceOnce(
            valuePath,
            lines(
              '          datasetVersion: source.manifest.datasetVersion,',
              '          artifactSha256: source.sha256,',
              '          sourceRowCount: sourceSummary.sourceRowCount,',
            ),
            lines(
              '          datasetVersion: source.manifest.datasetVersion,',
              '          artifactSha256: source.sha256,',
              '          upstreamDatasetV4Sha256: source.upstreamDatasetV4Sha256,',
              '          sourceRowCount: sourceSummary.sourceRowCount,',
            ),
          );
          replaceOnce(
            valuePath,
            lines(
              '    const audit = await requiredJson(this.sourceAuditPath);',
              '    if (manifest.datasetVersion !== RECOMMENDATION_DECISION_DATASET_V5_VERSION) {',
              "      throw new Error('Recommendation Value V6 requires Dataset V5.2.');",
              '    }',
              '    if (audit.passed !== true) {',
              "      throw new Error('Recommendation Dataset V5.2 did not pass its audit.');",
              '    }',
              '    const artifact = record(manifest.artifact);',
            ),
            lines(
              '    const audit = await requiredJson(this.sourceAuditPath);',
              '    if (manifest.datasetVersion !== RECOMMENDATION_DECISION_DATASET_V5_VERSION) {',
              "      throw new Error('Recommendation Value V6 requires Dataset V5.3.');",
              '    }',
              '    if (audit.passed !== true) {',
              "      throw new Error('Recommendation Dataset V5.3 did not pass its audit.');",
              '    }',
              '    const upstreamDatasetV4Sha256 = requiredSha(',
              '      record(manifest.source).sha256,',
              '    );',
              '    const artifact = record(manifest.artifact);',
            ),
          );
          replaceOnce(
            valuePath,
            '`Recommendation Dataset V5.2 artifact hash mismatch: ${actualSha256} versus ${expectedSha256}.`',
            '`Recommendation Dataset V5.3 artifact hash mismatch: ${actualSha256} versus ${expectedSha256}.`',
          );
          replaceOnce(
            valuePath,
            lines(
              '      manifest,',
              '      audit,',
              '      sha256: actualSha256,',
              '      rowCount: numeric(artifact.rowCount),',
            ),
            lines(
              '      manifest,',
              '      audit,',
              '      sha256: actualSha256,',
              '      upstreamDatasetV4Sha256,',
              '      rowCount: numeric(artifact.rowCount),',
            ),
          );
          replaceOnce(
            valuePath,
            "    throw new Error('Recommendation Dataset V5.2 row count does not match manifest.');",
            "    throw new Error('Recommendation Dataset V5.3 row count does not match manifest.');",
          );

          const policyPath = 'apps/api/src/deadlock-live/recommendation-policy-v6-evaluation.service.ts';
          replaceOnce(
            policyPath,
            lines(
              '  hashes: {',
              '    behavioralValidation: string;',
              '    behavioralModel: string;',
              '    valuePrediction: string;',
              '    valueModel: string;',
              '  };',
              '}',
            ),
            lines(
              '  hashes: {',
              '    behavioralValidation: string;',
              '    behavioralModel: string;',
              '    valuePrediction: string;',
              '    valueModel: string;',
              '  };',
              '  lineage: {',
              '    behavioralDatasetV4Sha256: string;',
              '    valueDatasetV4Sha256: string;',
              '  };',
              '}',
            ),
          );
          replaceOnce(
            policyPath,
            lines(
              '          valueDatasetVersion: readNestedString(',
              '            sources.valueManifest,',
              "            ['source', 'datasetVersion'],",
              '          ),',
              '          hashes: sources.hashes,',
            ),
            lines(
              '          valueDatasetVersion: readNestedString(',
              '            sources.valueManifest,',
              "            ['source', 'datasetVersion'],",
              '          ),',
              '          lineage: sources.lineage,',
              '          hashes: sources.hashes,',
            ),
          );
          replaceOnce(
            policyPath,
            lines(
              '    ) {',
              "      throw new Error('Recommendation Policy V6 requires Dataset V5.3 lineage.');",
              '    }',
              '    const behavioralModel = parseBehavioralModel(behavioralModelValue);',
            ),
            lines(
              '    ) {',
              "      throw new Error('Recommendation Policy V6 requires Dataset V5.3 lineage.');",
              '    }',
              '    const behavioralDatasetV4Sha256 = requiredSha(',
              '      readNestedString(behavioralManifest, [',
              "        'source',",
              "        'artifactSha256',",
              '      ]),',
              "      'Behavioral V4 source Dataset V4 SHA-256',",
              '    );',
              '    const valueDatasetV4Sha256 = requiredSha(',
              '      readNestedString(valueManifest, [',
              "        'source',",
              "        'upstreamDatasetV4Sha256',",
              '      ]),',
              "      'Value V6 upstream Dataset V4 SHA-256',",
              '    );',
              '    if (behavioralDatasetV4Sha256 !== valueDatasetV4Sha256) {',
              '      throw new Error(',
              "        'Behavioral V4 and Value V6 do not share the same Dataset V4 lineage.',",
              '      );',
              '    }',
              '    const behavioralModel = parseBehavioralModel(behavioralModelValue);',
            ),
          );
          replaceOnce(
            policyPath,
            lines(
              '      valueAudit,',
              '      hashes,',
              '    };',
            ),
            lines(
              '      valueAudit,',
              '      hashes,',
              '      lineage: {',
              '        behavioralDatasetV4Sha256,',
              '        valueDatasetV4Sha256,',
              '      },',
              '    };',
            ),
          );
          replaceOnce(
            policyPath,
            lines(
              '      valueDatasetVersion: readNestedString(',
              '        input.sources.valueManifest,',
              "        ['source', 'datasetVersion'],",
              '      ),',
              '      hashes: input.sources.hashes,',
            ),
            lines(
              '      valueDatasetVersion: readNestedString(',
              '        input.sources.valueManifest,',
              "        ['source', 'datasetVersion'],",
              '      ),',
              '      lineage: input.sources.lineage,',
              '      hashes: input.sources.hashes,',
            ),
          );
          replaceOnce(
            policyPath,
            lines(
              'function requiredText(value: unknown, name: string): string {',
              '  const result = text(value);',
              '  if (!result) {',
              '    throw new Error(`${name} must be a non-empty string.`);',
              '  }',
              '  return result;',
              '}',
              '',
              'function requiredBoolean(value: unknown, name: string): boolean {',
            ),
            lines(
              'function requiredText(value: unknown, name: string): string {',
              '  const result = text(value);',
              '  if (!result) {',
              '    throw new Error(`${name} must be a non-empty string.`);',
              '  }',
              '  return result;',
              '}',
              '',
              'function requiredSha(value: unknown, name: string): string {',
              '  const result = requiredText(value, name).toLowerCase();',
              '  if (!/^[a-f0-9]{64}$/.test(result)) {',
              '    throw new Error(`${name} must be a SHA-256 digest.`);',
              '  }',
              '  return result;',
              '}',
              '',
              'function requiredBoolean(value: unknown, name: string): boolean {',
            ),
          );

          const valueTestPath = 'apps/api/test/recommendation-value-v6-training.spec.ts';
          replaceOnce(
            valueTestPath,
            lines(
              '        datasetVersion: RECOMMENDATION_DECISION_DATASET_V5_VERSION,',
              '        actualSha256: sourceSha256,',
            ),
            lines(
              '        datasetVersion: RECOMMENDATION_DECISION_DATASET_V5_VERSION,',
              '        actualSha256: sourceSha256,',
              "        upstreamDatasetV4Sha256: 'a'.repeat(64),",
            ),
          );
          replaceOnce(
            valueTestPath,
            lines(
              '        datasetVersion: RECOMMENDATION_DECISION_DATASET_V5_VERSION,',
              '        auditPassed: true,',
              '        artifact: {',
            ),
            lines(
              '        datasetVersion: RECOMMENDATION_DECISION_DATASET_V5_VERSION,',
              '        auditPassed: true,',
              '        source: {',
              "          sha256: 'a'.repeat(64),",
              '        },',
              '        artifact: {',
            ),
          );

          const policyTestPath = 'apps/api/test/recommendation-policy-v6-evaluation-integration.spec.ts';
          replaceOnce(
            policyTestPath,
            "  it('joins held-out artifacts and persists match-balanced OPE results', async () => {\n    const behavioralRows = [",
            "  it('joins held-out artifacts and persists match-balanced OPE results', async () => {\n    const upstreamDatasetV4Sha256 = 'a'.repeat(64);\n    const behavioralRows = [",
          );
          replaceOnce(
            policyTestPath,
            lines(
              '        auditPassed: true,',
              '        releaseGatePassed: true,',
              '        artifacts: {',
            ),
            lines(
              '        auditPassed: true,',
              '        releaseGatePassed: true,',
              '        source: {',
              '          artifactSha256: upstreamDatasetV4Sha256,',
              '        },',
              '        artifacts: {',
            ),
          );
          replaceOnce(
            policyTestPath,
            lines(
              '        source: {',
              '          datasetVersion: RECOMMENDATION_DECISION_DATASET_V5_VERSION,',
              '        },',
            ),
            lines(
              '        source: {',
              '          datasetVersion: RECOMMENDATION_DECISION_DATASET_V5_VERSION,',
              '          upstreamDatasetV4Sha256,',
              '        },',
            ),
          );
          replaceOnce(
            policyTestPath,
            lines(
              '    expect(service.getAudit()).toMatchObject({',
              '      passed: true,',
              '      leakage: {',
            ),
            lines(
              '    expect(service.getAudit()).toMatchObject({',
              '      passed: true,',
              '      source: {',
              '        lineage: {',
              '          behavioralDatasetV4Sha256: upstreamDatasetV4Sha256,',
              '          valueDatasetV4Sha256: upstreamDatasetV4Sha256,',
              '        },',
              '      },',
              '      leakage: {',
            ),
          );

          replaceOnce(
            'docs/recommendation-value-v6.md',
            '- an optional caller-supplied source SHA-256 to match.\n\nTraining uses a chronological match-level 70/15/15 split by default.',
            '- an optional caller-supplied source SHA-256 to match.\n\nThe manifest and audit also preserve the upstream Dataset V4 SHA-256 used to build Dataset V5.3.\n\nTraining uses a chronological match-level 70/15/15 split by default.',
          );
          replaceOnce(
            'docs/recommendation-policy-v6-evaluation.md',
            'All source hashes are checked against their manifests before evaluation starts.\n\n## Policies',
            'All source hashes are checked against their manifests before evaluation starts.\n\nThe evaluator also requires Behavioral V4 and Value V6 to carry the same upstream Dataset V4 SHA-256 lineage. A corpus mismatch fails before any policy estimate is produced.\n\n## Policies',
          );

          rmSync('.github/patches/recommendation-v6-lineage.patch', { force: true });
          rmSync('.github/workflows/apply-recommendation-v6-lineage.yml', { force: true });
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build shared package
        run: yarn workspace @deadlock-live-probe/shared build

      - name: Build domain package
        run: yarn workspace @deadlock-live-probe/build-domain build

      - name: Build API
        run: yarn workspace @deadlock-live-probe/api build

      - name: Run lineage tests
        run: >-
          yarn workspace @deadlock-live-probe/api test --runInBand
          recommendation-value-v6-training.spec.ts
          recommendation-policy-v6-evaluation.spec.ts
          recommendation-policy-v6-evaluation-integration.spec.ts

      - name: Commit verified lineage implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: verify Recommendation V6 dataset lineage"
          git push origin HEAD:agent/recommendation-v6-lineage

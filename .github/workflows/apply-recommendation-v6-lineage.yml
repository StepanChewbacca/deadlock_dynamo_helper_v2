name: Apply Recommendation V6 lineage

on:
  push:
    branches:
      - agent/recommendation-v6-lineage
    paths:
      - .github/patches/recommendation-v6-lineage.patch
      - .github/workflows/apply-recommendation-v6-lineage.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout lineage branch
        uses: actions/checkout@v4
        with:
          ref: agent/recommendation-v6-lineage
          fetch-depth: 0

      - name: Apply unified diff
        shell: bash
        run: |
          set +e
          {
            git apply --recount --check --verbose .github/patches/recommendation-v6-lineage.patch
            check_status=$?
            if [ "$check_status" -eq 0 ]; then
              git apply --recount --verbose .github/patches/recommendation-v6-lineage.patch
              check_status=$?
            fi
            exit "$check_status"
          } > "$RUNNER_TEMP/recommendation-v6-lineage-patch.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/recommendation-v6-lineage-patch.log"
          if [ "$status" -eq 0 ]; then
            rm -f .github/patches/recommendation-v6-lineage.patch
            rm -f .github/workflows/apply-recommendation-v6-lineage.yml
          fi
          exit "$status"

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v6-lineage-patch-diagnostics
          path: ${{ runner.temp }}/recommendation-v6-lineage-patch.log
          if-no-files-found: warn
          retention-days: 3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build shared package
        run: yarn workspace @deadlock-live-probe/shared build

      - name: Build domain package
        run: yarn workspace @deadlock-live-probe/build-domain build

      - name: Build API
        run: yarn workspace @deadlock-live-probe/api build

      - name: Run lineage tests
        run: >-
          yarn workspace @deadlock-live-probe/api test --runInBand
          recommendation-value-v6-training.spec.ts
          recommendation-policy-v6-evaluation.spec.ts
          recommendation-policy-v6-evaluation-integration.spec.ts

      - name: Commit verified lineage implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: verify Recommendation V6 dataset lineage"
          git push origin HEAD:agent/recommendation-v6-lineage

name: Export V6 Exclusive Deploy

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Export deployment workflow
        run: python3 scripts/export-v6-exclusive-deploy.py
      - uses: actions/upload-artifact@v4
        with:
          name: v6-exclusive-deploy-${{ github.sha }}
          path: deploy-v6-exclusive.yml
          retention-days: 1

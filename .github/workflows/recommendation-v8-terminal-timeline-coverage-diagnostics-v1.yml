name: Recommendation V8 Terminal Timeline Coverage Diagnostics V1

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-v8-terminal-timeline-coverage-diagnostics-v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recommendation-v8-terminal-timeline-coverage-diagnostics-v1
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Checkout training branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          request='.github/training-requests/recommendation-v8-terminal-timeline-coverage-diagnostics-v1.json'
          test "$(jq -r '.operation' "$request")" = 'DIAGNOSE_TERMINAL_TIMELINE_COVERAGE_V1'
          test "$(jq -r '.state' "$request")" = 'REQUESTED'
          test "$(jq -r '.productionRankingChanged' "$request")" = 'false'
          test "$(jq -r '.passiveShadowActivated' "$request")" = 'false'
          test "$(jq -r '.randomizedCanaryAuthorized' "$request")" = 'false'
          python3 -m py_compile scripts/diagnose-recommendation-v8-terminal-timeline-coverage.py

      - name: Diagnose timeline and observed candidate coverage
        shell: bash
        run: |
          set -euo pipefail
          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          replay="$storage/recommendation-historical-pro-replay-terminal-5000-v2/dataset.ndjson"
          timeline="$storage/match-timeline-events-v1"
          run_root='/home/ubuntu/apps/deadlock_dynamo_helper-training-5000'
          run_id="terminal-timeline-diagnostics-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run_dir="$run_root/runs/$run_id"
          sudo mkdir -p "$run_dir"
          sudo chown -R "$(id -u):$(id -g)" "$run_root"
          sudo test -s "$replay"
          sudo test -d "$timeline"
          sudo python3 scripts/diagnose-recommendation-v8-terminal-timeline-coverage.py \
            --replay "$replay" \
            --timeline-root "$timeline" \
            --output "$run_dir/report.json" \
            --missing-limit 500 \
            --row-limit 100000 \
            | tee "$run_dir/report.log"
          sudo python3 - "$replay" "$run_dir/gate-cohorts.json" "$run_dir/observed-candidate-misses.json" <<'PY'
          import json
          import sys
          from collections import Counter

          source, cohort_output, miss_output = sys.argv[1:]
          cohorts = {
              'ALL': Counter(),
              'TIMELINE_OR_TERMINAL': Counter(),
              'NO_TIMELINE_OR_TERMINAL': Counter(),
          }
          miss_action_types = Counter()
          miss_items = Counter()
          miss_phases = Counter()
          miss_candidate_counts = Counter()
          miss_same_item_action_types = Counter()
          miss_examples = []
          maximum_candidate_count = 0
          candidate_limit_hit_count = 0
          same_item_different_action_count = 0
          empty_candidate_set_count = 0
          missing_count = 0

          with open(source, 'r', encoding='utf-8') as handle:
              for line in handle:
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  covered = bool(row.get('timeline', {}).get('decisionSnapshotJoined')) or any(
                      isinstance(value, dict) and value.get('complete') is True
                      for value in row.get('shortHorizonOutcomes', [])
                  )
                  observed = bool(row.get('observedAction', {}).get('inCandidateSet'))
                  behavioral = bool(row.get('eligibility', {}).get('behavioralModel'))
                  action = bool(row.get('eligibility', {}).get('actionModel'))
                  state = bool(row.get('eligibility', {}).get('stateModel'))
                  keys = ['ALL', 'TIMELINE_OR_TERMINAL' if covered else 'NO_TIMELINE_OR_TERMINAL']
                  for key in keys:
                      cohorts[key]['rowCount'] += 1
                      cohorts[key]['observedActionCoveredCount'] += int(observed)
                      cohorts[key]['behavioralEligibleCount'] += int(behavioral)
                      cohorts[key]['actionEligibleCount'] += int(action)
                      cohorts[key]['stateEligibleCount'] += int(state)

                  candidates = [
                      candidate
                      for candidate in row.get('candidates', [])
                      if isinstance(candidate, dict)
                  ]
                  candidate_count = len(candidates)
                  maximum_candidate_count = max(maximum_candidate_count, candidate_count)
                  if observed:
                      continue

                  missing_count += 1
                  observed_action = row.get('observedAction', {})
                  observed_action_key = str(observed_action.get('actionKey', ''))
                  observed_action_type = str(observed_action.get('actionType', 'UNKNOWN'))
                  observed_item_id = observed_action.get('itemId')
                  miss_action_types[observed_action_type] += 1
                  miss_items[str(observed_item_id)] += 1
                  miss_phases[str(row.get('phase', 'UNKNOWN'))] += 1
                  miss_candidate_counts[str(candidate_count)] += 1
                  if candidate_count == 0:
                      empty_candidate_set_count += 1
                  if candidate_count >= 100:
                      candidate_limit_hit_count += 1

                  same_item = [
                      candidate
                      for candidate in candidates
                      if candidate.get('itemId') == observed_item_id
                  ]
                  if same_item:
                      same_item_different_action_count += 1
                      for candidate in same_item:
                          miss_same_item_action_types[
                              f"{observed_action_type}->{candidate.get('actionType', 'UNKNOWN')}"
                          ] += 1

                  if len(miss_examples) < 100:
                      miss_examples.append({
                          'decisionId': row.get('decisionId'),
                          'matchId': row.get('matchId'),
                          'heroId': row.get('heroId'),
                          'phase': row.get('phase'),
                          'decisionGameTimeS': row.get('decisionGameTimeS'),
                          'observedActionKey': observed_action_key,
                          'observedActionType': observed_action_type,
                          'observedItemId': observed_item_id,
                          'candidateCount': candidate_count,
                          'sameItemCandidateActionKeys': [
                              candidate.get('actionKey') for candidate in same_item
                          ],
                          'firstCandidateKeys': [
                              candidate.get('actionKey') for candidate in candidates[:20]
                          ],
                          'exclusionReasons': row.get('eligibility', {}).get('exclusionReasons', []),
                      })

          cohort_result = {}
          for key, values in cohorts.items():
              total = values['rowCount']
              cohort_result[key] = dict(values)
              cohort_result[key]['observedActionCoverage'] = (
                  values['observedActionCoveredCount'] / total if total else 0
              )
              cohort_result[key]['behavioralEligibilityCoverage'] = (
                  values['behavioralEligibleCount'] / total if total else 0
              )

          all_rows = cohorts['ALL']['rowCount']
          miss_result = {
              'schemaVersion': 1,
              'rowCount': all_rows,
              'missingObservedActionCount': missing_count,
              'observedActionCoverage': (
                  (all_rows - missing_count) / all_rows if all_rows else 0
              ),
              'minimumRequiredCoverage': 0.995,
              'additionalCoveredRowsRequired': max(
                  0,
                  int(0.995 * all_rows + 0.999999999) - (all_rows - missing_count),
              ),
              'maximumCandidateCount': maximum_candidate_count,
              'candidateLimitAtLeast100MissCount': candidate_limit_hit_count,
              'emptyCandidateSetMissCount': empty_candidate_set_count,
              'sameItemDifferentActionMissCount': same_item_different_action_count,
              'missActionTypeCounts': dict(miss_action_types.most_common()),
              'missPhaseCounts': dict(miss_phases.most_common()),
              'missCandidateCountDistribution': dict(
                  sorted(miss_candidate_counts.items(), key=lambda item: int(item[0]))
              ),
              'sameItemActionTypeTransitions': dict(
                  miss_same_item_action_types.most_common()
              ),
              'topMissingItemIds': dict(miss_items.most_common(100)),
              'examples': miss_examples,
          }

          with open(cohort_output, 'w', encoding='utf-8') as handle:
              json.dump(cohort_result, handle, indent=2)
              handle.write('\n')
          with open(miss_output, 'w', encoding='utf-8') as handle:
              json.dump(miss_result, handle, indent=2)
              handle.write('\n')
          print(json.dumps(cohort_result, indent=2))
          print(json.dumps(miss_result, indent=2))
          PY
          sudo chown -R "$(id -u):$(id -g)" "$run_dir"
          echo "DIAGNOSTIC_RUN_DIR=$run_dir" >> "$GITHUB_ENV"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v8-terminal-timeline-coverage-v1-${{ github.run_id }}
          path: |
            ${{ env.DIAGNOSTIC_RUN_DIR }}/report.json
            ${{ env.DIAGNOSTIC_RUN_DIR }}/report.log
            ${{ env.DIAGNOSTIC_RUN_DIR }}/gate-cohorts.json
            ${{ env.DIAGNOSTIC_RUN_DIR }}/observed-candidate-misses.json
          if-no-files-found: warn
          retention-days: 14

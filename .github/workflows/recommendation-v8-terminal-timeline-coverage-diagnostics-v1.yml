name: Recommendation V8 Terminal Timeline Coverage Diagnostics V1

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-v8-terminal-timeline-coverage-diagnostics-v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recommendation-v8-terminal-timeline-coverage-diagnostics-v1
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Checkout training branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          request='.github/training-requests/recommendation-v8-terminal-timeline-coverage-diagnostics-v1.json'
          test "$(jq -r '.operation' "$request")" = 'DIAGNOSE_TERMINAL_TIMELINE_COVERAGE_V1'
          test "$(jq -r '.state' "$request")" = 'REQUESTED'
          test "$(jq -r '.productionRankingChanged' "$request")" = 'false'
          test "$(jq -r '.passiveShadowActivated' "$request")" = 'false'
          test "$(jq -r '.randomizedCanaryAuthorized' "$request")" = 'false'
          python3 -m py_compile scripts/diagnose-recommendation-v8-terminal-timeline-coverage.py

      - name: Diagnose missing timeline coverage
        shell: bash
        run: |
          set -euo pipefail
          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          replay="$storage/recommendation-historical-pro-replay-terminal-5000-v2/dataset.ndjson"
          timeline="$storage/match-timeline-events-v1"
          run_root='/home/ubuntu/apps/deadlock_dynamo_helper-training-5000'
          run_id="terminal-timeline-diagnostics-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run_dir="$run_root/runs/$run_id"
          sudo mkdir -p "$run_dir"
          sudo chown -R "$(id -u):$(id -g)" "$run_root"
          sudo test -s "$replay"
          sudo test -d "$timeline"
          sudo python3 scripts/diagnose-recommendation-v8-terminal-timeline-coverage.py \
            --replay "$replay" \
            --timeline-root "$timeline" \
            --output "$run_dir/report.json" \
            --missing-limit 500 \
            --row-limit 100000 \
            | tee "$run_dir/report.log"
          sudo python3 - "$replay" "$run_dir/gate-cohorts.json" <<'PY'
          import json
          import sys
          from collections import Counter

          source, output = sys.argv[1:]
          cohorts = {
              'ALL': Counter(),
              'TIMELINE_OR_TERMINAL': Counter(),
              'NO_TIMELINE_OR_TERMINAL': Counter(),
          }
          with open(source, 'r', encoding='utf-8') as handle:
              for line in handle:
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  covered = bool(row.get('timeline', {}).get('decisionSnapshotJoined')) or any(
                      isinstance(value, dict) and value.get('complete') is True
                      for value in row.get('shortHorizonOutcomes', [])
                  )
                  observed = bool(row.get('observedAction', {}).get('inCandidateSet'))
                  behavioral = bool(row.get('eligibility', {}).get('behavioralModel'))
                  action = bool(row.get('eligibility', {}).get('actionModel'))
                  state = bool(row.get('eligibility', {}).get('stateModel'))
                  keys = ['ALL', 'TIMELINE_OR_TERMINAL' if covered else 'NO_TIMELINE_OR_TERMINAL']
                  for key in keys:
                      cohorts[key]['rowCount'] += 1
                      cohorts[key]['observedActionCoveredCount'] += int(observed)
                      cohorts[key]['behavioralEligibleCount'] += int(behavioral)
                      cohorts[key]['actionEligibleCount'] += int(action)
                      cohorts[key]['stateEligibleCount'] += int(state)
          result = {}
          for key, values in cohorts.items():
              total = values['rowCount']
              result[key] = dict(values)
              result[key]['observedActionCoverage'] = (
                  values['observedActionCoveredCount'] / total if total else 0
              )
              result[key]['behavioralEligibilityCoverage'] = (
                  values['behavioralEligibleCount'] / total if total else 0
              )
          with open(output, 'w', encoding='utf-8') as handle:
              json.dump(result, handle, indent=2)
              handle.write('\n')
          print(json.dumps(result, indent=2))
          PY
          sudo chown -R "$(id -u):$(id -g)" "$run_dir"
          echo "DIAGNOSTIC_RUN_DIR=$run_dir" >> "$GITHUB_ENV"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v8-terminal-timeline-coverage-v1-${{ github.run_id }}
          path: |
            ${{ env.DIAGNOSTIC_RUN_DIR }}/report.json
            ${{ env.DIAGNOSTIC_RUN_DIR }}/report.log
            ${{ env.DIAGNOSTIC_RUN_DIR }}/gate-cohorts.json
          if-no-files-found: warn
          retention-days: 14

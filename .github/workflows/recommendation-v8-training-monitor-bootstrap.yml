name: Bootstrap Recommendation V8 Training Monitor

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recommendation-v8-training-monitor-bootstrap.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch first monitor check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch hourly monitor
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'recommendation-v8-training-monitor.yml',
              ref: 'main',
            });

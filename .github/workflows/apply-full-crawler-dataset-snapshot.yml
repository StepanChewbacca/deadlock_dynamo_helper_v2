name: Apply full crawler dataset snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-full-crawler-dataset-snapshot.yml
      - scripts/apply-full-crawler-dataset-snapshot.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/full-crawler-dataset-snapshot'
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply full-corpus snapshot changes
        id: patch
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/apply-full-crawler-dataset-snapshot.py > snapshot-patch.log 2>&1

      - name: Upload patch diagnostics
        if: failure() && steps.patch.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: full-crawler-snapshot-patch-diagnostics-${{ github.sha }}
          path: snapshot-patch.log
          retention-days: 2

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @deadlock-live-probe/shared

      - name: Build domain package
        run: npm run build -w @deadlock-live-probe/domain

      - name: Build API
        run: npm run build -w @deadlock-live-probe/api

      - name: Test API
        run: npm test -w @deadlock-live-probe/api -- --runInBand

      - name: Remove temporary implementation files
        run: rm -f .github/workflows/apply-full-crawler-dataset-snapshot.yml scripts/apply-full-crawler-dataset-snapshot.py

      - name: Verify production diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/deadlock-live/hero-build-decision-dataset-v3.service.ts \
            apps/api/src/deadlock-live/hero-build-decision-dataset-v3.controller.ts \
            apps/api/src/deadlock-live/hero-build-offline-evaluation-data-loader.service.ts \
            apps/api/test/hero-build-decision-dataset-v3-full-corpus.spec.ts \
            docs/full-crawler-dataset-snapshots.md \
            .github/workflows/apply-full-crawler-dataset-snapshot.yml \
            scripts/apply-full-crawler-dataset-snapshot.py
          git commit -m "feat: snapshot the full crawler dataset"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

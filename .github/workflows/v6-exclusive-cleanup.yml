name: Normalize V6 Exclusive Source

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Normalize V6 presentation type
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/deadlock-live/hero-build-recommendation-presentation.service.ts')
          text = path.read_text(encoding='utf-8')
          repeated = "  | 'RECOMMENDATION_VALUE_V6_MODEL'\n  | 'RECOMMENDATION_VALUE_V6_MODEL'\n"
          while repeated in text:
              text = text.replace(repeated, "  | 'RECOMMENDATION_VALUE_V6_MODEL'\n", 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/deadlock-live/hero-build-recommendation-presentation.service.ts
          git commit -m 'fix: normalize V6 presentation metadata'
          git push origin "HEAD:${{ github.head_ref }}"

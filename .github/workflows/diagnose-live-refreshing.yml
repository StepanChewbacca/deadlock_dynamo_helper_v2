name: Diagnose stuck live recommendation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-live-refreshing.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect production live traversal
        shell: bash
        run: |
          set +e
          cd /home/ubuntu/apps/deadlock_dynamo_helper
          echo '--- timestamp ---'
          date -u +'%Y-%m-%dT%H:%M:%SZ'
          echo '--- containers ---'
          sudo docker compose ps
          echo '--- contextual model status ---'
          curl --show-error --silent --max-time 15 \
            http://127.0.0.1:3000/deadlock/analysis/contextual-v3-live/status
          echo
          echo '--- traversal status ---'
          curl --show-error --silent --max-time 15 \
            http://127.0.0.1:3000/deadlock/live/build-recommendations/status
          echo
          echo '--- traversal snapshots ---'
          curl --show-error --silent --max-time 15 \
            http://127.0.0.1:3000/deadlock/live/build-recommendations
          echo
          echo '--- recent recommendation HTTP traffic ---'
          sudo sh -c "tail -n 500 /var/log/nginx/access.log 2>/dev/null | grep -E '/deadlock/live/matches/.*/build-recommendation|/deadlock/live/events' | tail -n 200" || true
          echo '--- recent nginx errors ---'
          sudo tail -n 100 /var/log/nginx/error.log 2>/dev/null || true
          echo '--- recent API logs ---'
          sudo docker compose logs --since=15m --tail=1000 api

name: Apply Contextual V3 matchup signals

on:
  push:
    branches:
      - agent/contextual-v3-matchup-signals
    paths:
      - .github/workflows/apply-contextual-v3-matchup-signals.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contextual-v3-matchup-signals
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1))

          path = 'apps/api/src/deadlock-live/hero-build-recommendation.service.ts'
          replace(path, "export interface HeroBuildRecommendationAction {\n", "export type HeroBuildRecommendationMatchupDirection = 'POSITIVE' | 'NEGATIVE';\n\nexport interface HeroBuildRecommendationMatchupSignal {\n  heroId: number;\n  direction: HeroBuildRecommendationMatchupDirection;\n  scoreContribution: number;\n  modelLiftPercent: number;\n  observationCount: number;\n}\n\nexport interface HeroBuildRecommendationAction {\n")
          replace(path, "  observedOwnedCountLimit?: number;\n  predictedStateKey: string;\n", "  observedOwnedCountLimit?: number;\n  matchupSignals?: HeroBuildRecommendationMatchupSignal[];\n  predictedStateKey: string;\n")

          path = 'apps/api/src/deadlock-live/hero-build-contextual-v3-live.service.ts'
          replace(path, "  HeroBuildRecommendationAction,\n  HeroBuildRecommendationResponse,\n", "  HeroBuildRecommendationAction,\n  HeroBuildRecommendationMatchupSignal,\n  HeroBuildRecommendationResponse,\n")
          replace(path, "const MAX_PUBLIC_RECOMMENDATIONS = 20;\n", "const MAX_PUBLIC_RECOMMENDATIONS = 20;\nconst MAX_MATCHUP_SIGNALS_PER_ACTION = 2;\nconst MIN_MATCHUP_SIGNAL_OBSERVATIONS = 30;\nconst MIN_MATCHUP_SIGNAL_LIFT_PERCENT = 0.5;\n")
          replace(path, "interface ScoredAction {\n  parsed: ParsedAction;\n  score: number;\n  probability: number;\n}\n", "interface RawScoredAction {\n  parsed: ParsedAction;\n  score: number;\n  matchupSignals: HeroBuildRecommendationMatchupSignal[];\n}\n\ninterface ScoredAction extends RawScoredAction {\n  probability: number;\n}\n\nexport interface ContextualV3EnemyMatchupEvidence {\n  heroId: number;\n  logProbability: number;\n  observationCount: number;\n}\n")
          marker = "function scoreCandidates(input: {\n"
          helper = "export function createContextualV3MatchupSignals(input: {\n  baseLogProbability: number;\n  enemyWeight: number;\n  evidence: readonly ContextualV3EnemyMatchupEvidence[];\n}): HeroBuildRecommendationMatchupSignal[] {\n  if (\n    input.evidence.length === 0 ||\n    !Number.isFinite(input.baseLogProbability) ||\n    !Number.isFinite(input.enemyWeight)\n  ) {\n    return [];\n  }\n\n  const divisor = input.evidence.length;\n  return input.evidence\n    .map((value) => {\n      const scoreContribution =\n        input.enemyWeight *\n        (value.logProbability - input.baseLogProbability) /\n        divisor;\n      const modelLiftPercent = (Math.exp(scoreContribution) - 1) * 100;\n      return {\n        heroId: value.heroId,\n        direction: scoreContribution >= 0 ? 'POSITIVE' as const : 'NEGATIVE' as const,\n        scoreContribution,\n        modelLiftPercent,\n        observationCount: value.observationCount,\n      };\n    })\n    .filter(\n      (value) =>\n        value.direction === 'POSITIVE' &&\n        value.observationCount >= MIN_MATCHUP_SIGNAL_OBSERVATIONS &&\n        value.modelLiftPercent >= MIN_MATCHUP_SIGNAL_LIFT_PERCENT,\n    )\n    .sort(\n      (left, right) =>\n        right.scoreContribution - left.scoreContribution ||\n        right.observationCount - left.observationCount ||\n        left.heroId - right.heroId,\n    )\n    .slice(0, MAX_MATCHUP_SIGNALS_PER_ACTION);\n}\n\n"
          replace(path, marker, helper + marker)
          old = "      const enemyDelta = input.enemyHeroIds.length > 0\n        ? average(\n            input.enemyHeroIds.map((heroId) =>\n              logProbability(\n                input.model.counts.enemy[`${baseKey}|${heroId}`],\n                sourceActionKey,\n                input.candidates.length,\n                smoothing,\n              ),\n            ),\n          ) - base\n        : 0;\n      return {\n        parsed,\n        score:\n          base +\n          weights.archetype * archetypeDelta +\n          weights.allies * allyDelta +\n          weights.enemies * enemyDelta,\n      };\n"
          new = "      const enemyEvidence = input.enemyHeroIds.map((heroId) => {\n        const counts = input.model.counts.enemy[`${baseKey}|${heroId}`];\n        return {\n          heroId,\n          logProbability: logProbability(\n            counts,\n            sourceActionKey,\n            input.candidates.length,\n            smoothing,\n          ),\n          observationCount: counts?.[sourceActionKey] ?? 0,\n        };\n      });\n      const enemyDelta = enemyEvidence.length > 0\n        ? average(enemyEvidence.map((value) => value.logProbability)) - base\n        : 0;\n      return {\n        parsed,\n        score:\n          base +\n          weights.archetype * archetypeDelta +\n          weights.allies * allyDelta +\n          weights.enemies * enemyDelta,\n        matchupSignals: createContextualV3MatchupSignals({\n          baseLogProbability: base,\n          enemyWeight: weights.enemies,\n          evidence: enemyEvidence,\n        }),\n      };\n"
          replace(path, old, new)
          replace(path, ".filter((value): value is { parsed: ParsedAction; score: number } =>\n      value !== undefined,\n    );\n\n  const bestByPublicAction = new Map<string, { parsed: ParsedAction; score: number }>();\n", ".filter((value): value is RawScoredAction => value !== undefined);\n\n  const bestByPublicAction = new Map<string, RawScoredAction>();\n")
          replace(path, "  return scored.map(({ parsed, probability }) => {\n", "  return scored.map(({ parsed, probability, matchupSignals }) => {\n")
          replace(path, "      observedOwnedCountLimit:\n        parsed.publicActionType === 'BUY' ? currentOwnedCount + 1 : undefined,\n      predictedStateKey: createStateKeyFromCounts(predictedCounts),\n", "      observedOwnedCountLimit:\n        parsed.publicActionType === 'BUY' ? currentOwnedCount + 1 : undefined,\n      matchupSignals,\n      predictedStateKey: createStateKeyFromCounts(predictedCounts),\n")

          path = 'apps/api/src/deadlock-live/hero-build-recommendation-presentation.service.ts'
          replace(path, "  HeroBuildRecommendationAction,\n  HeroBuildRecommendationResponse,\n", "  HeroBuildRecommendationAction,\n  HeroBuildRecommendationMatchupSignal,\n  HeroBuildRecommendationResponse,\n")
          replace(path, "export type HeroBuildPresentedAction = HeroBuildRecommendationAction & {\n", "export interface HeroBuildPresentedMatchupSignal\n  extends HeroBuildRecommendationMatchupSignal {\n  heroName: string;\n}\n\nexport type HeroBuildPresentedAction = Omit<\n  HeroBuildRecommendationAction,\n  'matchupSignals'\n> & {\n")
          replace(path, "  situationalAgainstHeroName?: string;\n  explanation: HeroBuildPresentationExplanation;\n", "  situationalAgainstHeroName?: string;\n  matchupSignals?: HeroBuildPresentedMatchupSignal[];\n  explanation: HeroBuildPresentationExplanation;\n")
          replace(path, "  const situationalAgainstHeroName = situationalAgainstHeroId === undefined\n    ? undefined\n    : heroNameByCanonicalId.get(canonicalHeroId(situationalAgainstHeroId));\n\n  return {\n", "  const situationalAgainstHeroName = situationalAgainstHeroId === undefined\n    ? undefined\n    : heroNameByCanonicalId.get(canonicalHeroId(situationalAgainstHeroId));\n  const matchupSignals = action.matchupSignals?.map((signal) => ({\n    ...signal,\n    heroName:\n      heroNameByCanonicalId.get(canonicalHeroId(signal.heroId)) ??\n      `Hero ${signal.heroId}`,\n  }));\n\n  return {\n")
          replace(path, "    item,\n    situationalAgainstHeroName,\n    explanation: createExplanation(action, response),\n", "    item,\n    situationalAgainstHeroName,\n    matchupSignals,\n    explanation: createExplanation(action, response),\n")
          old = "  const heroIds = [response.action, ...response.alternatives]\n    .map(getSituationalAgainstHeroId)\n    .filter((heroId): heroId is number => heroId !== undefined)\n    .flatMap((heroId) => heroIdAliases(heroId));\n"
          new = "  const heroIds = [response.action, ...response.alternatives]\n    .flatMap((action) => [\n      getSituationalAgainstHeroId(action),\n      ...(action.matchupSignals ?? []).map((signal) => signal.heroId),\n    ])\n    .filter((heroId): heroId is number => heroId !== undefined)\n    .flatMap((heroId) => heroIdAliases(heroId));\n"
          replace(path, old, new)

          path = 'apps/overwolf-client/src/live-build-recommendation-poller.ts'
          replace(path, "export interface LiveBuildRecommendationAction {\n", "export interface LiveBuildRecommendationMatchupSignal {\n  heroId: number;\n  heroName: string;\n  direction: 'POSITIVE' | 'NEGATIVE';\n  scoreContribution: number;\n  modelLiftPercent: number;\n  observationCount: number;\n}\n\nexport interface LiveBuildRecommendationAction {\n")
          replace(path, "  matchupObservationCount?: number;\n}\n", "  matchupObservationCount?: number;\n  matchupSignals?: LiveBuildRecommendationMatchupSignal[];\n}\n")

          path = 'apps/overwolf-client/src/live-build-recommendation-ui.ts'
          replace(path, "  card.append(top, explanation);\n  return card;\n", "  card.append(top, explanation);\n  const matchup = createMatchupSignals(action);\n  if (matchup) {\n    card.append(matchup);\n  }\n  return card;\n")
          replace(path, "    metadata.textContent = formatItemMetadata(action);\n", "    metadata.textContent = [\n      formatItemMetadata(action),\n      formatFirstMatchupSignal(action),\n    ].filter(Boolean).join(' | ');\n", 1)
          marker = "function createStateMessage(snapshot: LiveBuildRecommendationSnapshot): HTMLElement {\n"
          helpers = "function createMatchupSignals(\n  action: LiveBuildRecommendationAction,\n): HTMLElement | undefined {\n  const signals = (action.matchupSignals ?? []).filter(\n    (signal) => signal.direction === 'POSITIVE',\n  );\n  if (signals.length === 0) {\n    return undefined;\n  }\n\n  const section = document.createElement('div');\n  section.className = 'live-build-matchup';\n  section.title =\n    'Historical purchase pattern used by Contextual V3. This is model influence, not proven win-rate counter effectiveness.';\n\n  const title = document.createElement('span');\n  title.className = 'live-build-matchup-title';\n  title.textContent = 'MATCHUP SIGNAL';\n\n  const chips = document.createElement('div');\n  chips.className = 'live-build-matchup-chips';\n  for (const signal of signals.slice(0, 2)) {\n    const chip = document.createElement('span');\n    chip.className = 'live-build-matchup-chip';\n    chip.textContent = formatMatchupSignal(signal);\n    chips.append(chip);\n  }\n\n  const note = document.createElement('span');\n  note.className = 'live-build-matchup-note';\n  note.textContent = 'Historical purchase tendency, not win-rate proof.';\n  section.append(title, chips, note);\n  return section;\n}\n\nfunction formatFirstMatchupSignal(\n  action: LiveBuildRecommendationAction,\n): string {\n  const signal = action.matchupSignals?.find(\n    (value) => value.direction === 'POSITIVE',\n  );\n  return signal ? formatMatchupSignal(signal) : '';\n}\n\nexport function formatMatchupSignal(\n  signal: NonNullable<LiveBuildRecommendationAction['matchupSignals']>[number],\n): string {\n  return `VS ${signal.heroName} +${formatPercent(signal.modelLiftPercent)}% model lift · ${signal.observationCount} samples`;\n}\n\n"
          replace(path, marker, helpers + marker)
          replace(path, "    .live-build-explanation {\n", "    .live-build-matchup {\n      display: flex;\n      flex-direction: column;\n      gap: 0.25rem;\n      margin-top: 0.42rem;\n      padding-top: 0.38rem;\n      border-top: 1px solid rgba(255,255,255,0.08);\n    }\n    .live-build-matchup-title {\n      color: #67e8f9;\n      font-size: 0.52rem;\n      font-weight: 700;\n      letter-spacing: 0.08em;\n    }\n    .live-build-matchup-chips {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.25rem;\n    }\n    .live-build-matchup-chip {\n      padding: 0.18rem 0.3rem;\n      border: 1px solid rgba(103,232,249,0.24);\n      border-radius: 4px;\n      background: rgba(8,145,178,0.12);\n      color: #a5f3fc;\n      font-family: 'JetBrains Mono', monospace;\n      font-size: 0.51rem;\n      line-height: 1.2;\n    }\n    .live-build-matchup-note {\n      color: #7f8794;\n      font-size: 0.48rem;\n      line-height: 1.2;\n    }\n    .live-build-explanation {\n")
          replace(path, "    .hud-container.compact .live-build-explanation,\n    .hud-container.compact .live-build-alternatives {\n", "    .hud-container.compact .live-build-explanation,\n    .hud-container.compact .live-build-matchup,\n    .hud-container.compact .live-build-alternatives {\n")

          path = 'apps/overwolf-client/src/live-build-desktop-table-ui.ts'
          replace(path, "function formatEvidence(action: ExtendedLiveBuildRecommendationAction): string {\n  const count = Number(action.historicalCount);\n", "function formatEvidence(action: ExtendedLiveBuildRecommendationAction): string {\n  const matchup = action.matchupSignals?.find(\n    (signal) => signal.direction === 'POSITIVE',\n  );\n  if (matchup) {\n    return `VS ${matchup.heroName} +${formatPercent(matchup.modelLiftPercent)}% (${matchup.observationCount})`;\n  }\n  const count = Number(action.historicalCount);\n")

          path = 'apps/api/test/hero-build-contextual-v3-live.spec.ts'
          replace(path, "  assignLiveArchetype,\n", "  assignLiveArchetype,\n  createContextualV3MatchupSignals,\n")
          replace(path, "  it('reconstructs buy, upgrade, and sell actions from live inventory snapshots', () => {\n", "  it('keeps only supported positive enemy matchup contributions', () => {\n    const signals = createContextualV3MatchupSignals({\n      baseLogProbability: -2,\n      enemyWeight: 0.12,\n      evidence: [\n        { heroId: 13, logProbability: -1, observationCount: 120 },\n        { heroId: 14, logProbability: -2.5, observationCount: 90 },\n        { heroId: 15, logProbability: -0.5, observationCount: 12 },\n      ],\n    });\n\n    expect(signals).toHaveLength(1);\n    expect(signals[0]).toEqual(\n      expect.objectContaining({\n        heroId: 13,\n        direction: 'POSITIVE',\n        observationCount: 120,\n      }),\n    );\n    expect(signals[0].modelLiftPercent).toBeGreaterThan(0.5);\n  });\n\n  it('reconstructs buy, upgrade, and sell actions from live inventory snapshots', () => {\n")

          path = 'apps/api/test/hero-build-recommendation-presentation.spec.ts'
          replace(path, "  HeroBuildPresentationItemSource,\n", "  HeroBuildPresentationHeroSource,\n  HeroBuildPresentationItemSource,\n")
          replace(path, "const ITEM: HeroBuildPresentationItemSource = {\n", "const HAZE: HeroBuildPresentationHeroSource = {\n  heroId: 13,\n  name: 'Haze',\n};\n\nconst ITEM: HeroBuildPresentationItemSource = {\n")
          replace(path, "  it('presents hold without requiring item metadata', () => {\n", "  it('enriches model matchup signals with enemy hero names', () => {\n    const response = createResponse('BACKOFF', createAction({\n      matchupSignals: [\n        {\n          heroId: 13,\n          direction: 'POSITIVE',\n          scoreContribution: 0.04,\n          modelLiftPercent: 4.08,\n          observationCount: 84,\n        },\n      ],\n    }));\n\n    const result = presentHeroBuildRecommendation(response, [ITEM], [HAZE]);\n\n    expect(result.action.matchupSignals).toEqual([\n      expect.objectContaining({\n        heroId: 13,\n        heroName: 'Haze',\n        modelLiftPercent: 4.08,\n        observationCount: 84,\n      }),\n    ]);\n  });\n\n  it('presents hold without requiring item metadata', () => {\n")

          Path('apps/overwolf-client/src/live-build-recommendation-ui.spec.ts').write_text("""import { formatMatchupSignal } from './live-build-recommendation-ui';\n\ndescribe('live build recommendation matchup signals', () => {\n  it('formats model lift without claiming a proven counter', () => {\n    expect(\n      formatMatchupSignal({\n        heroId: 13,\n        heroName: 'Haze',\n        direction: 'POSITIVE',\n        scoreContribution: 0.031,\n        modelLiftPercent: 3.15,\n        observationCount: 124,\n      }),\n    ).toBe('VS Haze +3.1% model lift · 124 samples');\n  });\n});\n""")

          replace('apps/overwolf-client/package.json', '"version": "0.1.10"', '"version": "0.1.11"')
          replace('apps/overwolf-client/public/manifest.json', '"version": "0.1.10"', '"version": "0.1.11"')
          replace('apps/overwolf-client/src/desktop-version.ts', "const APP_VERSION = '0.1.10';\nconst APP_BUILD = '020';", "const APP_VERSION = '0.1.11';\nconst APP_BUILD = '021';")

          Path('.github/workflows/apply-contextual-v3-matchup-signals.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose Contextual V3 matchup signals"
          git push origin HEAD:agent/contextual-v3-matchup-signals

name: Deploy API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL || 'https://aboba-telegramovich.duckdns.org' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy files to deployment directory
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'storage' \
            ./ /home/ubuntu/apps/deadlock_dynamo_helper/

      - name: Rebuild and restart API
        run: |
          set -euo pipefail
          cd /home/ubuntu/apps/deadlock_dynamo_helper
          sudo docker compose build api
          sudo docker compose run --rm api node run-migrations.js
          sudo docker compose up -d api

      - name: Wait for healthy API container
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/apps/deadlock_dynamo_helper
          container_id="$(sudo docker compose ps -q api)"
          if [ -z "$container_id" ]; then
            echo 'API container was not created.' >&2
            exit 1
          fi

          for attempt in $(seq 1 40); do
            status="$(sudo docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container_id")"
            echo "API health status: $status ($attempt/40)"
            if [ "$status" = 'healthy' ]; then
              exit 0
            fi
            if [ "$status" = 'unhealthy' ]; then
              sudo docker compose logs --tail=200 api
              exit 1
            fi
            sleep 5
          done

          sudo docker compose logs --tail=200 api
          echo 'API did not become healthy in time.' >&2
          exit 1

      - name: Verify Contextual V3 production state locally
        run: |
          set -euo pipefail
          cd /home/ubuntu/apps/deadlock_dynamo_helper
          sudo docker compose exec -T api node -e "fetch('http://127.0.0.1:3000/deadlock/analysis/contextual-v3-live/status').then(async (response) => { const status = await response.json(); console.log(JSON.stringify(status)); if (!response.ok || status.mode !== 'PRODUCTION' || status.model?.state !== 'READY') process.exit(1); }).catch((error) => { console.error(error); process.exit(1); });"
          sudo docker compose exec -T api node -e "fetch('http://127.0.0.1:3000/deadlock/live/build-recommendations/status').then(async (response) => { const status = await response.json(); console.log(JSON.stringify(status)); if (!response.ok || typeof status.trackedMatchCount !== 'number') process.exit(1); }).catch((error) => { console.error(error); process.exit(1); });"

      - name: Verify public API route
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --fail --show-error --silent \
            --retry 10 \
            --retry-delay 3 \
            --retry-all-errors \
            "$PUBLIC_API_BASE_URL/deadlock/analysis/contextual-v3-live/status")"
          echo "$status"
          echo "$status" | grep -q '"mode":"PRODUCTION"'
          echo "$status" | grep -q '"state":"READY"'

      - name: Show API logs on failure
        if: failure()
        run: |
          cd /home/ubuntu/apps/deadlock_dynamo_helper
          sudo docker compose ps
          sudo docker compose logs --tail=300 api

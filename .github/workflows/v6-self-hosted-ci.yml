name: V6 Self-hosted CI

on:
  push:
    branches:
      - agent/deploy-recommendation-value-v6-global
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v6-self-hosted-ci
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/deploy-recommendation-value-v6-global
          fetch-depth: 0

      - name: Extract shared V6 feature construction
        run: python3 scripts/refactor-recommendation-value-v6-features.py

      - name: Commit extracted feature construction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Shared V6 features are already extracted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/deadlock-live/recommendation-value-v6-training.service.ts
          git commit -m 'refactor: share Recommendation Value V6 features'
          git push origin HEAD:agent/deploy-recommendation-value-v6-global

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test --runInBand

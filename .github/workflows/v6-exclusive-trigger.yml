name: Trigger V6 Exclusive Patch

"on":
  push:
    branches:
      - agent/v6-exclusive-production

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v6-exclusive-production
      - name: Execute embedded patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/v6-exclusive-apply.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'v6-exclusive-embedded-patch.py', 'exec'))
          PY
      - name: Commit exclusive V6 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api apps/overwolf-client
          git commit -m 'feat: use Recommendation Value V6 exclusively'
          git push origin HEAD:agent/v6-exclusive-production

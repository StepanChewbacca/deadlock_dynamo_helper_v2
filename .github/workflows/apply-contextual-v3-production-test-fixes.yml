name: Apply Contextual V3 production test fixes

on:
  push:
    branches:
      - agent/contextual-v3-production
    paths:
      - .github/workflows/apply-contextual-v3-production-test-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/contextual-v3-production
          fetch-depth: 0
      - name: Apply test fixes
        run: python3 scripts/apply-contextual-v3-production-test-fixes.py
      - name: Validate diff
        run: git diff --check
      - name: Commit test fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/test/hero-build-contextual-v2-foundation.spec.ts apps/api/test/hero-build-production-alias.spec.ts apps/api/test/hero-build-recommendation.controller.spec.ts
          git commit -m "test: update production harnesses for Contextual V3"
          git push origin HEAD:agent/contextual-v3-production

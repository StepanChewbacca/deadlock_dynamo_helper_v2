name: Full crawler recovery preflight

on:
  pull_request:
    paths:
      - '.github/workflows/full-crawler-recovery-preflight.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 15
    steps:
      - name: Inspect VPS storage and runtime
        shell: bash
        run: |
          set -euo pipefail
          deploy=/home/ubuntu/apps/deadlock_dynamo_helper
          volume=$(sudo docker volume inspect deadlock_dynamo_helper_deadlock-storage --format '{{ .Mountpoint }}')
          echo "DEPLOY_COMMIT=$(git -C "$deploy" rev-parse HEAD)"
          sudo df -h "$volume"
          echo "API=$(sudo docker compose -f "$deploy/docker-compose.yml" ps --format json api | tr -d '\n')"
          process_count=$(ps -eo cmd | grep -E 'full-crawler|recommendation-cycle|value-v5|node scripts' | grep -v grep | wc -l)
          echo "TRAINING_PROCESS_COUNT=$process_count"
          for name in \
            build-decision-dataset-v3-full-crawler-20260724 \
            contextual-v3-training-full-crawler-v2-20260724 \
            contextual-v3-candidate-evaluation-full-crawler-v2-20260724 \
            recommendation-decision-dataset-v4-full-crawler-v2-20260724 \
            recommendation-behavioral-v4-full-crawler-v2-20260724 \
            recommendation-value-v4-full-crawler-v2-20260724 \
            recommendation-policy-v4-full-crawler-v2-20260724; do
            path="$volume/$name"
            if sudo test -d "$path"; then
              size=$(sudo du -sh "$path" | awk '{print $1}')
              files=$(sudo find "$path" -maxdepth 1 -type f | wc -l)
              manifest=no
              audit=no
              evaluation=no
              model=no
              sudo test -f "$path/manifest.json" && manifest=yes
              sudo test -f "$path/audit.json" && audit=yes
              sudo test -f "$path/evaluation.json" && evaluation=yes
              sudo test -f "$path/model.json" && model=yes
              echo "$name size=$size files=$files manifest=$manifest audit=$audit evaluation=$evaluation model=$model"
            else
              echo "$name MISSING"
            fi
          done

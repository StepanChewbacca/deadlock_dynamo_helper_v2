name: Full crawler recovery preflight

on:
  pull_request:
    paths:
      - '.github/workflows/full-crawler-recovery-preflight.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 15
    steps:
      - name: Inspect VPS storage and runtime
        shell: bash
        run: |
          set -euo pipefail
          deploy=/home/ubuntu/apps/deadlock_dynamo_helper
          volume=$(sudo docker volume inspect deadlock_dynamo_helper_deadlock-storage --format '{{ .Mountpoint }}')
          echo "DEPLOY_COMMIT=$(git -C "$deploy" rev-parse HEAD)"
          echo "VOLUME=$volume"
          echo '--- disk ---'
          df -h "$volume"
          echo '--- docker compose ---'
          sudo docker compose -f "$deploy/docker-compose.yml" ps
          echo '--- training processes ---'
          ps -eo pid,lstart,cmd | grep -E 'full-crawler|recommendation-cycle|value-v5|node scripts' | grep -v grep || true
          echo '--- systemd jobs ---'
          sudo systemctl list-units --type=service --all | grep -E 'deadlock.*(training|crawler|value)' || true
          echo '--- storage directories ---'
          for name in \
            build-decision-dataset-v3-full-crawler-20260724 \
            contextual-v3-training-full-crawler-v2-20260724 \
            contextual-v3-candidate-evaluation-full-crawler-v2-20260724 \
            recommendation-decision-dataset-v4-full-crawler-v2-20260724 \
            recommendation-behavioral-v4-full-crawler-v2-20260724 \
            recommendation-value-v4-full-crawler-v2-20260724 \
            recommendation-policy-v4-full-crawler-v2-20260724; do
            path="$volume/$name"
            echo "### $name"
            if [ -d "$path" ]; then
              sudo du -sh "$path" || true
              sudo find "$path" -maxdepth 1 -type f -printf '%f %s bytes %TY-%Tm-%TdT%TH:%TM:%TS\n' | sort || true
              if [ -f "$path/manifest.json" ]; then
                echo 'manifest:'
                sudo head -c 4000 "$path/manifest.json"
                echo
              fi
            else
              echo MISSING
            fi
          done
          echo '--- current API recommendation env ---'
          sudo docker compose -f "$deploy/docker-compose.yml" exec -T api env | grep '^DEADLOCK_' | sort || true

name: Apply Contextual V3 candidate coverage patch

on:
  push:
    branches:
      - agent/contextual-v3-candidate-coverage
    paths:
      - .github/workflows/apply-contextual-v3-candidate-coverage.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/contextual-v3-candidate-coverage
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-contextual-v3-candidate-coverage.py
      - name: Validate diff
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/deadlock-live/hero-build-contextual-v3-training.service.ts apps/api/test/hero-build-contextual-v3-training.spec.ts docs/contextual-v3-training.md
          git commit -m "fix: improve Contextual V3 candidate coverage"
          git push origin HEAD:agent/contextual-v3-candidate-coverage

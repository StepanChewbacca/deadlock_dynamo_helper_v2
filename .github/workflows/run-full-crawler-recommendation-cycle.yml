name: Run full crawler recommendation cycle

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-full-crawler-recommendation-cycle.yml
      - scripts/run-full-crawler-recommendation-cycle.mjs

permissions:
  contents: read

jobs:
  train:
    if: github.event.pull_request.head.ref == 'diagnostics/run-full-crawler-recommendation-cycle-20260724'
    runs-on: self-hosted
    timeout-minutes: 360
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run full crawler recommendation cycle
        run: node scripts/run-full-crawler-recommendation-cycle.mjs

      - name: Restore production API configuration
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/apps/deadlock_dynamo_helper
          sudo docker compose up -d --force-recreate --no-deps api
          rm -f /tmp/full-crawler-recommendation-cycle.override.yml
          for attempt in $(seq 1 180); do
            if curl --max-time 10 --fail --silent http://127.0.0.1:3000/deadlock/analysis/recommendation-telemetry/status >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Upload full crawler cycle results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-crawler-recommendation-cycle-${{ github.sha }}
          path: full-crawler-recommendation-cycle-result
          if-no-files-found: warn
          retention-days: 14

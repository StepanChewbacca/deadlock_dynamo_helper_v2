name: Apply Contextual V3 rollout context

on:
  push:
    branches:
      - agent/contextual-v3-model-only-test
    paths:
      - .github/workflows/apply-contextual-v3-rollout-context.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contextual-v3-model-only-test
          fetch-depth: 0

      - name: Apply rollout context support
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              file_path.write_text(text.replace(old, new, 1))

          controller = 'apps/api/src/deadlock-live/hero-build-recommendation.controller.ts'
          replace_once(
              controller,
              """  enemyHeroIds?: number[];\n  limit?: number;""",
              """  enemyHeroIds?: number[];\n  alliedHeroIds?: number[];\n  previousActionKeys?: string[];\n  limit?: number;""",
          )
          replace_once(
              controller,
              """      alliedHeroIds: liveContext.alliedHeroIds,\n      previousActionKeys: liveContext.previousActionKeys,""",
              """      alliedHeroIds:\n        validated.recommendationRequest.alliedHeroIds ??\n        liveContext.alliedHeroIds,\n      previousActionKeys:\n        validated.recommendationRequest.previousActionKeys ??\n        liveContext.previousActionKeys,""",
          )
          replace_once(
              controller,
              """  const enemyHeroIds = validateEnemyHeroIds(dto.enemyHeroIds);\n\n  return {\n    recommendationRequest: {\n      heroId: dto.heroId,\n      itemIds: [...dto.itemIds],\n      gameTimeS: dto.gameTimeS,\n      enemyHeroIds,\n    },""",
              """  const enemyHeroIds = validateHeroIds(dto.enemyHeroIds, 'enemyHeroIds');\n  const alliedHeroIds = validateHeroIds(dto.alliedHeroIds, 'alliedHeroIds');\n  const previousActionKeys = validatePreviousActionKeys(dto.previousActionKeys);\n\n  return {\n    recommendationRequest: {\n      heroId: dto.heroId,\n      itemIds: [...dto.itemIds],\n      gameTimeS: dto.gameTimeS,\n      enemyHeroIds,\n      alliedHeroIds,\n      previousActionKeys,\n    },""",
          )
          replace_once(
              controller,
              """function validateEnemyHeroIds(value: number[] | undefined): number[] | undefined {\n  if (value === undefined) {\n    return undefined;\n  }\n  if (!Array.isArray(value)) {\n    throw new BadRequestException('enemyHeroIds must be an array.');\n  }\n\n  for (const heroId of value) {\n    if (!Number.isSafeInteger(heroId) || heroId <= 0) {\n      throw new BadRequestException(\n        'Every enemyHeroIds value must be a positive safe integer.',\n      );\n    }\n  }\n\n  return [...new Set(value)].sort((left, right) => left - right);\n}\n""",
              """function validateHeroIds(\n  value: number[] | undefined,\n  fieldName: 'enemyHeroIds' | 'alliedHeroIds',\n): number[] | undefined {\n  if (value === undefined) {\n    return undefined;\n  }\n  if (!Array.isArray(value)) {\n    throw new BadRequestException(`${fieldName} must be an array.`);\n  }\n\n  for (const heroId of value) {\n    if (!Number.isSafeInteger(heroId) || heroId <= 0) {\n      throw new BadRequestException(\n        `Every ${fieldName} value must be a positive safe integer.`,\n      );\n    }\n  }\n\n  return [...new Set(value)].sort((left, right) => left - right);\n}\n\nfunction validatePreviousActionKeys(\n  value: string[] | undefined,\n): string[] | undefined {\n  if (value === undefined) {\n    return undefined;\n  }\n  if (!Array.isArray(value)) {\n    throw new BadRequestException('previousActionKeys must be an array.');\n  }\n  if (value.length > 64) {\n    throw new BadRequestException('previousActionKeys must contain at most 64 values.');\n  }\n\n  for (const actionKey of value) {\n    if (\n      typeof actionKey !== 'string' ||\n      !/^(BUY|REBUY|UPGRADE|SELL):[1-9][0-9]*$/.test(actionKey)\n    ) {\n      throw new BadRequestException(\n        'Every previousActionKeys value must be a valid item action key.',\n      );\n    }\n  }\n\n  return [...value];\n}\n""",
          )

          spec = 'apps/api/test/hero-build-recommendation.controller.spec.ts'
          replace_once(
              spec,
              """  it('keeps an explicit empty enemy roster instead of inferring live context', async () => {""",
              """  it('keeps explicit model rollout context instead of replacing it with live context', async () => {\n    const harness = createHarness();\n\n    await harness.controller.recommend({\n      heroId: 72,\n      itemIds: [100],\n      gameTimeS: 630,\n      enemyHeroIds: [99],\n      alliedHeroIds: [88],\n      previousActionKeys: ['BUY:100', 'UPGRADE:200'],\n    });\n\n    expect(harness.recommend).toHaveBeenCalledWith(\n      expect.objectContaining({\n        enemyHeroIds: [99],\n        alliedHeroIds: [88],\n        previousActionKeys: ['BUY:100', 'UPGRADE:200'],\n      }),\n    );\n  });\n\n  it('keeps an explicit empty enemy roster instead of inferring live context', async () => {""",
          )

          Path('.github/workflows/apply-contextual-v3-rollout-context.yml').unlink()
          PY

      - name: Validate generated diff
        run: git diff --check

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/deadlock-live/hero-build-recommendation.controller.ts \
            apps/api/test/hero-build-recommendation.controller.spec.ts \
            .github/workflows/apply-contextual-v3-rollout-context.yml
          git commit -m "fix: preserve model rollout context"
          git push origin HEAD:agent/contextual-v3-model-only-test

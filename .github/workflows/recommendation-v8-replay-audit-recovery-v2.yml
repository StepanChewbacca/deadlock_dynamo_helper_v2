name: Recommendation V8 Replay Audit Recovery V2

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-v8-replay-audit-recovery-v2.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recommendation-v8-vps-training
  cancel-in-progress: false

jobs:
  request-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.request.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - id: request
        shell: bash
        run: |
          set -euo pipefail
          request='.github/training-requests/recommendation-v8-replay-audit-recovery-v2.json'
          state="$(jq -r '.state // empty' "$request")"
          if [ "$state" = 'CONSUMED' ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$state" = 'REQUESTED'
          test "$(jq -r '.operation' "$request")" = 'REPLAY_AUDIT_RECOVERY_V2'
          test "$(jq -r '.sourceDatasetSha256' "$request")" = 'ff04970fda519ca5ebbfa49991af05ef99b99038d3f9f39f64fc9b0d07018fad'
          test "$(jq -r '.failedReplaySha256 | length' "$request")" = '64'
          test "$(jq -r '.productionRankingChanged' "$request")" = 'false'
          test "$(jq -r '.passiveShadowActivated' "$request")" = 'false'
          test "$(jq -r '.randomizedCanaryAuthorized' "$request")" = 'false'
          echo 'run=true' >> "$GITHUB_OUTPUT"

  recover:
    needs: request-gate
    if: needs.request-gate.outputs.run == 'true'
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Resolve production-owned storage and recovery state
        shell: bash
        run: |
          set -euo pipefail
          deploy_dir='/home/ubuntu/apps/deadlock_dynamo_helper'
          run_root='/home/ubuntu/apps/deadlock_dynamo_helper-training'
          old_run_dir="$(readlink -f "$run_root/current")"
          production_container="$(cd "$deploy_dir" && sudo docker compose ps -q api)"
          test -n "$production_container"
          test -s "$old_run_dir/resolved-training-config.json"
          storage_type="$(sudo docker inspect --format='{{range .Mounts}}{{if eq .Destination "/app/apps/api/storage"}}{{.Type}}{{end}}{{end}}' "$production_container")"
          storage_name="$(sudo docker inspect --format='{{range .Mounts}}{{if eq .Destination "/app/apps/api/storage"}}{{.Name}}{{end}}{{end}}' "$production_container")"
          storage_source="$(sudo docker inspect --format='{{range .Mounts}}{{if eq .Destination "/app/apps/api/storage"}}{{.Source}}{{end}}{{end}}' "$production_container")"
          network_name="$(sudo docker inspect --format='{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' "$production_container")"
          test -n "$storage_type"
          test -n "$storage_source"
          test -n "$network_name"
          request='.github/training-requests/recommendation-v8-replay-audit-recovery-v2.json'
          failed_replay_sha="$(jq -r '.failedReplaySha256' "$request")"
          prefix="${failed_replay_sha:0:12}"
          archive_parent="$storage_source/recommendation-v8-failed-artifacts"
          existing_archive="$(sudo find "$archive_parent" -mindepth 1 -maxdepth 1 -type d -name "${prefix}-*" -print 2>/dev/null | head -n 1 || true)"
          archive_root="${existing_archive:-$archive_parent/${prefix}-recovery-v2}"
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-replay-audit-v2"
          run_dir="$run_root/runs/$run_id"
          sudo mkdir -p "$run_dir" "$archive_root"
          sudo chown -R "$(id -u):$(id -g)" "$run_root"
          cp "$old_run_dir/resolved-training-config.json" "$run_dir/"
          cp scripts/run-recommendation-v8-replay-audit-recovery-v2.mjs "$run_dir/"
          echo "TRAINING_RUN_ROOT=$run_root" >> "$GITHUB_ENV"
          echo "TRAINING_RUN_DIR=$run_dir" >> "$GITHUB_ENV"
          echo "TRAINING_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo 'TRAINING_CONTAINER=deadlock-recommendation-v8-training' >> "$GITHUB_ENV"
          echo "STORAGE_MOUNT_TYPE=$storage_type" >> "$GITHUB_ENV"
          echo "STORAGE_MOUNT_NAME=$storage_name" >> "$GITHUB_ENV"
          echo "STORAGE_MOUNT_SOURCE=$storage_source" >> "$GITHUB_ENV"
          echo "TRAINING_NETWORK=$network_name" >> "$GITHUB_ENV"
          echo "FAILED_REPLAY_SHA=$failed_replay_sha" >> "$GITHUB_ENV"
          echo "ARCHIVE_ROOT=$archive_root" >> "$GITHUB_ENV"

      - name: Build repaired isolated image
        shell: bash
        run: |
          set -euo pipefail
          image="deadlock-recommendation-v8-training:${GITHUB_SHA}-audit-v2"
          sudo docker build -t "$image" .
          echo "TRAINING_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Complete failed-artifact archive idempotently
        shell: bash
        run: |
          set -euo pipefail
          sudo docker rm -f "$TRAINING_CONTAINER" >/dev/null 2>&1 || true
          replay_source="$STORAGE_MOUNT_SOURCE/recommendation-historical-pro-replay-v1"
          replay_archive="$ARCHIVE_ROOT/recommendation-historical-pro-replay-v1"
          if sudo test -d "$replay_source"; then
            source_replay_sha="$(sudo cat "$replay_source/manifest.json" | jq -r '.artifact.sha256')"
            test "$source_replay_sha" = "$FAILED_REPLAY_SHA"
            if sudo test -e "$replay_archive"; then
              echo 'Both source and archived failed replay exist.' >&2
              exit 1
            fi
            sudo mv "$replay_source" "$ARCHIVE_ROOT/"
          fi
          sudo test -s "$replay_archive/manifest.json"
          archived_replay_sha="$(sudo cat "$replay_archive/manifest.json" | jq -r '.artifact.sha256')"
          test "$archived_replay_sha" = "$FAILED_REPLAY_SHA"
          for directory in recommendation-pro-decision-dataset-v6-1 recommendation-behavioral-v5-1 recommendation-value-v8-diagnostic-1 recommendation-v6-short-only-dataset-v6-baseline-1 recommendation-value-v8-full-evaluation-1; do
            source="$STORAGE_MOUNT_SOURCE/$directory"
            target="$ARCHIVE_ROOT/$directory"
            if sudo test -e "$source"; then
              if sudo test -e "$target"; then
                target="$ARCHIVE_ROOT/${directory}-retry-${GITHUB_RUN_ID}"
              fi
              sudo mv "$source" "$target"
            fi
          done
          sudo test -s "$STORAGE_MOUNT_SOURCE/build-decision-dataset-v3/dataset.ndjson"
          sudo test -s "$STORAGE_MOUNT_SOURCE/build-decision-dataset-v3/manifest.json"
          sudo test -s "$STORAGE_MOUNT_SOURCE/recommendation-candidate-generator-snapshots/registry.json"
          source_sha="$(sudo cat "$STORAGE_MOUNT_SOURCE/build-decision-dataset-v3/manifest.json" | jq -r '.artifact.sha256')"
          source_rows="$(sudo cat "$STORAGE_MOUNT_SOURCE/build-decision-dataset-v3/manifest.json" | jq -r '.artifact.rowCount')"
          test "$source_sha" = 'ff04970fda519ca5ebbfa49991af05ef99b99038d3f9f39f64fc9b0d07018fad'
          test "$source_rows" = '6188423'
          {
            printf 'Archived failed replay %s\n' "$FAILED_REPLAY_SHA"
            printf 'Archive root: %s\n' "$ARCHIVE_ROOT"
            printf 'Verified Dataset V3: %s rows, SHA %s\n' "$source_rows" "$source_sha"
            sudo du -sh "$ARCHIVE_ROOT"
          } | tee "$TRAINING_RUN_DIR/archive-report.txt"

      - name: Start repaired isolated API
        shell: bash
        run: |
          set -euo pipefail
          deploy_dir='/home/ubuntu/apps/deadlock_dynamo_helper'
          mount_args=()
          if [ "$STORAGE_MOUNT_TYPE" = 'volume' ]; then
            mount_args+=(--mount "type=volume,src=$STORAGE_MOUNT_NAME,dst=/app/apps/api/storage")
          elif [ "$STORAGE_MOUNT_TYPE" = 'bind' ]; then
            mount_args+=(--mount "type=bind,src=$STORAGE_MOUNT_SOURCE,dst=/app/apps/api/storage")
          else
            echo "Unsupported storage type: $STORAGE_MOUNT_TYPE" >&2
            exit 1
          fi
          sudo docker run -d --name "$TRAINING_CONTAINER" --restart=no --network "$TRAINING_NETWORK" -p 127.0.0.1:3010:3000 --env-file "$deploy_dir/.env" -e DB_HOST=aboba-telegramovich-postgres-1 -e DB_PORT=5432 -e DB_USER=postgres -e DB_NAME=deadlock_builds -e DEADLOCK_TIMELINE_COLLECTOR_ENABLED=false -e DEADLOCK_CONTEXTUAL_SHADOW_ENABLED=false -e DEADLOCK_CONTEXTUAL_V3_LIVE_MODE=DISABLED -e DEADLOCK_RECOMMENDATION_VALUE_V6_LIVE_MODE=DISABLED -e DEADLOCK_RECOMMENDATION_VALUE_V8_SHADOW_ENABLED=false -e NODE_OPTIONS=--max-old-space-size=8192 "${mount_args[@]}" --mount "type=bind,src=$TRAINING_RUN_DIR,dst=/runner" "$TRAINING_IMAGE"
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3010/deadlock/analysis/build-decision-dataset-v3/status >/dev/null; then
              exit 0
            fi
            if [ "$(sudo docker inspect --format='{{.State.Running}}' "$TRAINING_CONTAINER")" != 'true' ]; then
              sudo docker logs --tail=300 "$TRAINING_CONTAINER"
              exit 1
            fi
            sleep 2
          done
          sudo docker logs --tail=300 "$TRAINING_CONTAINER"
          exit 1

      - name: Verify immutable inputs through isolated API
        shell: bash
        run: |
          set -euo pipefail
          source_manifest="$(curl --fail --silent http://127.0.0.1:3010/deadlock/analysis/build-decision-dataset-v3/manifest)"
          registry="$(curl --fail --silent http://127.0.0.1:3010/deadlock/analysis/recommendation-candidate-generator-snapshots/registry)"
          test "$(echo "$source_manifest" | jq -r '.artifact.sha256')" = 'ff04970fda519ca5ebbfa49991af05ef99b99038d3f9f39f64fc9b0d07018fad'
          test "$(echo "$source_manifest" | jq -r '.artifact.rowCount')" = '6188423'
          test "$(echo "$registry" | jq -r '[.snapshots[] | select(.snapshotId == "v8-20260722-c1-ff04970fda51")] | length')" = '1'

      - name: Start detached recovery supervisor
        shell: bash
        run: |
          set -euo pipefail
          : > "$TRAINING_RUN_DIR/training.log"
          ln -sfn "$TRAINING_RUN_DIR" "$TRAINING_RUN_ROOT/current"
          sudo docker exec -d -e API_BASE_URL=http://127.0.0.1:3000 -e TRAINING_RUN_ID="$TRAINING_RUN_ID" -e TRAINING_LOG_PATH=/runner/training.log -e TRAINING_STATUS_PATH=/runner/status.json -e TRAINING_RESOLVED_CONFIG_PATH=/runner/resolved-training-config.json -e REPLAY_PARTITION_COUNT=64 -e REPLAY_SNAPSHOT_STALENESS_S=300 -e DATASET_DECISION_SNAPSHOT_STALENESS_S=300 -e DIAGNOSTIC_MAX_ROWS=10000 -e PIPELINE_POLL_INTERVAL_MS=15000 -e PIPELINE_TIMEOUT_MS=604800000 "$TRAINING_CONTAINER" node /runner/run-recommendation-v8-replay-audit-recovery-v2.mjs
          for attempt in $(seq 1 60); do
            if [ -s "$TRAINING_RUN_DIR/status.json" ] && sudo docker exec "$TRAINING_CONTAINER" sh -lc "pgrep -f 'run-recommendation-v8-replay-audit-recovery-v2.mjs' >/dev/null"; then
              cat "$TRAINING_RUN_DIR/status.json"
              exit 0
            fi
            sleep 1
          done
          sudo docker logs --tail=300 "$TRAINING_CONTAINER"
          tail -n 300 "$TRAINING_RUN_DIR/training.log" || true
          exit 1

      - name: Consume request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('.github/training-requests/recommendation-v8-replay-audit-recovery-v2.json')
          value = json.loads(path.read_text())
          value['state'] = 'CONSUMED'
          value['consumedAt'] = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          value['deployedCommit'] = '${{ github.sha }}'
          path.write_text(json.dumps(value, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/training-requests/recommendation-v8-replay-audit-recovery-v2.json
          git commit -m 'chore: consume Recommendation V8 replay audit recovery request'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Upload launch metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v8-replay-audit-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TRAINING_RUN_DIR }}/archive-report.txt
            ${{ env.TRAINING_RUN_DIR }}/resolved-training-config.json
            ${{ env.TRAINING_RUN_DIR }}/status.json
            ${{ env.TRAINING_RUN_DIR }}/training.log
          if-no-files-found: warn
          retention-days: 30

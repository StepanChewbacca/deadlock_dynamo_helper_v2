name: Validate two-week retention refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines --silent

      - name: Run API tests
        shell: bash
        run: |
          set +e
          yarn workspace @deadlock-live-probe/api test > /tmp/api-tests.log 2>&1
          status=$?
          tail -n 250 /tmp/api-tests.log
          exit $status

      - name: Build API
        if: always()
        shell: bash
        run: |
          set +e
          yarn workspace @deadlock-live-probe/api build > /tmp/api-build.log 2>&1
          status=$?
          tail -n 250 /tmp/api-build.log
          exit $status

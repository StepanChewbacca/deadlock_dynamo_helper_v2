name: Validate two-week retention refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines --silent

      - name: Build API dependencies
        run: yarn workspace @deadlock-live-probe/shared build && yarn workspace @deadlock-live-probe/build-domain build

      - name: Run API tests
        run: yarn workspace @deadlock-live-probe/api test

      - name: Build API
        run: yarn workspace @deadlock-live-probe/api build

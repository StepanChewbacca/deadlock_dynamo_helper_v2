name: Apply Contextual V3 production integration

on:
  push:
    branches:
      - agent/contextual-v3-production
    paths:
      - .github/workflows/apply-contextual-v3-production-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/contextual-v3-production
          fetch-depth: 0
      - name: Apply integration
        run: python3 scripts/apply-contextual-v3-production-integration.py
      - name: Validate diff
        run: git diff --check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/deadlock-live/contextual-hero-build-recommendation.service.ts apps/api/src/deadlock-live/hero-build-recommendation.controller.ts apps/api/src/deadlock-live/hero-build-recommendation-presentation.service.ts apps/api/src/deadlock-live/deadlock-live.module.ts docker-compose.yml
          git commit -m "feat: integrate Contextual V3 into production API"
          git push origin HEAD:agent/contextual-v3-production

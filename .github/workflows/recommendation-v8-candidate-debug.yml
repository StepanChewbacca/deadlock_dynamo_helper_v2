name: Recommendation V8 Candidate Snapshot Debug

on:
  push:
    paths:
      - '.github/workflows/recommendation-v8-candidate-debug.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  debug:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Capture candidate snapshot failure
        shell: bash
        run: |
          set -u -o pipefail
          run_root='/home/ubuntu/apps/deadlock_dynamo_helper-training'
          current="$run_root/current"
          container='deadlock-recommendation-v8-training'
          report="$RUNNER_TEMP/recommendation-v8-candidate-debug.md"
          {
            echo '# Recommendation V8 candidate snapshot failure'
            echo
            echo "Generated: $(date --iso-8601=seconds)"
            echo
            echo '## Overall status'
            echo '```json'
            cat "$current/status.json" 2>/dev/null || true
            echo '```'
            echo
            echo '## Candidate snapshot status'
            echo '```json'
            curl --silent --max-time 30 http://127.0.0.1:3010/deadlock/analysis/recommendation-candidate-generator-snapshots/status 2>&1 || true
            echo
            echo '```'
            echo
            echo '## Candidate snapshot registry'
            echo '```json'
            curl --silent --max-time 30 http://127.0.0.1:3010/deadlock/analysis/recommendation-candidate-generator-snapshots/registry 2>&1 || true
            echo
            echo '```'
            echo
            echo '## Training log tail'
            echo '```text'
            tail -n 220 "$current/training.log" 2>/dev/null || true
            echo '```'
            echo
            echo '## Container log tail'
            echo '```text'
            sudo docker logs --tail=220 "$container" 2>&1 || true
            echo '```'
          } > "$report"
          echo "DEBUG_REPORT=$report" >> "$GITHUB_ENV"

      - name: Publish candidate debug issue
        uses: actions/github-script@v7
        env:
          DEBUG_REPORT: ${{ env.DEBUG_REPORT }}
        with:
          script: |
            const fs = require('fs');
            const title = '[debug] Recommendation V8 candidate snapshot failure';
            const body = fs.readFileSync(process.env.DEBUG_REPORT, 'utf8');
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = data.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                state: 'open',
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

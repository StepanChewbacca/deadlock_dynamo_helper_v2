name: V6 Exclusive Inspection

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect recommendation and Overwolf surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection/files
          {
            echo '=== production service references ==='
            grep -RIn --exclude-dir=node_modules --exclude-dir=dist -E 'ProductionHeroBuildRecommendationService|recommendationModel|CONTEXTUAL_V3|MODEL V3|Contextual V3' apps/api/test apps/overwolf-client/src 2>/dev/null || true
            echo
            echo '=== live recommendation API references ==='
            grep -RIn --exclude-dir=node_modules --exclude-dir=dist -E 'recommendationExperiment|recommendationModel|build-recommendation' apps/api/src/deadlock-live 2>/dev/null || true
          } > inspection/inspection.txt
          cp apps/api/src/deadlock-live/production-hero-build-recommendation.service.ts inspection/files/
          cp apps/api/src/deadlock-live/recommendation-value-v6-live.service.ts inspection/files/
          cp apps/overwolf-client/src/live-build-recommendation-poller.ts inspection/files/
          cp apps/overwolf-client/src/live-build-recommendation-ui.ts inspection/files/
          cp apps/overwolf-client/src/live-build-desktop-table-ui.ts inspection/files/
          cp apps/overwolf-client/package.json inspection/files/overwolf-package.json
          grep -Rl --exclude-dir=node_modules --exclude-dir=dist -E 'ProductionHeroBuildRecommendationService|recommendationModel|CONTEXTUAL_V3|MODEL V3|Contextual V3' apps/api/test apps/overwolf-client/src 2>/dev/null | while read -r file; do
            target="inspection/files/${file//\//__}"
            cp "$file" "$target"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: v6-exclusive-inspection-${{ github.sha }}
          path: inspection
          retention-days: 1

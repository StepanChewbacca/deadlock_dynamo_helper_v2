name: Recommendation V8 Replay Streaming Snapshot Recovery V5

on:
  pull_request:
    paths:
      - '.github/workflows/recommendation-v8-replay-streaming-snapshot-v5.yml'
      - '.github/training-requests/recommendation-v8-replay-streaming-snapshot-v5.json'

permissions:
  contents: write

concurrency:
  group: recommendation-v8-vps-training
  cancel-in-progress: false

jobs:
  patch-build-resume:
    runs-on: self-hosted
    timeout-minutes: 150
    steps:
      - name: Checkout training branch
        uses: actions/checkout@v4
        with:
          ref: agent/recommendation-value-v8-passive-shadow-1
          fetch-depth: 0

      - name: Check one-shot request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request='.github/training-requests/recommendation-v8-replay-streaming-snapshot-v5.json'
          if [ ! -f "$request" ] || [ "$(jq -r '.state // empty' "$request")" != 'REQUESTED' ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"

      - name: Apply canonical catalog hash fix
        if: steps.request.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-recommendation-v8-replay-streaming-snapshot-v5.py
          git diff --check

      - name: Build and test patched replay
        if: steps.request.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          builder_image="deadlock-recommendation-v8-replay-v5-builder:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          runtime_image="deadlock-recommendation-v8-replay-v5:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo docker build --target builder -t "$builder_image" .
          sudo docker run --rm --entrypoint yarn "$builder_image" workspace @deadlock-live-probe/api test recommendation-historical-pro-replay-artifact.spec.ts recommendation-historical-pro-replay-fractional-snapshot.spec.ts --runInBand
          sudo docker build -t "$runtime_image" .
          echo "TRAINING_IMAGE=$runtime_image" >> "$GITHUB_ENV"

      - name: Commit validated source and regression test
        if: steps.request.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Recommendation V8 Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/api/src/deadlock-live/recommendation-historical-pro-replay-artifact.service.ts apps/api/test/recommendation-historical-pro-replay-artifact.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix: canonicalize streamed replay catalog hash'
            git fetch origin agent/recommendation-value-v8-passive-shadow-1
            git rebase origin/agent/recommendation-value-v8-passive-shadow-1
            git push origin HEAD:agent/recommendation-value-v8-passive-shadow-1
          fi

      - name: Verify preserved artifacts and resolve isolated mounts
        if: steps.request.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          container='deadlock-recommendation-v8-training'
          test "$(sudo docker inspect --format='{{.State.Running}}' "$container")" = 'true'
          sudo docker exec "$container" node - <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('/app/apps/api/storage/build-decision-dataset-v3/manifest.json', 'utf8'));
          const sourceAudit = JSON.parse(fs.readFileSync('/app/apps/api/storage/build-decision-dataset-v3/audit.json', 'utf8'));
          const registry = JSON.parse(fs.readFileSync('/app/apps/api/storage/recommendation-candidate-generator-snapshots/registry.json', 'utf8'));
          const expectedSourceSha = 'ff04970fda519ca5ebbfa49991af05ef99b99038d3f9f39f64fc9b0d07018fad';
          const snapshotId = 'v8-20260722-c1-ff04970fda51';
          if (source.artifact?.sha256 !== expectedSourceSha || source.artifact?.rowCount !== 6188423 || source.auditPassed !== true || sourceAudit.passed !== true) {
            throw new Error('Completed Dataset V3 verification failed.');
          }
          const entry = registry.snapshots?.find((value) => value.snapshotId === snapshotId);
          if (!entry) {
            throw new Error('Completed candidate snapshot registry entry is missing.');
          }
          const snapshotPath = `/app/apps/api/storage/recommendation-candidate-generator-snapshots/${entry.fileName}`;
          if (!fs.statSync(snapshotPath).isFile() || fs.statSync(snapshotPath).size <= 0) {
            throw new Error('Completed candidate snapshot artifact is unavailable.');
          }
          NODE
          storage_type="$(sudo docker inspect --format='{{range .Mounts}}{{if eq .Destination "/app/apps/api/storage"}}{{.Type}}{{end}}{{end}}' "$container")"
          storage_name="$(sudo docker inspect --format='{{range .Mounts}}{{if eq .Destination "/app/apps/api/storage"}}{{.Name}}{{end}}{{end}}' "$container")"
          storage_source="$(sudo docker inspect --format='{{range .Mounts}}{{if eq .Destination "/app/apps/api/storage"}}{{.Source}}{{end}}{{end}}' "$container")"
          run_dir="$(readlink -f /home/ubuntu/apps/deadlock_dynamo_helper-training/current)"
          test -d "$run_dir"
          test -n "$storage_type"
          test -n "$storage_source"
          cp scripts/run-recommendation-v8-diagnostic-only-pipeline.mjs "$run_dir/"
          cp scripts/run-recommendation-v8-resume-diagnostic-supervisor.mjs "$run_dir/"
          echo "STORAGE_MOUNT_TYPE=$storage_type" >> "$GITHUB_ENV"
          echo "STORAGE_MOUNT_NAME=$storage_name" >> "$GITHUB_ENV"
          echo "STORAGE_MOUNT_SOURCE=$storage_source" >> "$GITHUB_ENV"
          echo "TRAINING_RUN_DIR=$run_dir" >> "$GITHUB_ENV"
          echo "TRAINING_RUN_ID=$(jq -r '.runId' "$run_dir/status.json")" >> "$GITHUB_ENV"

      - name: Replace only isolated training API
        if: steps.request.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          container='deadlock-recommendation-v8-training'
          sudo docker rm -f "$container" >/dev/null
          mount_args=()
          if [ "$STORAGE_MOUNT_TYPE" = 'volume' ]; then
            mount_args+=(--mount "type=volume,src=$STORAGE_MOUNT_NAME,dst=/app/apps/api/storage")
          elif [ "$STORAGE_MOUNT_TYPE" = 'bind' ]; then
            mount_args+=(--mount "type=bind,src=$STORAGE_MOUNT_SOURCE,dst=/app/apps/api/storage")
          else
            echo "Unsupported storage mount type: $STORAGE_MOUNT_TYPE" >&2
            exit 1
          fi
          deploy_dir='/home/ubuntu/apps/deadlock_dynamo_helper'
          sudo docker run -d --name "$container" --restart=no --network aboba-telegramovich_default -p 127.0.0.1:3010:3000 --env-file "$deploy_dir/.env" -e DB_HOST=aboba-telegramovich-postgres-1 -e DB_PORT=5432 -e DB_USER=postgres -e DB_NAME=deadlock_builds -e DEADLOCK_TIMELINE_COLLECTOR_ENABLED=false -e DEADLOCK_CONTEXTUAL_SHADOW_ENABLED=false -e DEADLOCK_CONTEXTUAL_V3_LIVE_MODE=DISABLED -e DEADLOCK_RECOMMENDATION_VALUE_V6_LIVE_MODE=DISABLED -e DEADLOCK_RECOMMENDATION_VALUE_V8_SHADOW_ENABLED=false -e NODE_OPTIONS=--max-old-space-size=8192 "${mount_args[@]}" --mount "type=bind,src=$TRAINING_RUN_DIR,dst=/runner" "$TRAINING_IMAGE"
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3010/deadlock/analysis/build-decision-dataset-v3/status >/dev/null; then
              break
            fi
            if [ "$(sudo docker inspect --format='{{.State.Running}}' "$container")" != 'true' ]; then
              sudo docker logs --tail=300 "$container"
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3010/deadlock/analysis/build-decision-dataset-v3/status | jq -e '.state == "COMPLETE" and .rowCount == 6188423' >/dev/null
          sudo docker exec "$container" node - <<'NODE'
          const fs = require('fs');
          const registry = JSON.parse(fs.readFileSync('/app/apps/api/storage/recommendation-candidate-generator-snapshots/registry.json', 'utf8'));
          const snapshotId = 'v8-20260722-c1-ff04970fda51';
          const entry = registry.snapshots?.find((value) => value.snapshotId === snapshotId);
          if (!entry) throw new Error('Candidate snapshot registry entry is missing after isolated API replacement.');
          const path = `/app/apps/api/storage/recommendation-candidate-generator-snapshots/${entry.fileName}`;
          if (!fs.statSync(path).isFile() || fs.statSync(path).size <= 0) throw new Error('Candidate snapshot artifact is missing after isolated API replacement.');
          NODE

      - name: Resume detached diagnostic pipeline
        if: steps.request.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          container='deadlock-recommendation-v8-training'
          sudo docker exec -d -e API_BASE_URL=http://127.0.0.1:3000 -e TRAINING_RUN_ID="$TRAINING_RUN_ID" -e TRAINING_LOG_PATH=/runner/training.log -e TRAINING_STATUS_PATH=/runner/status.json -e TRAINING_RESOLVED_CONFIG_PATH=/runner/resolved-training-config.json -e TRAINING_PIPELINE_SCRIPT=/runner/run-recommendation-v8-diagnostic-only-pipeline.mjs -e DIAGNOSTIC_MAX_ROWS=10000 -e PIPELINE_POLL_INTERVAL_MS=15000 -e PIPELINE_TIMEOUT_MS=172800000 -e PIPELINE_REQUEST_TIMEOUT_MS=30000 -e PIPELINE_REQUEST_RETRY_COUNT=240 -e PIPELINE_REQUEST_RETRY_DELAY_MS=5000 "$container" node /runner/run-recommendation-v8-resume-diagnostic-supervisor.mjs
          for attempt in $(seq 1 180); do
            overall="$(cat "$TRAINING_RUN_DIR/status.json" 2>/dev/null || true)"
            replay="$(curl --silent --max-time 20 http://127.0.0.1:3010/deadlock/analysis/recommendation-historical-pro-replay/status || true)"
            if echo "$overall" | jq -e '.state == "RUNNING" and .stage == "OFFLINE_V8_DIAGNOSTIC_PIPELINE_RESUME"' >/dev/null 2>&1 && echo "$replay" | jq -e '.state == "RUNNING" and (.phase == "PARTITIONING" or .phase == "REPLAYING" or .phase == "FINALIZING")' >/dev/null 2>&1; then
              echo "$overall"
              echo "$replay"
              exit 0
            fi
            if echo "$overall" | jq -e '.state == "FAILED"' >/dev/null 2>&1 || echo "$replay" | jq -e '.state == "FAILED"' >/dev/null 2>&1; then
              echo "$overall"
              echo "$replay"
              tail -n 200 "$TRAINING_RUN_DIR/training.log" || true
              exit 1
            fi
            sleep 2
          done
          sudo docker logs --tail=300 "$container"
          tail -n 200 "$TRAINING_RUN_DIR/training.log" || true
          exit 1

      - name: Consume successful request
        if: steps.request.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          request='.github/training-requests/recommendation-v8-replay-streaming-snapshot-v5.json'
          jq '.state="CONSUMED" | .consumedAt=(now | todate)' "$request" > "$request.tmp"
          mv "$request.tmp" "$request"
          git config user.name 'Recommendation V8 Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add "$request"
          git commit -m 'chore: consume canonical replay hash recovery'
          git fetch origin agent/recommendation-value-v8-passive-shadow-1
          git rebase origin/agent/recommendation-value-v8-passive-shadow-1
          git push origin HEAD:agent/recommendation-value-v8-passive-shadow-1

name: Recommendation V8 Post Cleanup Restart V6

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-v8-post-cleanup-restart-v6.json'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: recommendation-v8-post-cleanup-restart-v6
  cancel-in-progress: false

jobs:
  release-runner:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.gate.outputs.should-run }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Validate restart request
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          request='.github/training-requests/recommendation-v8-post-cleanup-restart-v6.json'
          if [ "$(jq -r '.state' "$request")" != 'REQUESTED' ]; then
            echo 'should-run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(jq -r '.operation' "$request")" = 'POST_CLEANUP_CAPACITY_GUARDED_RESTART_5000_V6'
          test "$(jq -r '.matchLimit' "$request")" = '5000'
          test "$(jq -r '.minimumFreeGiB' "$request")" = '50'
          test "$(jq -r '.minimumRuntimeReserveGiB' "$request")" = '12'
          test "$(jq -r '.projectedObservedActionCandidateCoverage' "$request")" = '0.9993386075392879'
          test "$(jq -r '.observedActionInjectionAuthorized' "$request")" = 'false'
          test "$(jq -r '.productionRankingChanged' "$request")" = 'false'
          test "$(jq -r '.passiveShadowActivated' "$request")" = 'false'
          test "$(jq -r '.randomizedCanaryAuthorized' "$request")" = 'false'
          echo 'should-run=true' >> "$GITHUB_OUTPUT"

      - name: Cancel stale Recommendation V8 runs
        if: steps.gate.outputs.should-run == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const current = Number(context.runId);
            for (const status of ['queued', 'in_progress', 'pending']) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { owner: context.repo.owner, repo: context.repo.repo, status, per_page: 100 },
              );
              for (const run of runs) {
                if (run.id === current || typeof run.name !== 'string' || !run.name.startsWith('Recommendation V8')) {
                  continue;
                }
                try {
                  await github.request(
                    'POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel',
                    { owner: context.repo.owner, repo: context.repo.repo, run_id: run.id },
                  );
                } catch (error) {
                  core.warning(`Unable to force-cancel ${run.id}: ${error.message}`);
                }
              }
            }

  restart:
    needs: release-runner
    if: needs.release-runner.outputs.should-run == 'true'
    runs-on: self-hosted
    timeout-minutes: 180
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Verify post-cleanup capacity and inputs
        shell: bash
        run: |
          set -euo pipefail
          request='.github/training-requests/recommendation-v8-post-cleanup-restart-v6.json'
          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          container='deadlock-recommendation-v8-training'
          minimum_free_bytes=$((50 * 1024 * 1024 * 1024))
          free_bytes="$(df --output=avail -B1 / | tail -n 1 | tr -d ' ')"

          test "$free_bytes" -ge "$minimum_free_bytes"
          test ! -e "$storage/recommendation-historical-pro-replay-terminal-5000-v2"
          test ! -e "$storage/recommendation-pro-decision-dataset-v6-terminal-5000-v2"
          test ! -e "$storage/recommendation-behavioral-v5-terminal-5000-v2"
          test ! -e "$storage/recommendation-value-v8-diagnostic-terminal-5000-v2"
          sudo test -s "$storage/recommendation-v8-bounded-5000-v1/replay-v3/dataset.ndjson"
          sudo test -s "$storage/recommendation-candidate-generator-snapshots-5000-v1/v8-5000-c6637-30701422914.json"
          sudo test -d "$storage/match-timeline-events-v1"
          sudo docker inspect aboba-telegramovich-postgres-1 >/dev/null
          ! sudo docker ps -a --format '{{.Names}}' | grep -Fxq "$container"

          grep -R "RECOMMENDATION_HISTORICAL_PRO_REPLAY_2" apps/api/src/deadlock-live/recommendation-historical-pro-replay.ts
          grep -R "RECOMMENDATION_PRO_DECISION_DATASET_V6_2" apps/api/src/deadlock-live/recommendation-pro-decision-dataset-v6.ts
          grep -R "RECOMMENDATION_HISTORICAL_OFFLINE_CANDIDATE_LIMIT = 256" apps/api/src/deadlock-live/recommendation-candidate-generator-snapshot.ts
          test "$(jq -r '.minimumFreeGiB' .github/training-requests/recommendation-v8-timeline-audit-fix-resume-v2.json)" = '50'
          test "$(jq -r '.minimumRuntimeReserveGiB' .github/training-requests/recommendation-v8-timeline-audit-fix-resume-v2.json)" = '12'

          {
            date --iso-8601=seconds
            echo "freeBytes=$free_bytes"
            echo "minimumFreeBytes=$minimum_free_bytes"
            df -hT /
            sudo du -sh "$storage/recommendation-v8-bounded-5000-v1" "$storage/recommendation-candidate-generator-snapshots-5000-v1" "$storage/match-timeline-events-v1"
          } | tee post-cleanup-capacity.txt

      - name: Start capacity-guarded bounded run
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-recommendation-v8-capacity-guarded-rebuild-5000-v4.sh

      - name: Verify restarted run
        shell: bash
        run: |
          set -euo pipefail
          container='deadlock-recommendation-v8-training'
          sudo docker inspect "$container" --format='running={{.State.Running}} status={{.State.Status}} exitCode={{.State.ExitCode}} oomKilled={{.State.OOMKilled}} startedAt={{.State.StartedAt}}' | tee restarted-container.txt
          test "$(sudo docker inspect "$container" --format='{{.State.Running}}')" = 'true'
          sudo docker exec "$container" sh -lc "pgrep -f '[r]un-recommendation-v8-diagnostic-only-pipeline.mjs' >/dev/null"
          sudo docker exec "$container" sh -lc "pgrep -f '[m]onitor-recommendation-v8-disk-reserve-v1.sh' >/dev/null"
          curl --fail --silent --max-time 15 http://127.0.0.1:3010/deadlock/analysis/recommendation-historical-pro-replay/status | tee restarted-replay-status.json
          jq -e '.state == "RUNNING" or (.state == "COMPLETE" and .auditPassed == true)' restarted-replay-status.json
          jq -e '.outputDirectory == "/app/apps/api/storage/recommendation-historical-pro-replay-terminal-5000-v2"' restarted-replay-status.json

      - name: Consume restart request
        shell: bash
        run: |
          set -euo pipefail
          branch='agent/recommendation-value-v8-passive-shadow-1'
          request='.github/training-requests/recommendation-v8-post-cleanup-restart-v6.json'
          tmp="$(mktemp)"
          jq --arg completedAt "$(date --iso-8601=seconds)" '.state = "CONSUMED" | .completedAt = $completedAt' "$request" > "$tmp"
          mv "$tmp" "$request"
          git config user.name 'Recommendation V8 Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add "$request"
          git commit -m 'chore: consume Recommendation V8 post-cleanup restart'
          git fetch origin "$branch"
          git rebase "origin/$branch"
          git push origin "HEAD:$branch"

      - name: Upload restart evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v8-post-cleanup-restart-v6-${{ github.run_id }}
          path: |
            post-cleanup-capacity.txt
            restarted-container.txt
            restarted-replay-status.json
          if-no-files-found: warn
          retention-days: 14

name: Run recommendation V4 historical training

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-recommendation-v4-historical-training.yml
      - scripts/run-recommendation-v4-historical-training.mjs

permissions:
  contents: read

jobs:
  train:
    if: github.event.pull_request.head.ref == 'diagnostics/run-recommendation-v4-historical-training-20260724'
    runs-on: self-hosted
    timeout-minutes: 360
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run historical bootstrap and training
        run: node scripts/run-recommendation-v4-historical-training.mjs

      - name: Restore production API configuration
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          deploy_repo=/home/ubuntu/apps/deadlock_dynamo_helper
          cd "$deploy_repo"
          sudo docker compose up -d --force-recreate --no-deps api
          rm -f /tmp/recommendation-v4-historical-training.override.yml
          for attempt in $(seq 1 180); do
            if curl --max-time 10 --fail --silent http://127.0.0.1:3000/deadlock/analysis/recommendation-telemetry/status >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Upload historical training results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v4-historical-training-${{ github.sha }}
          path: recommendation-v4-historical-training-result
          if-no-files-found: warn
          retention-days: 14

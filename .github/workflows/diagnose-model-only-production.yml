name: Diagnose model-only production

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-model-only-production.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Verify deployed model-only backend
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/apps/deadlock_dynamo_helper
          echo '--- timestamp ---'
          date -u +'%Y-%m-%dT%H:%M:%SZ'
          echo '--- deployed git head ---'
          git rev-parse HEAD
          echo '--- containers ---'
          sudo docker compose ps
          echo '--- local model status ---'
          status="$(curl --fail --show-error --silent --max-time 20 http://127.0.0.1:3000/deadlock/analysis/contextual-v3-live/status)"
          echo "$status"
          echo "$status" | python3 -c "import json,sys; x=json.load(sys.stdin); assert x['mode']=='PRODUCTION' and x['model']['state']=='READY' and x['modelOnly'] is True and x['fallbackEnabled'] is False"
          echo '--- public model status ---'
          public_status="$(curl --fail --show-error --silent --max-time 20 https://aboba-telegramovich.duckdns.org/deadlock/analysis/contextual-v3-live/status)"
          echo "$public_status"
          echo "$public_status" | python3 -c "import json,sys; x=json.load(sys.stdin); assert x['mode']=='PRODUCTION' and x['model']['state']=='READY' and x['modelOnly'] is True and x['fallbackEnabled'] is False"
          echo '--- model-only recommendation smoke ---'
          recommendation="$(curl --fail --show-error --silent --max-time 30 \
            -H 'Content-Type: application/json' \
            -d '{"heroId":11,"itemIds":[],"gameTimeS":0,"alliedHeroIds":[],"enemyHeroIds":[],"previousActionKeys":[],"limit":5}' \
            http://127.0.0.1:3000/deadlock/analysis/build-recommendation)"
          echo "$recommendation"
          echo "$recommendation" | python3 -c "import json,sys; x=json.load(sys.stdin); assert x['recommendationModel']=='CONTEXTUAL_V3' and x['action']['actionKey']"

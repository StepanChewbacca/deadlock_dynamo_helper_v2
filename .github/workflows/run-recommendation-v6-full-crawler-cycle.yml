name: Run Recommendation V6 full-crawler cycle

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-recommendation-v6-full-crawler-cycle.yml
      - scripts/run-recommendation-v6-full-crawler-cycle.mjs
      - scripts/validate-recommendation-v6-full-crawler-result.mjs

permissions:
  actions: write
  contents: read

jobs:
  reset-training-queue:
    if: github.event.pull_request.head.ref == 'diagnostics/run-recommendation-v6-cycle-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TRAINING_WORKFLOW_ID: '320515287'
    steps:
      - name: Cancel older Recommendation V6 runs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t run_ids < <(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${TRAINING_WORKFLOW_ID}/runs?per_page=100" \
              --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | select(.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\") | .id"
          )
          for run_id in "${run_ids[@]}"; do
            echo "Cancelling older Recommendation V6 run ${run_id}"
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done

  inspect-storage:
    needs: reset-training-queue
    if: github.event.pull_request.head.ref == 'diagnostics/run-recommendation-v6-cycle-20260726'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Inspect production and training storage
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$GITHUB_WORKSPACE/recommendation-storage-report.txt"
          VOLUME_NAME="$(sudo docker volume ls --format '{{.Name}}' | grep 'deadlock-storage' | head -n 1)"
          VOLUME_ROOT="$(sudo docker volume inspect -f '{{.Mountpoint}}' "$VOLUME_NAME")"
          cd /home/ubuntu/apps/deadlock_dynamo_helper
          API_CONTAINER="$(sudo docker compose ps -q api)"
          {
            echo '=== DISK ==='
            df -h
            echo "VOLUME_NAME=$VOLUME_NAME"
            echo "VOLUME_ROOT=$VOLUME_ROOT"
            echo "API_CONTAINER=$API_CONTAINER"
            echo
            echo '=== PRODUCTION API ENV ==='
            sudo docker inspect "$API_CONTAINER" --format '{{range .Config.Env}}{{println .}}{{end}}' \
              | grep -E 'DEADLOCK_(CONTEXTUAL|RECOMMENDATION|BUILD_EVALUATION)' \
              | sort || true
            echo
            echo '=== LIVE STATUS ==='
            curl --max-time 15 --silent --show-error http://127.0.0.1:3000/deadlock/analysis/contextual-v3-live/status || true
            echo
            curl --max-time 15 --silent --show-error http://127.0.0.1:3000/deadlock/analysis/recommendation-telemetry/status || true
            echo
            echo '=== TARGET DIRECTORIES ==='
            for name in \
              recommendation-decision-dataset-v5-full-crawler-20260725 \
              recommendation-decision-dataset-v4-full-crawler-recovery-v3-20260725 \
              recommendation-decision-dataset-v4-historical-bootstrap \
              recommendation-decision-dataset-v4-full-crawler-20260724 \
              contextual-v3-training-full-crawler-recovery-v3-20260725 \
              recommendation-behavioral-v4-full-crawler-recovery-v3-20260725; do
              dir="$VOLUME_ROOT/$name"
              echo
              echo "--- $name ---"
              if ! sudo test -d "$dir"; then
                echo 'MISSING'
                continue
              fi
              sudo du -sh "$dir"
              sudo find "$dir" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
              for json in manifest.json audit.json evaluation.json model.json; do
                if sudo test -f "$dir/$json"; then
                  echo "[$json]"
                  sudo jq '{datasetVersion,modelVersion,schemaVersion,passed,releaseGatePassed,releaseGate,artifact,artifacts,source,createdAt,completedAt}' "$dir/$json" 2>/dev/null || sudo head -c 6000 "$dir/$json"
                  echo
                fi
              done
            done
            echo
            echo '=== ALL RECOMMENDATION/CONTEXTUAL DIRECTORIES ==='
            sudo find "$VOLUME_ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | grep -E '^(recommendation|contextual-v3)' \
              | sort \
              | while read -r name; do sudo du -sh "$VOLUME_ROOT/$name"; done
            echo
            echo '=== FINAL DISK ==='
            df -h
          } | tee "$REPORT"

      - name: Upload storage report
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-storage-report-${{ github.sha }}
          path: recommendation-storage-report.txt
          if-no-files-found: error
          retention-days: 3

name: Run Recommendation V6 full-crawler cycle

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-recommendation-v6-full-crawler-cycle.yml
      - scripts/run-recommendation-v6-full-crawler-cycle.mjs
      - scripts/validate-recommendation-v6-full-crawler-result.mjs

permissions:
  actions: write
  contents: read

jobs:
  reset-training-queue:
    if: github.event.pull_request.head.ref == 'diagnostics/run-recommendation-v6-cycle-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TRAINING_WORKFLOW_ID: '320515287'
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Cancel older Recommendation V6 runs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t run_ids < <(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${TRAINING_WORKFLOW_ID}/runs?per_page=100" \
              --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | select(.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\") | .id"
          )

          for run_id in "${run_ids[@]}"; do
            echo "Cancelling older Recommendation V6 run ${run_id}"
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done

          for attempt in $(seq 1 60); do
            active_count=$(gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${TRAINING_WORKFLOW_ID}/runs?per_page=100" \
              --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | select(.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\")] | length" \
              | awk '{ total += $1 } END { print total + 0 }')
            if [ "${active_count}" -eq 0 ]; then
              echo 'Older Recommendation V6 runs are stopped.'
              break
            fi
            echo "Waiting for ${active_count} older run(s) to stop."
            sleep 5
          done

      - name: Inspect configured remote automation
        shell: bash
        run: |
          set -euo pipefail
          echo 'WORKFLOW_FILES_BEGIN'
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort
          echo 'WORKFLOW_FILES_END'
          echo 'REFERENCED_SECRETS_BEGIN'
          grep -RhoE 'secrets\.[A-Za-z0-9_]+' .github/workflows | sort -u || true
          echo 'REFERENCED_SECRETS_END'
          echo 'REMOTE_ACTIONS_BEGIN'
          grep -RniE 'ssh|scp|rsync|deploy|appleboy|webhook' .github/workflows || true
          echo 'REMOTE_ACTIONS_END'

  train-and-evaluate:
    needs: reset-training-queue
    if: github.event.pull_request.head.ref == 'diagnostics/run-recommendation-v6-cycle-20260726'
    runs-on: self-hosted
    timeout-minutes: 1200
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Dataset V5.3, Value V6, and Policy V6 cycle
        run: node scripts/run-recommendation-v6-full-crawler-cycle.mjs

      - name: Validate timeline and team-economy coverage
        run: node scripts/validate-recommendation-v6-full-crawler-result.mjs

      - name: Restore production API configuration
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/apps/deadlock_dynamo_helper
          sudo docker compose up -d --force-recreate --no-deps api
          rm -f /tmp/recommendation-v6-full-crawler.override.yml
          for attempt in $(seq 1 180); do
            if curl --max-time 10 --fail --silent http://127.0.0.1:3000/deadlock/analysis/recommendation-telemetry/status >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Upload Recommendation V6 cycle results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v6-full-crawler-${{ github.sha }}
          path: recommendation-v6-full-crawler-result
          if-no-files-found: warn
          retention-days: 14

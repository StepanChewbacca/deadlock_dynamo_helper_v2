name: Run Recommendation V6 full-crawler cycle

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-recommendation-v6-full-crawler-cycle.yml
      - scripts/run-recommendation-v6-full-crawler-cycle.mjs
      - scripts/validate-recommendation-v6-full-crawler-result.mjs

permissions:
  actions: write
  contents: read

jobs:
  reset-training-queue:
    if: github.event.pull_request.head.ref == 'diagnostics/run-recommendation-v6-cycle-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TRAINING_WORKFLOW_ID: '320515287'
    steps:
      - name: Cancel older Recommendation V6 runs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t run_ids < <(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${TRAINING_WORKFLOW_ID}/runs?per_page=100" \
              --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | select(.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\") | .id"
          )
          for run_id in "${run_ids[@]}"; do
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done

  inspect-v5-checkpoint:
    needs: reset-training-queue
    if: github.event.pull_request.head.ref == 'diagnostics/run-recommendation-v6-cycle-20260726'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Inspect V5 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          VOLUME_NAME="$(sudo docker volume ls --format '{{.Name}}' | grep 'deadlock-storage' | head -n 1)"
          VOLUME_ROOT="$(sudo docker volume inspect -f '{{.Mountpoint}}' "$VOLUME_NAME")"
          for name in \
            recommendation-decision-dataset-v5-full-crawler-20260725 \
            recommendation-decision-dataset-v5-full-crawler-v2-20260725; do
            dir="$VOLUME_ROOT/$name"
            echo "=== $name ==="
            echo '[checkpoint.json]'
            sudo cat "$dir/work/checkpoint.json" || true
            echo
            echo "source_part_count=$(sudo find "$dir/work/source-parts" -type f | wc -l)"
            echo "output_part_count=$(sudo find "$dir/work/output-parts" -type f | wc -l)"
            echo "part_stats_count=$(sudo find "$dir/work/part-stats" -type f | wc -l)"
            echo '[last output parts]'
            sudo find "$dir/work/output-parts" -type f -printf '%f %s bytes\n' | sort | tail -n 20 || true
          done
          df -h /

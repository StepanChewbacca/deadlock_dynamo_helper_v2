name: Run Recommendation V6 full-crawler cycle

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-recommendation-v6-full-crawler-cycle.yml
      - scripts/run-recommendation-v6-full-crawler-cycle.mjs
      - scripts/validate-recommendation-v6-full-crawler-result.mjs

permissions:
  actions: write
  contents: read

jobs:
  reset-training-queue:
    if: github.event.pull_request.head.ref == 'diagnostics/run-recommendation-v6-cycle-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TRAINING_WORKFLOW_ID: '320515287'
    steps:
      - name: Cancel older Recommendation V6 runs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t run_ids < <(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${TRAINING_WORKFLOW_ID}/runs?per_page=100" \
              --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | select(.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\") | .id"
          )
          for run_id in "${run_ids[@]}"; do
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done

  inspect-v5-storage:
    needs: reset-training-queue
    if: github.event.pull_request.head.ref == 'diagnostics/run-recommendation-v6-cycle-20260726'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Inspect V5 storage candidates
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$GITHUB_WORKSPACE/recommendation-v5-storage-report.txt"
          VOLUME_NAME="$(sudo docker volume ls --format '{{.Name}}' | grep 'deadlock-storage' | head -n 1)"
          VOLUME_ROOT="$(sudo docker volume inspect -f '{{.Mountpoint}}' "$VOLUME_NAME")"
          {
            echo '=== LIVE V5 STATUS ==='
            for suffix in status manifest audit source-availability; do
              echo "[$suffix]"
              curl --max-time 20 --silent --show-error "http://127.0.0.1:3000/deadlock/analysis/recommendation-decision-dataset-v5/$suffix" || true
              echo
            done
            for name in \
              recommendation-decision-dataset-v5-full-crawler-20260725 \
              recommendation-decision-dataset-v5-full-crawler-v2-20260725; do
              dir="$VOLUME_ROOT/$name"
              echo
              echo "=== $name ==="
              sudo du -sh "$dir" || true
              echo '[TOP LEVEL]'
              sudo find "$dir" -maxdepth 1 -printf '%y %f %s bytes\n' | sort || true
              echo '[DEPTH 2 LARGE FILES]'
              sudo find "$dir" -maxdepth 2 -type f -printf '%s %p\n' | sort -nr | head -n 100 || true
              echo '[DIRECTORY SIZES]'
              sudo du -h --max-depth=2 "$dir" 2>/dev/null | sort -h | tail -n 100 || true
              for json in manifest.json audit.json source-availability.json progress.json status.json; do
                if sudo test -f "$dir/$json"; then
                  echo "[$json]"
                  sudo cat "$dir/$json"
                  echo
                fi
              done
            done
            echo '=== DISK ==='
            df -h /
          } | tee "$REPORT"

      - name: Upload V5 storage report
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v5-storage-report-${{ github.sha }}
          path: recommendation-v5-storage-report.txt
          if-no-files-found: error
          retention-days: 3

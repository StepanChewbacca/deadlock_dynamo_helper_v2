name: Apply value V4 team outcome fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-value-v4-team-outcome-fix.yml
      - scripts/apply-value-v4-team-outcome-fix.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/value-v4-team-scoped-outcome-consistency'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply fix
        run: python3 scripts/apply-value-v4-team-outcome-fix.py

      - name: Remove temporary files
        run: rm -f .github/workflows/apply-value-v4-team-outcome-fix.yml scripts/apply-value-v4-team-outcome-fix.py

      - name: Verify diff
        run: git diff --check

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/deadlock-live/recommendation-value-v4-training.service.ts apps/api/test/recommendation-value-v4-training.spec.ts .github/workflows/apply-value-v4-team-outcome-fix.yml scripts/apply-value-v4-team-outcome-fix.py
          git commit -m "fix: scope value outcomes by team"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

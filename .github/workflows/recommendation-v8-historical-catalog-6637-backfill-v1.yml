name: Recommendation V8 Historical Catalog 6637 Backfill V1

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-v8-historical-catalog-6637-backfill-v1.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recommendation-v8-historical-catalog-backfill
  cancel-in-progress: false

jobs:
  request-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.request.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - id: request
        shell: bash
        run: |
          set -euo pipefail
          request='.github/training-requests/recommendation-v8-historical-catalog-6637-backfill-v1.json'
          state="$(jq -r '.state // empty' "$request")"
          if [ "$state" = 'CONSUMED' ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$state" = 'REQUESTED'
          test "$(jq -r '.operation' "$request")" = 'BACKFILL_HISTORICAL_CATALOG_6637_V1'
          test "$(jq -r '.clientVersion' "$request")" = '6637'
          test "$(jq -r '.productionRankingChanged' "$request")" = 'false'
          test "$(jq -r '.passiveShadowActivated' "$request")" = 'false'
          test "$(jq -r '.randomizedCanaryAuthorized' "$request")" = 'false'
          echo 'run=true' >> "$GITHUB_OUTPUT"

  backfill:
    needs: request-gate
    if: needs.request-gate.outputs.run == 'true'
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Build isolated reference-data image
        shell: bash
        run: |
          set -euo pipefail
          image="deadlock-recommendation-v8-catalog-backfill:${GITHUB_SHA}"
          sudo docker build -t "$image" .
          echo "BACKFILL_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Start temporary side-effect-disabled API
        shell: bash
        run: |
          set -euo pipefail
          container='deadlock-recommendation-v8-catalog-backfill'
          deploy_dir='/home/ubuntu/apps/deadlock_dynamo_helper'
          sudo docker rm -f "$container" >/dev/null 2>&1 || true
          sudo docker run -d --name "$container" --restart=no --network aboba-telegramovich_default -p 127.0.0.1:3011:3000 --env-file "$deploy_dir/.env" -e DB_HOST=aboba-telegramovich-postgres-1 -e DB_PORT=5432 -e DB_USER=postgres -e DB_NAME=deadlock_builds -e DEADLOCK_TIMELINE_COLLECTOR_ENABLED=false -e DEADLOCK_RECENT_MATCH_CRAWLER_ENABLED=false -e DEADLOCK_REFERENCE_DATA_IMPORT_ENABLED=false -e DEADLOCK_RECOMMENDATION_OUTCOME_LINKER_ENABLED=false -e DEADLOCK_TIMELINE_RECIPE_REFRESH_ENABLED=false -e DEADLOCK_CONTEXTUAL_SHADOW_ENABLED=false -e DEADLOCK_CONTEXTUAL_V3_LIVE_MODE=DISABLED -e DEADLOCK_RECOMMENDATION_VALUE_V6_LIVE_MODE=DISABLED -e DEADLOCK_RECOMMENDATION_VALUE_V8_SHADOW_ENABLED=false -e NODE_OPTIONS=--max-old-space-size=4096 --mount type=volume,src=deadlock_dynamo_helper_deadlock-storage,dst=/app/apps/api/storage "$BACKFILL_IMAGE"
          echo "BACKFILL_CONTAINER=$container" >> "$GITHUB_ENV"
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3011/deadlock/reference-data/catalogs/available >/dev/null; then
              exit 0
            fi
            if [ "$(sudo docker inspect --format='{{.State.Running}}' "$container")" != 'true' ]; then
              sudo docker logs --tail=300 "$container"
              exit 1
            fi
            sleep 2
          done
          sudo docker logs --tail=300 "$container"
          exit 1

      - name: Import exact historical catalog
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/catalog-6637-backfill.json"
          response="$(curl --fail --silent --show-error --max-time 1800 -X POST http://127.0.0.1:3011/deadlock/reference-data/catalogs/import -H 'content-type: application/json' --data '{"clientVersions":[6637],"language":"english","force":false}')"
          echo "$response" | jq | tee "$report"
          test "$(echo "$response" | jq -r '.requestedClientVersions == [6637]')" = 'true'
          test "$(echo "$response" | jq -r '.imported | length')" = '1'
          test "$(echo "$response" | jq -r '.imported[0].clientVersion')" = '6637'
          test "$(echo "$response" | jq -r '.imported[0].itemCount > 0')" = 'true'
          test "$(echo "$response" | jq -r '.imported[0].payloadHash | length')" = '64'
          echo "CATALOG_VERSION_ID=$(echo "$response" | jq -r '.imported[0].catalogVersionId')" >> "$GITHUB_ENV"
          echo "CATALOG_PAYLOAD_HASH=$(echo "$response" | jq -r '.imported[0].payloadHash')" >> "$GITHUB_ENV"

      - name: Validate and apply evidence-backed safe window
        shell: bash
        run: |
          set -euo pipefail
          manifest='{"source":"DEADLOCK_API_STEAM_INFO_ALL_V1_ROBUST_POLICY_WINDOW","dryRun":true,"replaceExistingWindows":false,"requireCatalogs":true,"entries":[{"clientVersion":6637,"validFrom":"2026-07-20T13:25:04.000Z","validTo":"2026-07-23T15:12:47.000Z","status":"active","evidence":{"endpoint":"/v1/assets/steam-info/all","sourceRevision":10836828,"versionDatetime":"2026-07-20T13:25:04","nextClientVersion":6638,"nextVersionDatetime":"2026-07-23T15:12:47","timestampTimezoneBasis":"STEAM_INFO_NAIVE_INTERPRETED_AS_UTC","policyTrainingWindowEnd":"2026-07-22T09:32:54.000Z","minimumBoundaryMarginHours":24,"selectionRobustToTimezoneOffsetHours":24}}]}'
          validation="$(curl --fail --silent --show-error --max-time 120 -X POST http://127.0.0.1:3011/deadlock/reference-data/rulesets/windows/validate -H 'content-type: application/json' --data "$manifest")"
          echo "$validation" | jq | tee "$RUNNER_TEMP/catalog-6637-window-validation.json"
          test "$(echo "$validation" | jq -r '.valid')" = 'true'
          apply="$(echo "$manifest" | jq '.dryRun = false')"
          applied="$(curl --fail --silent --show-error --max-time 120 -X PUT http://127.0.0.1:3011/deadlock/reference-data/rulesets/windows -H 'content-type: application/json' --data "$apply")"
          echo "$applied" | jq | tee "$RUNNER_TEMP/catalog-6637-window-applied.json"
          test "$(echo "$applied" | jq -r '.applied')" = 'true'
          test "$(echo "$applied" | jq -r '.appliedWindowCount')" = '1'

      - name: Verify catalog and window in PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          postgres='aboba-telegramovich-postgres-1'
          result="$(sudo docker exec "$postgres" psql -U postgres -d deadlock_builds -X -A -t -F '|' -c 'SELECT c.id, c."clientVersion", c."payloadHash", r."validFrom", r."validTo", r.status FROM item_catalog_versions c JOIN game_rulesets r ON r.id = c."rulesetId" WHERE c."clientVersion" = 6637;')"
          echo "$result" | tee "$RUNNER_TEMP/catalog-6637-postgres.txt"
          test "$(echo "$result" | cut -d'|' -f1)" = "$CATALOG_VERSION_ID"
          test "$(echo "$result" | cut -d'|' -f2)" = '6637'
          test "$(echo "$result" | cut -d'|' -f3)" = "$CATALOG_PAYLOAD_HASH"
          test "$(echo "$result" | cut -d'|' -f6)" = 'active'

      - name: Stop temporary API
        if: always()
        run: sudo docker rm -f deadlock-recommendation-v8-catalog-backfill >/dev/null 2>&1 || true

      - name: Consume request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('.github/training-requests/recommendation-v8-historical-catalog-6637-backfill-v1.json')
          value = json.loads(path.read_text())
          value['state'] = 'CONSUMED'
          value['consumedAt'] = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          value['catalogVersionId'] = int('${{ env.CATALOG_VERSION_ID }}')
          value['catalogPayloadHash'] = '${{ env.CATALOG_PAYLOAD_HASH }}'
          value['appliedCommit'] = '${{ github.sha }}'
          path.write_text(json.dumps(value, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/training-requests/recommendation-v8-historical-catalog-6637-backfill-v1.json
          git commit -m 'chore: consume historical catalog 6637 backfill request'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Upload backfill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v8-historical-catalog-6637-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/catalog-6637-backfill.json
            ${{ runner.temp }}/catalog-6637-window-validation.json
            ${{ runner.temp }}/catalog-6637-window-applied.json
            ${{ runner.temp }}/catalog-6637-postgres.txt
          if-no-files-found: warn
          retention-days: 30

name: Apply Value V5 test compatibility patch

on:
  pull_request:
    paths:
      - '.github/workflows/value-v5-test-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/add-recommendation-value-v5-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          training = Path('apps/api/test/recommendation-value-v5-training.spec.ts')
          text = training.read_text()
          old = """import {\n  RECOMMENDATION_VALUE_V5_MODEL_VERSION,\n  RecommendationValueV5TrainingService,\n  prepareRecommendationValueV5Row,\n} from '../src/deadlock-live/recommendation-value-v5-training.service';\n"""
          new = """import {\n  RecommendationValueV5TrainingService,\n  prepareRecommendationValueV5Row,\n} from '../src/deadlock-live/recommendation-value-v5-training.service';\nimport {\n  RECOMMENDATION_VALUE_V5_MODEL_VERSION,\n} from '../src/deadlock-live/recommendation-value-v5-model';\n"""
          if old not in text:
              raise SystemExit('Value V5 training test import block was not found')
          training.write_text(text.replace(old, new, 1))

          core = Path('apps/api/test/recommendation-value-v5-core.spec.ts')
          text = core.read_text()
          old = "expect(split.test.at(-1)?.matchId).toBe('1');"
          new = "expect(split.test[split.test.length - 1]?.matchId).toBe('1');"
          if old not in text:
              raise SystemExit('Value V5 Array.at assertion was not found')
          core.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/test/recommendation-value-v5-core.spec.ts apps/api/test/recommendation-value-v5-training.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test: fix value v5 compatibility'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

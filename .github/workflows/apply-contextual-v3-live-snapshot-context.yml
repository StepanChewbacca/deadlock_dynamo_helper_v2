name: Apply Contextual V3 live snapshot context

on:
  push:
    branches:
      - agent/contextual-v3-model-only-test
    paths:
      - .github/workflows/apply-contextual-v3-live-snapshot-context.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contextual-v3-model-only-test
          fetch-depth: 0

      - name: Apply live context exposure
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              file_path.write_text(text.replace(old, new, 1))

          traversal = 'apps/api/src/deadlock-live/live-build-recommendation-traversal.service.ts'
          replace_once(
              traversal,
              """  itemIds: number[];\n  enemyHeroIds: number[];\n  inventoryStateKey?: string;""",
              """  itemIds: number[];\n  alliedHeroIds: number[];\n  enemyHeroIds: number[];\n  previousActionKeys: string[];\n  inventoryStateKey?: string;""",
          )
          replace_once(
              traversal,
              """      itemIds: [...input.itemIds],\n      enemyHeroIds: [...input.enemyHeroIds],\n      inventoryStateKey: input.inventoryStateKey,""",
              """      itemIds: [...input.itemIds],\n      alliedHeroIds: [...input.alliedHeroIds],\n      enemyHeroIds: [...input.enemyHeroIds],\n      previousActionKeys: [...input.previousActionKeys],\n      inventoryStateKey: input.inventoryStateKey,""",
          )
          replace_once(
              traversal,
              """        itemIds: [],\n        enemyHeroIds: [],\n        isStale: false,""",
              """        itemIds: [],\n        alliedHeroIds: [],\n        enemyHeroIds: [],\n        previousActionKeys: [],\n        isStale: false,""",
          )
          replace_once(
              traversal,
              """      itemIds: [],\n      enemyHeroIds: [],\n      isStale: false,""",
              """      itemIds: [],\n      alliedHeroIds: [],\n      enemyHeroIds: [],\n      previousActionKeys: [],\n      isStale: false,""",
          )
          replace_once(
              traversal,
              """          itemIds: [...input.itemIds],\n          enemyHeroIds: [...input.enemyHeroIds],\n          inventoryStateKey: input.inventoryStateKey,""",
              """          itemIds: [...input.itemIds],\n          alliedHeroIds: [...input.alliedHeroIds],\n          enemyHeroIds: [...input.enemyHeroIds],\n          previousActionKeys: [...input.previousActionKeys],\n          inventoryStateKey: input.inventoryStateKey,""",
          )
          replace_once(
              traversal,
              """    itemIds: [...snapshot.itemIds],\n    enemyHeroIds: [...snapshot.enemyHeroIds],""",
              """    itemIds: [...snapshot.itemIds],\n    alliedHeroIds: [...snapshot.alliedHeroIds],\n    enemyHeroIds: [...snapshot.enemyHeroIds],\n    previousActionKeys: [...snapshot.previousActionKeys],""",
          )

          poller = 'apps/overwolf-client/src/live-build-recommendation-poller.ts'
          replace_once(
              poller,
              """  itemIds: number[];\n  enemyHeroIds?: number[];\n  inventoryStateKey?: string;""",
              """  itemIds: number[];\n  alliedHeroIds?: number[];\n  enemyHeroIds?: number[];\n  previousActionKeys?: string[];\n  inventoryStateKey?: string;""",
          )
          replace_once(
              poller,
              """    enemyHeroIds:\n      next.enemyHeroIds && next.enemyHeroIds.length > 0\n        ? [...next.enemyHeroIds]\n        : [...(previous.enemyHeroIds ?? [])],\n    inventoryStateKey:""",
              """    alliedHeroIds:\n      next.alliedHeroIds && next.alliedHeroIds.length > 0\n        ? [...next.alliedHeroIds]\n        : [...(previous.alliedHeroIds ?? [])],\n    enemyHeroIds:\n      next.enemyHeroIds && next.enemyHeroIds.length > 0\n        ? [...next.enemyHeroIds]\n        : [...(previous.enemyHeroIds ?? [])],\n    previousActionKeys:\n      next.previousActionKeys && next.previousActionKeys.length > 0\n        ? [...next.previousActionKeys]\n        : [...(previous.previousActionKeys ?? [])],\n    inventoryStateKey:""",
          )
          replace_once(
              poller,
              """    itemIds: [],\n    enemyHeroIds: [],\n    isStale: false,""",
              """    itemIds: [],\n    alliedHeroIds: [],\n    enemyHeroIds: [],\n    previousActionKeys: [],\n    isStale: false,""",
          )

          entry = 'apps/overwolf-client/src/live-build-hud-entry.ts'
          replace_once(
              entry,
              """    itemIds: [],\n    enemyHeroIds: [],\n    isStale: false,""",
              """    itemIds: [],\n    alliedHeroIds: [],\n    enemyHeroIds: [],\n    previousActionKeys: [],\n    isStale: false,""",
          )

          table_ui = 'apps/overwolf-client/src/live-build-desktop-table-ui.ts'
          replace_once(
              table_ui,
              """  const enemyHeroIds = [...(snapshot.enemyHeroIds ?? [])];\n  const previousActionKeys: string[] = [];""",
              """  const alliedHeroIds = [...(snapshot.alliedHeroIds ?? [])];\n  const enemyHeroIds = [...(snapshot.enemyHeroIds ?? [])];\n  const previousActionKeys = [...(snapshot.previousActionKeys ?? [])];""",
          )
          replace_once(
              table_ui,
              """          gameTimeS,\n          enemyHeroIds,\n          previousActionKeys,""",
              """          gameTimeS,\n          alliedHeroIds,\n          enemyHeroIds,\n          previousActionKeys,""",
          )

          traversal_spec = 'apps/api/test/live-build-recommendation-traversal.spec.ts'
          replace_once(
              traversal_spec,
              """      state: 'READY',\n      enemyHeroIds: [13],\n      inventoryStateKey: '100x1',""",
              """      state: 'READY',\n      alliedHeroIds: [],\n      enemyHeroIds: [13],\n      previousActionKeys: [],\n      inventoryStateKey: '100x1',""",
          )

          Path('.github/workflows/apply-contextual-v3-live-snapshot-context.yml').unlink()
          PY

      - name: Validate generated diff
        run: git diff --check

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/deadlock-live/live-build-recommendation-traversal.service.ts \
            apps/api/test/live-build-recommendation-traversal.spec.ts \
            apps/overwolf-client/src/live-build-recommendation-poller.ts \
            apps/overwolf-client/src/live-build-hud-entry.ts \
            apps/overwolf-client/src/live-build-desktop-table-ui.ts \
            .github/workflows/apply-contextual-v3-live-snapshot-context.yml
          git commit -m "fix: preserve model context across rollout"
          git push origin HEAD:agent/contextual-v3-model-only-test

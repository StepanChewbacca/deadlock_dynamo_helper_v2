name: Inspect Recommendation V6 database history

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/inspect-recommendation-v6-database-history.yml

permissions:
  contents: read

jobs:
  inspect-database-history:
    if: github.event.pull_request.head.ref == 'diagnostics/run-recommendation-v6-cycle-20260726'
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Inspect PostgreSQL historical match payloads
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT="$GITHUB_WORKSPACE/recommendation-v6-database-history.json"
          DEPLOY_REPOSITORY=/home/ubuntu/apps/deadlock_dynamo_helper
          cd "$DEPLOY_REPOSITORY"

          sudo docker compose exec -T api node - > "$REPORT" <<'NODE'
          const { Client } = require('pg');
          const { createReadStream } = require('node:fs');
          const { createGunzip } = require('node:zlib');
          const { createInterface } = require('node:readline');

          const DATASET_PATH = '/app/apps/api/storage/recommendation-decision-dataset-v5-full-crawler-20260726/dataset.ndjson.gz';
          const MAX_PAYLOADS = 1000;
          const MAX_ARRAY_ITEMS = 64;
          const RELEVANT = /(time|tick|minute|second|duration|net.?worth|soul|kill|death|assist|objective|damage|snapshot|interval|player|stat|book|team|item|purchase|gold|currency)/i;

          function scalarSample(value) {
            if (typeof value === 'string') return value.length > 120 ? `${value.slice(0, 117)}...` : value;
            if (typeof value === 'number' || typeof value === 'boolean' || value === null) return value;
            return undefined;
          }

          function valueType(value) {
            if (value === null) return 'null';
            if (Array.isArray(value)) return 'array';
            return typeof value;
          }

          async function datasetMatchIds() {
            const ids = new Set();
            let rowCount = 0;
            const input = createReadStream(DATASET_PATH).pipe(createGunzip());
            const lines = createInterface({ input, crlfDelay: Infinity });
            for await (const line of lines) {
              if (!line.trim()) continue;
              const row = JSON.parse(line);
              const matchId = String(row?.identity?.matchId ?? '');
              if (matchId) ids.add(matchId);
              rowCount += 1;
            }
            return { rowCount, ids: [...ids] };
          }

          function collectPaths(root, accumulator) {
            const stack = [{ value: root, path: '$', depth: 0 }];
            while (stack.length > 0) {
              const { value, path, depth } = stack.pop();
              const type = valueType(value);
              const key = `${path} <${type}>`;
              const entry = accumulator.get(key) ?? { path, type, count: 0, samples: [] };
              entry.count += 1;
              const sample = scalarSample(value);
              if (sample !== undefined && entry.samples.length < 3 && !entry.samples.some((item) => JSON.stringify(item) === JSON.stringify(sample))) {
                entry.samples.push(sample);
              }
              accumulator.set(key, entry);
              if (depth >= 12) continue;
              if (Array.isArray(value)) {
                for (let index = Math.min(value.length, MAX_ARRAY_ITEMS) - 1; index >= 0; index -= 1) {
                  stack.push({ value: value[index], path: `${path}[]`, depth: depth + 1 });
                }
              } else if (value && typeof value === 'object') {
                for (const [childKey, childValue] of Object.entries(value)) {
                  stack.push({ value: childValue, path: `${path}.${childKey}`, depth: depth + 1 });
                }
              }
            }
          }

          async function main() {
            const dataset = await datasetMatchIds();
            const client = new Client({
              host: process.env.DB_HOST,
              port: Number(process.env.DB_PORT || 5432),
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME,
            });
            await client.connect();
            try {
              const tableCounts = {};
              for (const table of ['matches', 'match_players', 'match_player_items', 'match_player_skill_upgrades', 'raw_match_metadata']) {
                const result = await client.query(`SELECT COUNT(*)::bigint AS count FROM ${table}`);
                tableCounts[table] = Number(result.rows[0].count);
              }

              const ids = dataset.ids;
              const [matchCoverage, playerCoverage, itemCoverage, rawCoverage, sources, topLevelKeys, payloadRows] = await Promise.all([
                client.query('SELECT COUNT(DISTINCT "matchId")::int AS count FROM matches WHERE "matchId" = ANY($1::bigint[])', [ids]),
                client.query('SELECT COUNT(DISTINCT "matchId")::int AS count, COUNT(*)::int AS rows FROM match_players WHERE "matchId" = ANY($1::bigint[])', [ids]),
                client.query('SELECT COUNT(*)::int AS rows FROM match_player_items mpi JOIN match_players mp ON mp.id = mpi."matchPlayerId" WHERE mp."matchId" = ANY($1::bigint[])', [ids]),
                client.query('SELECT COUNT(DISTINCT "matchId")::int AS count, COUNT(*)::int AS rows FROM raw_match_metadata WHERE "matchId" = ANY($1::bigint[])', [ids]),
                client.query('SELECT source, COUNT(*)::int AS rows, COUNT(DISTINCT "matchId")::int AS matches FROM raw_match_metadata WHERE "matchId" = ANY($1::bigint[]) GROUP BY source ORDER BY rows DESC', [ids]),
                client.query('SELECT key, COUNT(*)::int AS rows FROM raw_match_metadata r CROSS JOIN LATERAL jsonb_object_keys(r.payload) AS key WHERE r."matchId" = ANY($1::bigint[]) GROUP BY key ORDER BY rows DESC, key', [ids]),
                client.query('SELECT id, "matchId"::text AS "matchId", source, payload FROM raw_match_metadata WHERE "matchId" = ANY($1::bigint[]) ORDER BY id DESC LIMIT $2', [ids, MAX_PAYLOADS]),
              ]);

              const paths = new Map();
              for (const row of payloadRows.rows) collectPaths(row.payload, paths);
              const relevantPaths = [...paths.values()]
                .filter((entry) => RELEVANT.test(entry.path))
                .sort((a, b) => b.count - a.count || a.path.localeCompare(b.path))
                .slice(0, 1000);

              const likelyTimeSeriesPaths = relevantPaths.filter((entry) =>
                entry.type === 'array' || /stats.?book|snapshot|interval|timeline|history|time.?series|net.?worth|souls|kills|deaths|assists/i.test(entry.path),
              );

              const result = {
                generatedAt: new Date().toISOString(),
                dataset: {
                  path: DATASET_PATH,
                  rowCount: dataset.rowCount,
                  uniqueMatchCount: ids.length,
                },
                database: {
                  tableCounts,
                  datasetMatchCoverage: {
                    matches: Number(matchCoverage.rows[0].count),
                    matchPlayersMatches: Number(playerCoverage.rows[0].count),
                    matchPlayerRows: Number(playerCoverage.rows[0].rows),
                    matchPlayerItemRows: Number(itemCoverage.rows[0].rows),
                    rawMetadataMatches: Number(rawCoverage.rows[0].count),
                    rawMetadataRows: Number(rawCoverage.rows[0].rows),
                  },
                  rawMetadataSources: sources.rows,
                  topLevelPayloadKeys: topLevelKeys.rows,
                  sampledPayloadCount: payloadRows.rows.length,
                  sampledMatchIds: [...new Set(payloadRows.rows.map((row) => row.matchId))].slice(0, 50),
                  relevantPayloadPaths: relevantPaths,
                  likelyTimeSeriesPaths,
                },
              };
              process.stdout.write(`${JSON.stringify(result, null, 2)}\n`);
            } finally {
              await client.end();
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          test -s "$REPORT"
          cat "$REPORT"

      - name: Upload database history report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v6-database-history-${{ github.sha }}
          path: recommendation-v6-database-history.json
          if-no-files-found: warn
          retention-days: 14

name: Tune recommendation Value V4

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tune-recommendation-value-v4.yml
      - scripts/tune-recommendation-value-v4.mjs

permissions:
  contents: read

jobs:
  tune:
    if: github.event.pull_request.head.ref == 'diagnostics/tune-recommendation-value-v4-20260724'
    runs-on: self-hosted
    timeout-minutes: 360
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Run Value V4 tuning
        run: node scripts/tune-recommendation-value-v4.mjs

      - name: Restore production API configuration
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          deploy_repo=/home/ubuntu/apps/deadlock_dynamo_helper
          cd "$deploy_repo"
          sudo docker compose up -d --force-recreate --no-deps api
          rm -f /tmp/recommendation-value-v4-tuning.override.yml
          for attempt in $(seq 1 180); do
            if curl --max-time 10 --fail --silent http://127.0.0.1:3000/deadlock/analysis/recommendation-telemetry/status >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Upload Value V4 tuning results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-value-v4-tuning-${{ github.sha }}
          path: value-v4-tuning-results
          if-no-files-found: warn
          retention-days: 14

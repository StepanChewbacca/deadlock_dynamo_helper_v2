name: Patch Value V5 serialization

on:
  pull_request:
    paths:
      - '.github/workflows/patch-value-v5-serialization.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-value-v5-serialization
          fetch-depth: 0
      - name: Apply serialization pruning patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          model_path = Path('apps/api/src/deadlock-live/recommendation-value-v5-model.ts')
          model = model_path.read_text()
          model = model.replace(
              'export function serializeRecommendationValueV5Model(\n  model: RecommendationValueV5Model,\n): Record<string, unknown> {\n',
              'export function serializeRecommendationValueV5Model(\n  model: RecommendationValueV5Model,\n  minimumEffectiveObservations = 0,\n): Record<string, unknown> {\n',
          )
          model = model.replace(
              '    state: serializeTable(model.state),\n    action: serializeTable(model.action),\n',
              '    state: serializeTable(model.state, minimumEffectiveObservations),\n    action: serializeTable(model.action, minimumEffectiveObservations),\n',
          )
          model = model.replace(
              'function serializeTable(\n  table: ReadonlyMap<string, RecommendationValueV5WeightedBinaryCount>,\n): Record<string, RecommendationValueV5WeightedBinaryCount> {\n  return Object.fromEntries(\n    [...table.entries()]\n      .sort(([left], [right]) => left.localeCompare(right))\n',
              'function serializeTable(\n  table: ReadonlyMap<string, RecommendationValueV5WeightedBinaryCount>,\n  minimumEffectiveObservations: number,\n): Record<string, RecommendationValueV5WeightedBinaryCount> {\n  return Object.fromEntries(\n    [...table.entries()]\n      .filter(([, count]) => count.total >= minimumEffectiveObservations)\n      .sort(([left], [right]) => left.localeCompare(right))\n',
          )
          model_path.write_text(model)

          training_path = Path('apps/api/src/deadlock-live/recommendation-value-v5-training.service.ts')
          training = training_path.read_text()
          training = training.replace(
              '        counts: serializeRecommendationValueV5Model(model),\n',
              '        counts: serializeRecommendationValueV5Model(\n          model,\n          options.minimumEffectiveObservations,\n        ),\n',
          )
          training_path.write_text(training)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/deadlock-live/recommendation-value-v5-model.ts apps/api/src/deadlock-live/recommendation-value-v5-training.service.ts
          git commit -m 'fix: prune unsupported Value V5 contexts before serialization'
          git push origin HEAD:agent/fix-value-v5-serialization

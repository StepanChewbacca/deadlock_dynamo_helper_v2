name: Recommendation V8 Replay Recovery Resume V3

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-v8-replay-recovery-resume-v3.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recommendation-v8-vps-training
  cancel-in-progress: false

jobs:
  request-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.request.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - id: request
        shell: bash
        run: |
          set -euo pipefail
          request='.github/training-requests/recommendation-v8-replay-recovery-resume-v3.json'
          state="$(jq -r '.state // empty' "$request")"
          if [ "$state" = 'CONSUMED' ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$state" = 'REQUESTED'
          test "$(jq -r '.operation' "$request")" = 'REPLAY_RECOVERY_RESUME_V3'
          test "$(jq -r '.sourceDatasetSha256' "$request")" = 'ff04970fda519ca5ebbfa49991af05ef99b99038d3f9f39f64fc9b0d07018fad'
          test "$(jq -r '.failedReplaySha256' "$request")" = 'cf9e0bda5fb3308a468f4ce3bc9fe0d6c87083f5e73f2e2ab31d405da590862b'
          test "$(jq -r '.productionRankingChanged' "$request")" = 'false'
          test "$(jq -r '.passiveShadowActivated' "$request")" = 'false'
          test "$(jq -r '.randomizedCanaryAuthorized' "$request")" = 'false'
          echo 'run=true' >> "$GITHUB_OUTPUT"

  resume:
    needs: request-gate
    if: needs.request-gate.outputs.run == 'true'
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Resolve verified recovery inputs
        shell: bash
        run: |
          set -euo pipefail
          run_root='/home/ubuntu/apps/deadlock_dynamo_helper-training'
          old_run_dir="$(readlink -f "$run_root/current")"
          storage_volume='deadlock_dynamo_helper_deadlock-storage'
          storage_source='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          network='aboba-telegramovich_default'
          archive_root="$storage_source/recommendation-v8-failed-artifacts/cf9e0bda5fb3-30634050634"
          sudo docker volume inspect "$storage_volume" >/dev/null
          sudo docker network inspect "$network" >/dev/null
          test -s "$old_run_dir/resolved-training-config.json"
          sudo test -s "$archive_root/recommendation-historical-pro-replay-v1/manifest.json"
          sudo test -s "$storage_source/build-decision-dataset-v3/dataset.ndjson"
          sudo test -s "$storage_source/build-decision-dataset-v3/manifest.json"
          sudo test -s "$storage_source/recommendation-candidate-generator-snapshots/registry.json"
          archived_sha="$(sudo cat "$archive_root/recommendation-historical-pro-replay-v1/manifest.json" | jq -r '.artifact.sha256')"
          source_sha="$(sudo cat "$storage_source/build-decision-dataset-v3/manifest.json" | jq -r '.artifact.sha256')"
          source_rows="$(sudo cat "$storage_source/build-decision-dataset-v3/manifest.json" | jq -r '.artifact.rowCount')"
          test "$archived_sha" = 'cf9e0bda5fb3308a468f4ce3bc9fe0d6c87083f5e73f2e2ab31d405da590862b'
          test "$source_sha" = 'ff04970fda519ca5ebbfa49991af05ef99b99038d3f9f39f64fc9b0d07018fad'
          test "$source_rows" = '6188423'
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-replay-resume-v3"
          run_dir="$run_root/runs/$run_id"
          sudo mkdir -p "$run_dir"
          sudo chown -R "$(id -u):$(id -g)" "$run_root"
          cp "$old_run_dir/resolved-training-config.json" "$run_dir/"
          cp scripts/run-recommendation-v8-replay-audit-recovery-v2.mjs "$run_dir/"
          {
            printf 'Archive: %s\n' "$archive_root"
            printf 'Archived replay SHA: %s\n' "$archived_sha"
            printf 'Dataset V3: %s rows, SHA %s\n' "$source_rows" "$source_sha"
            printf 'Network: %s\n' "$network"
            printf 'Storage volume: %s\n' "$storage_volume"
          } | tee "$run_dir/recovery-inputs.txt"
          echo "TRAINING_RUN_ROOT=$run_root" >> "$GITHUB_ENV"
          echo "TRAINING_RUN_DIR=$run_dir" >> "$GITHUB_ENV"
          echo "TRAINING_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo 'TRAINING_CONTAINER=deadlock-recommendation-v8-training' >> "$GITHUB_ENV"
          echo "STORAGE_VOLUME=$storage_volume" >> "$GITHUB_ENV"
          echo "TRAINING_NETWORK=$network" >> "$GITHUB_ENV"

      - name: Build isolated recovery image
        shell: bash
        run: |
          set -euo pipefail
          image="deadlock-recommendation-v8-training:${GITHUB_SHA}-resume-v3"
          sudo docker build -t "$image" .
          echo "TRAINING_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Replace only isolated training API
        shell: bash
        run: |
          set -euo pipefail
          deploy_dir='/home/ubuntu/apps/deadlock_dynamo_helper'
          sudo docker rm -f "$TRAINING_CONTAINER" >/dev/null 2>&1 || true
          sudo docker run -d --name "$TRAINING_CONTAINER" --restart=no --network "$TRAINING_NETWORK" -p 127.0.0.1:3010:3000 --env-file "$deploy_dir/.env" -e DB_HOST=aboba-telegramovich-postgres-1 -e DB_PORT=5432 -e DB_USER=postgres -e DB_NAME=deadlock_builds -e DEADLOCK_TIMELINE_COLLECTOR_ENABLED=false -e DEADLOCK_CONTEXTUAL_SHADOW_ENABLED=false -e DEADLOCK_CONTEXTUAL_V3_LIVE_MODE=DISABLED -e DEADLOCK_RECOMMENDATION_VALUE_V6_LIVE_MODE=DISABLED -e DEADLOCK_RECOMMENDATION_VALUE_V8_SHADOW_ENABLED=false -e NODE_OPTIONS=--max-old-space-size=8192 --mount "type=volume,src=$STORAGE_VOLUME,dst=/app/apps/api/storage" --mount "type=bind,src=$TRAINING_RUN_DIR,dst=/runner" "$TRAINING_IMAGE"
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3010/deadlock/analysis/build-decision-dataset-v3/status >/dev/null; then
              exit 0
            fi
            if [ "$(sudo docker inspect --format='{{.State.Running}}' "$TRAINING_CONTAINER")" != 'true' ]; then
              sudo docker logs --tail=300 "$TRAINING_CONTAINER"
              exit 1
            fi
            sleep 2
          done
          sudo docker logs --tail=300 "$TRAINING_CONTAINER"
          exit 1

      - name: Verify immutable inputs through isolated API
        shell: bash
        run: |
          set -euo pipefail
          source_manifest="$(curl --fail --silent http://127.0.0.1:3010/deadlock/analysis/build-decision-dataset-v3/manifest)"
          registry="$(curl --fail --silent http://127.0.0.1:3010/deadlock/analysis/recommendation-candidate-generator-snapshots/registry)"
          test "$(echo "$source_manifest" | jq -r '.artifact.sha256')" = 'ff04970fda519ca5ebbfa49991af05ef99b99038d3f9f39f64fc9b0d07018fad'
          test "$(echo "$source_manifest" | jq -r '.artifact.rowCount')" = '6188423'
          test "$(echo "$registry" | jq -r '[.snapshots[] | select(.snapshotId == "v8-20260722-c1-ff04970fda51")] | length')" = '1'

      - name: Start detached gated recovery supervisor
        shell: bash
        run: |
          set -euo pipefail
          : > "$TRAINING_RUN_DIR/training.log"
          ln -sfn "$TRAINING_RUN_DIR" "$TRAINING_RUN_ROOT/current"
          sudo docker exec -d -e API_BASE_URL=http://127.0.0.1:3000 -e TRAINING_RUN_ID="$TRAINING_RUN_ID" -e TRAINING_LOG_PATH=/runner/training.log -e TRAINING_STATUS_PATH=/runner/status.json -e TRAINING_RESOLVED_CONFIG_PATH=/runner/resolved-training-config.json -e REPLAY_PARTITION_COUNT=64 -e REPLAY_SNAPSHOT_STALENESS_S=300 -e DATASET_DECISION_SNAPSHOT_STALENESS_S=300 -e DIAGNOSTIC_MAX_ROWS=10000 -e PIPELINE_POLL_INTERVAL_MS=15000 -e PIPELINE_TIMEOUT_MS=604800000 "$TRAINING_CONTAINER" node /runner/run-recommendation-v8-replay-audit-recovery-v2.mjs
          for attempt in $(seq 1 60); do
            if [ -s "$TRAINING_RUN_DIR/status.json" ] && sudo docker exec "$TRAINING_CONTAINER" sh -lc "pgrep -f 'run-recommendation-v8-replay-audit-recovery-v2.mjs' >/dev/null"; then
              cat "$TRAINING_RUN_DIR/status.json"
              exit 0
            fi
            sleep 1
          done
          sudo docker logs --tail=300 "$TRAINING_CONTAINER"
          tail -n 300 "$TRAINING_RUN_DIR/training.log" || true
          exit 1

      - name: Consume resume and superseded requests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          resume_path = Path('.github/training-requests/recommendation-v8-replay-recovery-resume-v3.json')
          resume = json.loads(resume_path.read_text())
          resume['state'] = 'CONSUMED'
          resume['consumedAt'] = now
          resume['deployedCommit'] = '${{ github.sha }}'
          resume_path.write_text(json.dumps(resume, indent=2) + '\n')

          old_path = Path('.github/training-requests/recommendation-v8-replay-audit-recovery-v2.json')
          old = json.loads(old_path.read_text())
          old['state'] = 'CONSUMED'
          old['consumedAt'] = now
          old['supersededBy'] = 'REPLAY_RECOVERY_RESUME_V3'
          old_path.write_text(json.dumps(old, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/training-requests/recommendation-v8-replay-recovery-resume-v3.json .github/training-requests/recommendation-v8-replay-audit-recovery-v2.json
          git commit -m 'chore: consume Recommendation V8 recovery requests'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Upload launch metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v8-replay-recovery-resume-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TRAINING_RUN_DIR }}/recovery-inputs.txt
            ${{ env.TRAINING_RUN_DIR }}/resolved-training-config.json
            ${{ env.TRAINING_RUN_DIR }}/status.json
            ${{ env.TRAINING_RUN_DIR }}/training.log
          if-no-files-found: warn
          retention-days: 30

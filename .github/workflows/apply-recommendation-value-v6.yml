name: Apply Recommendation Value V6 implementation

on:
  push:
    branches:
      - agent/recommendation-value-v6
    paths:
      - .github/workflows/apply-recommendation-value-v6.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Value V6 branch
        uses: actions/checkout@v4
        with:
          ref: agent/recommendation-value-v6
          fetch-depth: 0

      - name: Merge current main
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Reconstruct and apply Value V6 patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/value-v6-patch/part-* | base64 --decode > "$RUNNER_TEMP/value-v6-patch.tar.gz"
          echo "f5475699cc8f5c5a36241d7b3ddbeea59122c51323bfb48e0f89a06f4a1abdd6  $RUNNER_TEMP/value-v6-patch.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/value-v6-patch.tar.gz" -C "$GITHUB_WORKSPACE"
          rm -rf .github/value-v6-patch
          rm -f .github/workflows/apply-recommendation-value-v6.yml

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile

      - name: Build API
        shell: bash
        run: |
          set -o pipefail
          yarn workspace @deadlock-live-probe/api build 2>&1 | tee "$RUNNER_TEMP/value-v6-build.log"

      - name: Test Recommendation Value V6
        shell: bash
        run: |
          set -o pipefail
          yarn workspace @deadlock-live-probe/api test recommendation-value-v6-core.spec.ts recommendation-value-v6-training.spec.ts 2>&1 | tee "$RUNNER_TEMP/value-v6-test.log"

      - name: Upload Value V6 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-value-v6-diagnostics
          path: ${{ runner.temp }}/value-v6-*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Commit verified implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git commit -m "feat: complete Recommendation Value V6 training"
          git push origin HEAD:agent/recommendation-value-v6

name: Recommendation V8 Status Snapshot

on:
  push:
    paths:
      - '.github/workflows/recommendation-v8-status-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  snapshot:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Capture training snapshot
        shell: bash
        run: |
          set -u -o pipefail
          run_root='/home/ubuntu/apps/deadlock_dynamo_helper-training'
          current="$run_root/current"
          container='deadlock-recommendation-v8-training'
          report="$RUNNER_TEMP/recommendation-v8-status.md"
          {
            echo '# Recommendation V8 training snapshot'
            echo
            echo "Generated: $(date --iso-8601=seconds)"
            echo
            echo '## Overall status'
            echo '```json'
            cat "$current/status.json" 2>/dev/null || echo '{"error":"status.json missing"}'
            echo '```'
            echo
            echo '## Container'
            echo '```text'
            sudo docker ps -a --filter name="$container" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
            echo '```'
            echo
            echo '## Historical catalog coverage'
            echo '```json'
            sudo docker exec "$container" node -e 'const {Client}=require("pg"); (async()=>{const c=new Client({host:process.env.DB_HOST,port:Number(process.env.DB_PORT||5432),user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME});await c.connect();const r=await c.query(`SELECT id, "clientVersion", "contentCatalogVersionId", "importedAt", "isCurrent" FROM item_catalog_versions ORDER BY "importedAt" ASC, id ASC`);console.log(JSON.stringify({count:r.rowCount,rows:r.rows},null,2));await c.end()})().catch((error)=>{console.error(error);process.exit(1)})' 2>&1 || true
            echo '```'
            echo
            echo '## Stage endpoints'
            for endpoint in \
              build-decision-dataset-v3/status \
              recommendation-historical-pro-replay/status \
              recommendation-pro-decision-dataset-v6/status \
              recommendation-behavioral-v5-training/status \
              recommendation-value-v8-diagnostic/status \
              recommendation-value-v8-full-evaluation/status; do
              echo
              echo "### $endpoint"
              echo '```json'
              curl --silent --max-time 20 "http://127.0.0.1:3010/deadlock/analysis/$endpoint" 2>/dev/null || echo '{"error":"endpoint unavailable"}'
              echo
              echo '```'
            done
            echo
            echo '## Recent training log'
            echo '```text'
            tail -n 120 "$current/training.log" 2>/dev/null || echo 'training.log missing'
            echo '```'
            echo
            echo '## Resources'
            echo '```text'
            df -hT /
            free -h
            echo '```'
          } > "$report"
          echo "SNAPSHOT_REPORT=$report" >> "$GITHUB_ENV"

      - name: Publish snapshot issue
        uses: actions/github-script@v7
        env:
          SNAPSHOT_REPORT: ${{ env.SNAPSHOT_REPORT }}
        with:
          script: |
            const fs = require('fs');
            const title = '[status] Recommendation V8 training snapshot';
            const body = fs.readFileSync(process.env.SNAPSHOT_REPORT, 'utf8');
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = data.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                state: 'open',
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

# Snapshot trigger: hourly monitor verification 2026-07-28T16:53Z

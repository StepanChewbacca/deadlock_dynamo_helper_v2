name: Recommendation V8 Snapshot OOM Fix V1

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-v8-snapshot-oom-fix-v1.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recommendation-v8-snapshot-oom-fix-v1
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          request='.github/training-requests/recommendation-v8-snapshot-oom-fix-v1.json'
          test "$(jq -r '.state' "$request")" = 'REQUESTED'
          test "$(jq -r '.operation' "$request")" = 'FIX_RECOMMENDATION_V8_SNAPSHOT_OOM_V1'
          test "$(jq -r '.productionRankingChanged' "$request")" = 'false'
          test "$(jq -r '.passiveShadowActivated' "$request")" = 'false'
          test "$(jq -r '.randomizedCanaryAuthorized' "$request")" = 'false'

      - name: Apply memory fix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-recommendation-v8-snapshot-oom-v1.py
          git diff --check

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build project
        run: yarn build

      - name: Run targeted tests
        run: yarn workspace api test --runInBand recommendation-candidate-generator-snapshot-memory.spec.ts recommendation-historical-pro-replay-artifact.spec.ts recommendation-historical-replay-audit-recovery-v2.spec.ts

      - name: Commit validated source fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('.github/training-requests/recommendation-v8-snapshot-oom-fix-v1.json')
          value = json.loads(path.read_text())
          value['state'] = 'CONSUMED'
          value['consumedAt'] = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          path.write_text(json.dumps(value, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/deadlock-live/recommendation-candidate-generator-policy-accumulator.ts apps/api/src/deadlock-live/recommendation-candidate-generator-snapshot.ts apps/api/src/deadlock-live/recommendation-candidate-generator-snapshot-export.service.ts apps/api/test/recommendation-candidate-generator-snapshot-memory.spec.ts .github/training-requests/recommendation-v8-snapshot-oom-fix-v1.json
          git commit -m 'fix: bound candidate snapshot export memory'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

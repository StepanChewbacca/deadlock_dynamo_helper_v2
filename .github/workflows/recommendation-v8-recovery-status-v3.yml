name: Recommendation V8 Recovery Status V3

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-v8-recovery-status-v3.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recommendation-v8-recovery-status-v3
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout status request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Inspect isolated recovery
        shell: bash
        run: |
          set -euo pipefail
          run_root='/home/ubuntu/apps/deadlock_dynamo_helper-training'
          run_dir="$(readlink -f "$run_root/current")"
          container='deadlock-recommendation-v8-training'
          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          report="$RUNNER_TEMP/recommendation-v8-recovery-status.txt"
          test -d "$run_dir"
          {
            echo "generatedAt=$(date --iso-8601=seconds)"
            echo "runDir=$run_dir"
            echo
            echo '=== supervisor status ==='
            cat "$run_dir/status.json" 2>/dev/null || true
            echo
            echo '=== isolated container and processes ==='
            sudo docker ps -a --filter "name=^/${container}$" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
            sudo docker inspect --format='running={{.State.Running}} status={{.State.Status}} exitCode={{.State.ExitCode}} startedAt={{.State.StartedAt}}' "$container" 2>/dev/null || true
            sudo docker exec "$container" sh -lc "ps -eo pid,etime,rss,args | grep -E 'recommendation-v8|node /runner' | grep -v grep || true" 2>/dev/null || true
            echo
            echo '=== active artifact files ==='
            sudo find "$storage/recommendation-candidate-generator-snapshots" "$storage/recommendation-historical-pro-replay-v1" -maxdepth 2 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TS %s %p\n' 2>/dev/null | sort | tail -n 40 || true
            echo
            echo '=== active artifact sizes ==='
            sudo du -sh "$storage/recommendation-candidate-generator-snapshots" "$storage/recommendation-historical-pro-replay-v1" 2>/dev/null || true
            echo
            echo '=== current API stage ==='
            curl --silent --show-error --max-time 10 http://127.0.0.1:3010/deadlock/analysis/recommendation-candidate-generator-snapshots/status || true
            echo
            curl --silent --show-error --max-time 10 http://127.0.0.1:3010/deadlock/analysis/recommendation-historical-pro-replay/status || true
            echo
            echo '=== training log tail ==='
            tail -n 120 "$run_dir/training.log" 2>/dev/null || true
            echo
            echo '=== recent container warnings/errors ==='
            sudo docker logs --since=10m "$container" 2>&1 | grep -E 'ERROR|WARN|completed|failed|processed|exported|cache' | tail -n 120 || true
          } | tee "$report"

      - name: Upload status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v8-recovery-status-${{ github.run_id }}
          path: ${{ runner.temp }}/recommendation-v8-recovery-status.txt
          if-no-files-found: warn
          retention-days: 7

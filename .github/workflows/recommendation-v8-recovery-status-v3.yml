name: Recommendation V8 Recovery Status V3

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-v8-recovery-status-v3.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recommendation-v8-recovery-status-v3
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout status request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Repair bounded diagnostic start
        shell: bash
        run: |
          set -euo pipefail
          request='.github/training-requests/recommendation-v8-recovery-status-v3.json'
          operation="$(jq -r '.operation // empty' "$request")"
          if [ "$operation" != 'RECOVER_RECOMMENDATION_V8_DIAGNOSTIC_START' ]; then
            exit 0
          fi

          container='deadlock-recommendation-v8-training'
          run_root='/home/ubuntu/apps/deadlock_dynamo_helper-training-5000'
          run_dir="$(readlink -f "$run_root/current")"
          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          replay="$storage/recommendation-historical-pro-replay-terminal-5000-v2"

          replay_status="$(curl --fail --silent --max-time 30 http://127.0.0.1:3010/deadlock/analysis/recommendation-historical-pro-replay/status)"
          replay_audit="$(curl --fail --silent --max-time 30 http://127.0.0.1:3010/deadlock/analysis/recommendation-historical-pro-replay/audit)"
          dataset_status="$(curl --fail --silent --max-time 30 http://127.0.0.1:3010/deadlock/analysis/recommendation-pro-decision-dataset-v6/status)"
          behavioral_status="$(curl --fail --silent --max-time 30 http://127.0.0.1:3010/deadlock/analysis/recommendation-behavioral-v5-training/status)"
          behavioral_audit="$(curl --fail --silent --max-time 30 http://127.0.0.1:3010/deadlock/analysis/recommendation-behavioral-v5-training/audit)"

          jq -e '.state == "COMPLETE" and .auditPassed == true' <<<"$replay_status"
          jq -e '.passed == true and .trainingArtifactEligible == true' <<<"$replay_audit"
          jq -e '.state == "COMPLETE" and .auditPassed == true and .trainingArtifactEligible == true' <<<"$dataset_status"
          jq -e '.state == "COMPLETE"' <<<"$behavioral_status"
          jq -e '.passed == true' <<<"$behavioral_audit"

          expected_replay_sha="$(jq -r '.replaySha256' "$run_dir/run.json")"
          test -n "$expected_replay_sha"
          test "$(sudo sha256sum "$replay/dataset.ndjson" | awk '{print $1}')" = "$expected_replay_sha"

          value_status="$(curl --silent --show-error --max-time 30 http://127.0.0.1:3010/deadlock/analysis/recommendation-value-v8-diagnostic/status || true)"
          if jq -e '.state == "FAILED"' <<<"$value_status" >/dev/null 2>&1; then
            sudo rm -rf "$storage/recommendation-value-v8-diagnostic-terminal-5000-v2"
          fi

          sudo docker exec "$container" sh -lc "pkill -f '[r]un-recommendation-v8-diagnostic-only-pipeline.mjs' || true"
          catalog_version_id="$(sudo docker exec aboba-telegramovich-postgres-1 psql -U postgres -d deadlock_builds -X -A -t -c 'SELECT c.id FROM item_catalog_versions c WHERE c."clientVersion" = 6637 ORDER BY c.id DESC LIMIT 1;')"
          test -n "$catalog_version_id"

          sudo docker exec -d \
            -e API_BASE_URL=http://127.0.0.1:3000 \
            -e SNAPSHOT_ID=v8-5000-c6637-30701422914 \
            -e CANDIDATE_GENERATOR_VERSION=RECOMMENDATION_CANDIDATE_GENERATOR_V6_2_SUPPORT_UNION_5000 \
            -e CANDIDATE_POLICY_VERSION=RECOMMENDATION_CANDIDATE_POLICY_V6_2_SUPPORT_UNION_5000 \
            -e CATALOG_VERSION_ID="$catalog_version_id" \
            -e TRAINING_WINDOW_START=2026-07-18T12:31:22.000Z \
            -e TRAINING_WINDOW_END=2026-07-22T09:32:54.000Z \
            -e TUNING_START=2026-07-26T05:57:36.000Z \
            -e FUTURE_TEST_START=2026-07-27T20:43:24.000Z \
            -e REPLAY_PARTITION_COUNT=16 \
            -e REPLAY_SNAPSHOT_STALENESS_S=300 \
            -e DATASET_DECISION_SNAPSHOT_STALENESS_S=300 \
            -e DIAGNOSTIC_MAX_ROWS=50000 \
            -e PIPELINE_POLL_INTERVAL_MS=10000 \
            -e PIPELINE_TIMEOUT_MS=172800000 \
            -e PIPELINE_REQUEST_TIMEOUT_MS=30000 \
            -e PIPELINE_REQUEST_RETRY_COUNT=240 \
            -e PIPELINE_REQUEST_RETRY_DELAY_MS=5000 \
            "$container" \
            sh -lc 'node /app/scripts/run-recommendation-v8-diagnostic-only-pipeline.mjs >> /runner/training.log 2>&1'

          for attempt in $(seq 1 30); do
            if sudo docker exec "$container" sh -lc "pgrep -f '[r]un-recommendation-v8-diagnostic-only-pipeline.mjs' >/dev/null"; then
              value_status="$(curl --silent --show-error --max-time 15 http://127.0.0.1:3010/deadlock/analysis/recommendation-value-v8-diagnostic/status || true)"
              value_state="$(jq -r '.state // empty' <<<"$value_status" 2>/dev/null || true)"
              if [ "$value_state" = 'RUNNING' ] || [ "$value_state" = 'COMPLETE' ]; then
                echo "$value_status"
                exit 0
              fi
            fi
            sleep 2
          done

          tail -n 120 "$run_dir/training.log" || true
          exit 1

      - name: Inspect isolated recovery
        shell: bash
        run: |
          set -euo pipefail
          run_root='/home/ubuntu/apps/deadlock_dynamo_helper-training'
          bounded_run_root='/home/ubuntu/apps/deadlock_dynamo_helper-training-5000'
          run_dir="$(readlink -f "$run_root/current" 2>/dev/null || true)"
          bounded_run_dir="$(readlink -f "$bounded_run_root/current" 2>/dev/null || true)"
          container='deadlock-recommendation-v8-training'
          storage='/var/lib/docker/volumes/deadlock_dynamo_helper_deadlock-storage/_data'
          replay="$storage/recommendation-historical-pro-replay-terminal-5000-v2"
          report="$RUNNER_TEMP/recommendation-v8-recovery-status.txt"
          {
            echo "generatedAt=$(date --iso-8601=seconds)"
            echo "runDir=$run_dir"
            echo "boundedRunDir=$bounded_run_dir"
            echo
            echo '=== bounded run files ==='
            if [ -n "$bounded_run_dir" ]; then
              cat "$bounded_run_dir/run.json" 2>/dev/null || true
              cat "$bounded_run_dir/status.json" 2>/dev/null || true
              tail -n 200 "$bounded_run_dir/training.log" 2>/dev/null || true
            fi
            echo
            echo '=== isolated container and processes ==='
            sudo docker ps -a --filter "name=^/${container}$" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
            sudo docker inspect --format='running={{.State.Running}} status={{.State.Status}} exitCode={{.State.ExitCode}} oomKilled={{.State.OOMKilled}} startedAt={{.State.StartedAt}}' "$container" 2>/dev/null || true
            sudo docker exec "$container" sh -lc "ps -eo pid,etime,rss,args | grep -E 'recommendation-v8|node /runner' | grep -v grep || true" 2>/dev/null || true
            echo
            echo '=== filesystem ==='
            df -hT /
            df -B1 /
            sudo docker system df || true
            echo
            echo '=== replay status/audit ==='
            curl --silent --show-error --max-time 20 http://127.0.0.1:3010/deadlock/analysis/recommendation-historical-pro-replay/status || true
            echo
            curl --silent --show-error --max-time 20 http://127.0.0.1:3010/deadlock/analysis/recommendation-historical-pro-replay/audit || true
            echo
            echo '=== Dataset V6 status/audit ==='
            curl --silent --show-error --max-time 20 http://127.0.0.1:3010/deadlock/analysis/recommendation-pro-decision-dataset-v6/status || true
            echo
            curl --silent --show-error --max-time 20 http://127.0.0.1:3010/deadlock/analysis/recommendation-pro-decision-dataset-v6/audit || true
            echo
            echo '=== Behavioral V5 status/audit/evaluation ==='
            curl --silent --show-error --max-time 20 http://127.0.0.1:3010/deadlock/analysis/recommendation-behavioral-v5-training/status || true
            echo
            curl --silent --show-error --max-time 20 http://127.0.0.1:3010/deadlock/analysis/recommendation-behavioral-v5-training/audit || true
            echo
            curl --silent --show-error --max-time 20 http://127.0.0.1:3010/deadlock/analysis/recommendation-behavioral-v5-training/evaluation || true
            echo
            echo '=== Value V8 diagnostic status/audit ==='
            curl --silent --show-error --max-time 20 http://127.0.0.1:3010/deadlock/analysis/recommendation-value-v8-diagnostic/status || true
            echo
            curl --silent --show-error --max-time 20 http://127.0.0.1:3010/deadlock/analysis/recommendation-value-v8-diagnostic/audit || true
            echo
            echo '=== active artifact sizes ==='
            sudo du -xhd1 "$storage" 2>/dev/null | sort -h | tail -n 80 || true
            echo
            echo '=== recent container warnings/errors ==='
            sudo docker logs --since=60m "$container" 2>&1 | grep -E 'ERROR|WARN|completed|failed|processed|exported|cache|audit' | tail -n 250 || true
          } | tee "$report"

      - name: Upload status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v8-recovery-status-${{ github.run_id }}
          path: ${{ runner.temp }}/recommendation-v8-recovery-status.txt
          if-no-files-found: warn
          retention-days: 7

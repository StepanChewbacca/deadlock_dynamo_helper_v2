name: Recommendation V8 Recovery Status V3

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-v8-recovery-status-v3.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recommendation-v8-recovery-status-v3
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout status request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Inspect isolated recovery
        shell: bash
        run: |
          set -euo pipefail
          run_root='/home/ubuntu/apps/deadlock_dynamo_helper-training'
          run_dir="$(readlink -f "$run_root/current")"
          container='deadlock-recommendation-v8-training'
          report="$RUNNER_TEMP/recommendation-v8-recovery-status.txt"
          test -d "$run_dir"
          {
            echo "generatedAt=$(date --iso-8601=seconds)"
            echo "runDir=$run_dir"
            echo
            echo '=== supervisor status ==='
            if [ -s "$run_dir/status.json" ]; then cat "$run_dir/status.json"; else echo 'status.json missing'; fi
            echo
            echo '=== isolated container ==='
            sudo docker ps -a --filter "name=^/${container}$" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
            if sudo docker inspect "$container" >/dev/null 2>&1; then
              sudo docker inspect --format='running={{.State.Running}} status={{.State.Status}} exitCode={{.State.ExitCode}} startedAt={{.State.StartedAt}} finishedAt={{.State.FinishedAt}}' "$container"
              echo
              echo '=== recovery processes ==='
              sudo docker exec "$container" sh -lc "ps -eo pid,etime,rss,args | grep -E 'recommendation-v8|node /runner' | grep -v grep || true"
            fi
            echo
            echo '=== API stages ==='
            for endpoint in \
              recommendation-candidate-generator-snapshots/status \
              recommendation-historical-pro-replay/status \
              recommendation-pro-decision-dataset-v6/status \
              recommendation-behavioral-v5-training/status \
              recommendation-value-v8-diagnostic/status \
              recommendation-v6-short-only-dataset-v6-baseline/status \
              recommendation-value-v8-full-evaluation/status; do
              echo "--- $endpoint"
              curl --silent --show-error --max-time 20 "http://127.0.0.1:3010/deadlock/analysis/$endpoint" || true
              echo
            done
            echo
            echo '=== replay audit ==='
            curl --silent --show-error --max-time 20 http://127.0.0.1:3010/deadlock/analysis/recommendation-historical-pro-replay/audit || true
            echo
            echo
            echo '=== diagnostic audit ==='
            curl --silent --show-error --max-time 20 http://127.0.0.1:3010/deadlock/analysis/recommendation-value-v8-diagnostic/audit || true
            echo
            echo
            echo '=== training log tail ==='
            tail -n 300 "$run_dir/training.log" 2>/dev/null || true
            echo
            echo '=== container log tail ==='
            sudo docker logs --tail=200 "$container" 2>&1 || true
          } | tee "$report"

      - name: Upload status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v8-recovery-status-${{ github.run_id }}
          path: ${{ runner.temp }}/recommendation-v8-recovery-status.txt
          if-no-files-found: warn
          retention-days: 7

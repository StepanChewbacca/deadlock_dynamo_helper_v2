name: Apply team economy to Dataset V5 and Value V6

on:
  push:
    branches:
      - agent/recommendation-value-v6
    paths:
      - .github/scripts/apply-team-economy-v6.py
      - .github/workflows/apply-team-economy-v6.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Value V6 branch
        uses: actions/checkout@v4
        with:
          ref: agent/recommendation-value-v6
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Normalize patch matcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply-team-economy-v6.py')
          content = path.read_text(encoding='utf-8')
          old = '''replace_count(
              VALUE_SERVICE,
              """      previousTail,
                actionKey:""",
              """      previousTail,
                teamEconomyBand,
                actionKey:""",
              2,
          )
          '''
          new = '''replace_once(
              VALUE_SERVICE,
              """    previousTail,
              actionKey: observedActionKey,""",
              """    previousTail,
              teamEconomyBand,
              actionKey: observedActionKey,""",
          )

          replace_once(
              VALUE_SERVICE,
              """      previousTail,
              actionKey,""",
              """      previousTail,
              teamEconomyBand,
              actionKey,""",
          )
          '''
          if content.count(old) != 1:
              raise RuntimeError('Value V6 patch matcher normalization target is missing.')
          path.write_text(content.replace(old, new), encoding='utf-8')
          PY

      - name: Apply team economy implementation
        shell: bash
        run: |
          set +e
          python .github/scripts/apply-team-economy-v6.py > "$RUNNER_TEMP/team-economy-patch.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/team-economy-patch.log"
          exit "$status"

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-economy-patch-diagnostics
          path: ${{ runner.temp }}/team-economy-patch.log
          if-no-files-found: warn
          retention-days: 3

      - name: Remove temporary patch transport
        run: |
          rm -f .github/scripts/apply-team-economy-v6.py
          rm -f .github/workflows/apply-team-economy-v6.yml

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build shared package
        run: yarn workspace @deadlock-live-probe/shared build

      - name: Build domain package
        run: yarn workspace @deadlock-live-probe/build-domain build

      - name: Build API
        run: yarn workspace @deadlock-live-probe/api build

      - name: Test team economy and Value V6
        run: >-
          yarn workspace @deadlock-live-probe/api test
          recommendation-decision-dataset-v5.spec.ts
          recommendation-value-v6-core.spec.ts
          recommendation-value-v6-training.spec.ts

      - name: Commit verified implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add team economy to Recommendation Value V6"
          git push origin HEAD:agent/recommendation-value-v6

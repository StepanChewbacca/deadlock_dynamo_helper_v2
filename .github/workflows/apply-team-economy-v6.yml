name: Apply team economy to Dataset V5 and Value V6

on:
  push:
    branches:
      - agent/recommendation-value-v6
    paths:
      - .github/scripts/apply-team-economy-v6.py
      - .github/workflows/apply-team-economy-v6.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Value V6 branch
        uses: actions/checkout@v4
        with:
          ref: agent/recommendation-value-v6
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Normalize patch matcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply-team-economy-v6.py')
          content = path.read_text(encoding='utf-8')
          old = '''replace_count(
              VALUE_SERVICE,
              """      previousTail,
                actionKey:""",
              """      previousTail,
                teamEconomyBand,
                actionKey:""",
              2,
          )
          '''
          new = '''def add_team_economy_band_to_action_calls(path: str | Path) -> None:
              file_path = Path(path)
              lines = file_path.read_text(encoding="utf-8").splitlines()
              inserted = 0
              index = 0
              while index < len(lines) - 1:
                  if (
                      lines[index].strip() == "previousTail,"
                      and lines[index + 1].strip() in {"actionKey: observedActionKey,", "actionKey,"}
                  ):
                      indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
                      lines.insert(index + 1, f"{indent}teamEconomyBand,")
                      inserted += 1
                      index += 2
                  index += 1
              if inserted != 2:
                  raise RuntimeError(
                      f"{file_path}: expected two buildActionKeys calls, updated {inserted}"
                  )
              file_path.write_text("\\n".join(lines) + "\\n", encoding="utf-8")

          add_team_economy_band_to_action_calls(VALUE_SERVICE)
          '''
          if content.count(old) != 1:
              raise RuntimeError('Value V6 patch matcher normalization target is missing.')
          content = content.replace(old, new)

          extra_horizon_snapshots = '''    createSnapshot(215, 1, 0, 2, 2000),
              createSnapshot(215, 0, 0, 2, 2600, {
                steamId: 'ally-1',
                heroId: 16,
                teamId: 2,
              }),
              createSnapshot(215, 1, 0, 1, 3200, {
                steamId: 'enemy-1',
                heroId: 20,
                teamId: 3,
              }),
              createSnapshot(215, 2, 0, 1, 3600, {
                steamId: 'enemy-2',
                heroId: 21,
                teamId: 3,
              }),
          '''
          if content.count(extra_horizon_snapshots) != 1:
              raise RuntimeError('Unexpected synthetic 215-second snapshot block.')
          path.write_text(
              content.replace(extra_horizon_snapshots, ''),
              encoding='utf-8',
          )
          PY

      - name: Apply team economy implementation
        shell: bash
        run: |
          set +e
          python .github/scripts/apply-team-economy-v6.py > "$RUNNER_TEMP/team-economy-patch.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/team-economy-patch.log"
          exit "$status"

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-economy-patch-diagnostics
          path: ${{ runner.temp }}/team-economy-patch.log
          if-no-files-found: warn
          retention-days: 3

      - name: Remove temporary patch transport
        run: |
          rm -f .github/scripts/apply-team-economy-v6.py
          rm -f .github/workflows/apply-team-economy-v6.yml

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build shared package
        run: yarn workspace @deadlock-live-probe/shared build

      - name: Build domain package
        run: yarn workspace @deadlock-live-probe/build-domain build

      - name: Build API
        run: yarn workspace @deadlock-live-probe/api build

      - name: Test team economy and Value V6
        shell: bash
        run: |
          set +e
          yarn workspace @deadlock-live-probe/api test \
            recommendation-decision-dataset-v5.spec.ts \
            recommendation-value-v6-core.spec.ts \
            recommendation-value-v6-training.spec.ts \
            > "$RUNNER_TEMP/team-economy-tests.log" 2>&1
          status=$?
          tail -n 250 "$RUNNER_TEMP/team-economy-tests.log"
          exit "$status"

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-economy-test-diagnostics
          path: ${{ runner.temp }}/team-economy-tests.log
          if-no-files-found: warn
          retention-days: 3

      - name: Commit verified implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add team economy to Recommendation Value V6"
          git push origin HEAD:agent/recommendation-value-v6

name: Run Recommendation V6 and V7 improvement program

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-recommendation-v6-improvement-program.yml
      - .github/scripts/run-recommendation-v6-improvement-program.sh
      - .github/scripts/patch-recommendation-v5-gzip.cjs
      - .github/scripts/patch-recommendation-v6-target-ablation.cjs
      - .github/scripts/patch-recommendation-policy-v6-accept-v7.cjs
      - .github/scripts/patch-recommendation-v6-sweep-target-ablation.cjs
      - .github/scripts/patch-recommendation-v7-short-match-split.cjs
      - .github/scripts/patch-recommendation-v6-v7-comparator-schema.cjs
      - scripts/analyze-recommendation-v6-shrinkage.mjs
      - scripts/run-recommendation-v6-prior-sweep.mjs
      - scripts/train_recommendation_v7_catboost.py
      - scripts/run-recommendation-v7-policy-evaluation.mjs
      - scripts/compare-recommendation-v6-v7-results.mjs

permissions:
  contents: read

concurrency:
  group: recommendation-v6-v7-improvement-program
  cancel-in-progress: false

jobs:
  gate:
    if: github.event.pull_request.head.ref == 'diagnostics/run-recommendation-v6-cycle-20260726'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.commit.outputs.should_run }}
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Check execution marker
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          message=$(git log -1 --pretty=%B)
          if grep -Fq '[run-v6-improvement]' <<<"$message"; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
            echo 'Latest commit does not contain the execution marker.'
          fi

  improve-and-evaluate:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: self-hosted
    timeout-minutes: 2400
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run V6 sweep, V7 CatBoost, OPE, and roadmap
        shell: bash
        run: bash .github/scripts/run-recommendation-v6-improvement-program.sh

      - name: Upload Recommendation V6 and V7 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-v6-v7-improvement-${{ github.sha }}
          path: recommendation-v6-improvement-result
          if-no-files-found: warn
          retention-days: 30

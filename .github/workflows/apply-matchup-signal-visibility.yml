name: Apply matchup signal visibility fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-matchup-signal-visibility.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/contextual-v3-matchup-signal-visibility'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contextual-v3-matchup-signal-visibility
          fetch-depth: 0
      - name: Apply fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1))

          path = 'apps/api/src/deadlock-live/hero-build-contextual-v3-live.service.ts'
          old = """  const divisor = input.evidence.length;
  return input.evidence
    .map((value) => {
      const scoreContribution =
        input.enemyWeight *
        (value.logProbability - input.baseLogProbability) /
        divisor;
      const modelLiftPercent = (Math.exp(scoreContribution) - 1) * 100;
      return {
        heroId: value.heroId,
        direction: scoreContribution >= 0 ? 'POSITIVE' as const : 'NEGATIVE' as const,
        scoreContribution,
        modelLiftPercent,
        observationCount: value.observationCount,
      };
    })
"""
          new = """  const divisor = input.evidence.length;
  return input.evidence
    .map((value) => {
      const isolatedScoreContribution =
        input.enemyWeight *
        (value.logProbability - input.baseLogProbability);
      const scoreContribution = isolatedScoreContribution / divisor;
      const modelLiftPercent =
        (Math.exp(isolatedScoreContribution) - 1) * 100;
      return {
        heroId: value.heroId,
        direction:
          isolatedScoreContribution >= 0
            ? 'POSITIVE' as const
            : 'NEGATIVE' as const,
        scoreContribution,
        modelLiftPercent,
        observationCount: value.observationCount,
      };
    })
"""
          replace(path, old, new)

          path = 'apps/api/test/hero-build-contextual-v3-live.spec.ts'
          marker = """  it('reconstructs buy, upgrade, and sell actions from live inventory snapshots', () => {
"""
          test = """  it('keeps isolated matchup lift visible with a full enemy roster', () => {
    const signals = createContextualV3MatchupSignals({
      baseLogProbability: -2,
      enemyWeight: 0.12,
      evidence: [
        { heroId: 13, logProbability: -1.95, observationCount: 80 },
        { heroId: 14, logProbability: -2, observationCount: 80 },
        { heroId: 15, logProbability: -2, observationCount: 80 },
        { heroId: 16, logProbability: -2, observationCount: 80 },
        { heroId: 17, logProbability: -2, observationCount: 80 },
      ],
    });

    expect(signals).toHaveLength(1);
    expect(signals[0].heroId).toBe(13);
    expect(signals[0].scoreContribution).toBeCloseTo(0.0012, 6);
    expect(signals[0].modelLiftPercent).toBeGreaterThan(0.5);
  });

"""
          replace(path, marker, test + marker)

          path = 'apps/overwolf-client/src/live-build-recommendation-ui.ts'
          replace(
              path,
              "    fragment.append(createPrimaryAction(recommendation.action, snapshot.isStale));\n",
              "    fragment.append(\n      createPrimaryAction(\n        recommendation.action,\n        snapshot.isStale,\n        recommendation.recommendationModel === 'CONTEXTUAL_V3'\n          ? recommendation.contextualFeatures?.enemyHeroIds.length ?? 0\n          : undefined,\n      ),\n    );\n",
          )
          replace(
              path,
              "function createPrimaryAction(\n  action: LiveBuildRecommendationAction,\n  isStale: boolean,\n): HTMLElement {\n",
              "function createPrimaryAction(\n  action: LiveBuildRecommendationAction,\n  isStale: boolean,\n  evaluatedEnemyCount: number | undefined,\n): HTMLElement {\n",
          )
          replace(
              path,
              "  const matchup = createMatchupSignals(action);\n",
              "  const matchup = createMatchupSignals(action, evaluatedEnemyCount);\n",
          )
          old = """function createMatchupSignals(
  action: LiveBuildRecommendationAction,
): HTMLElement | undefined {
  const signals = (action.matchupSignals ?? []).filter(
    (signal) => signal.direction === 'POSITIVE',
  );
  if (signals.length === 0) {
    return undefined;
  }

  const section = document.createElement('div');
  section.className = 'live-build-matchup';
  section.title =
    'Historical purchase pattern used by Contextual V3. This is model influence, not proven win-rate counter effectiveness.';

  const title = document.createElement('span');
  title.className = 'live-build-matchup-title';
  title.textContent = 'MATCHUP SIGNAL';

  const chips = document.createElement('div');
  chips.className = 'live-build-matchup-chips';
  for (const signal of signals.slice(0, 2)) {
    const chip = document.createElement('span');
    chip.className = 'live-build-matchup-chip';
    chip.textContent = formatMatchupSignal(signal);
    chips.append(chip);
  }

  const note = document.createElement('span');
  note.className = 'live-build-matchup-note';
  note.textContent = 'Historical purchase tendency, not win-rate proof.';
  section.append(title, chips, note);
  return section;
}
"""
          new = """function createMatchupSignals(
  action: LiveBuildRecommendationAction,
  evaluatedEnemyCount: number | undefined,
): HTMLElement | undefined {
  const signals = (action.matchupSignals ?? []).filter(
    (signal) => signal.direction === 'POSITIVE',
  );
  if (signals.length === 0 && evaluatedEnemyCount === undefined) {
    return undefined;
  }

  const section = document.createElement('div');
  section.className = 'live-build-matchup';
  section.title =
    'Historical purchase pattern used by Contextual V3. This is model influence, not proven win-rate counter effectiveness.';

  const title = document.createElement('span');
  title.className = 'live-build-matchup-title';
  title.textContent = signals.length > 0 ? 'MATCHUP SIGNAL' : 'MATCHUP CONTEXT';

  const note = document.createElement('span');
  note.className = 'live-build-matchup-note';

  if (signals.length === 0) {
    note.textContent = evaluatedEnemyCount && evaluatedEnemyCount > 0
      ? `${evaluatedEnemyCount} enemies evaluated · no strong individual signal.`
      : 'Enemy roster unavailable for this recommendation.';
    section.append(title, note);
    return section;
  }

  const chips = document.createElement('div');
  chips.className = 'live-build-matchup-chips';
  for (const signal of signals.slice(0, 2)) {
    const chip = document.createElement('span');
    chip.className = 'live-build-matchup-chip';
    chip.textContent = formatMatchupSignal(signal);
    chips.append(chip);
  }

  note.textContent = 'Historical purchase tendency, not win-rate proof.';
  section.append(title, chips, note);
  return section;
}
"""
          replace(path, old, new)

          path = 'apps/overwolf-client/package.json'
          replace(path, '"version": "0.1.11"', '"version": "0.1.12"')
          path = 'apps/overwolf-client/public/manifest.json'
          replace(path, '"version": "0.1.11"', '"version": "0.1.12"')
          path = 'apps/overwolf-client/src/desktop-version.ts'
          replace(path, "const APP_VERSION = '0.1.11';", "const APP_VERSION = '0.1.12';")
          replace(path, "const APP_BUILD = '021';", "const APP_BUILD = '022';")

          Path('.github/workflows/apply-matchup-signal-visibility.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep matchup signals visible for full rosters"
          git push origin HEAD:agent/contextual-v3-matchup-signal-visibility

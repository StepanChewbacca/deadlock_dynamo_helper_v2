name: Apply Overwolf build 019 patch

on:
  push:
    branches:
      - fix/overwolf-build-019-refresh-sync
    paths:
      - .github/workflows/apply-overwolf-build-019-push.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/overwolf-build-019-refresh-sync
          fetch-depth: 0
      - name: Execute patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source_path = Path('.github/workflows/apply-overwolf-build-019.yml')
          source = source_path.read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, str(source_path), 'exec'))
          Path('.github/workflows/apply-overwolf-build-019-push.yml').unlink()
          PY
      - name: Validate diff
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: recover Overwolf overlay from stale refreshing state"
          git push origin HEAD:fix/overwolf-build-019-refresh-sync

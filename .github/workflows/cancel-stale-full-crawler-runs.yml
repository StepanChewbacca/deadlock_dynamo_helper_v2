name: Cancel stale full crawler runs

on:
  pull_request:
    paths:
      - '.github/workflows/cancel-stale-full-crawler-runs.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: github.event.pull_request.head.ref == 'diagnostics/run-full-crawler-value-v5-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale queued runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          for run_id in \
            30109620858 \
            30109620914 \
            30109701272 \
            30109701442 \
            30130599980 \
            30130600017
          do
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done

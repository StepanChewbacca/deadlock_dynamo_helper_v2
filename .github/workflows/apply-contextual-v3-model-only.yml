name: Apply Contextual V3 model-only test mode

on:
  push:
    branches:
      - agent/contextual-v3-model-only-test
    paths:
      - .github/workflows/apply-contextual-v3-model-only.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contextual-v3-model-only-test
          fetch-depth: 0

      - name: Apply model-only changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {text.count(old)}")
              file_path.write_text(text.replace(old, new, 1))

          production = "apps/api/src/deadlock-live/production-hero-build-recommendation.service.ts"
          replace_once(
              production,
              """  fallbackCount: number;\n  shadowScheduledCount: number;""",
              """  fallbackCount: number;\n  modelOnly: boolean;\n  fallbackEnabled: boolean;\n  modelErrorCount: number;\n  shadowScheduledCount: number;""",
          )
          replace_once(
              production,
              """  lastFallbackAt?: string;\n  lastFallbackError?: string;""",
              """  lastFallbackAt?: string;\n  lastFallbackError?: string;\n  lastModelErrorAt?: string;\n  lastModelError?: string;""",
          )
          replace_once(
              production,
              """  private fallbackCount = 0;\n  private shadowScheduledCount = 0;""",
              """  private fallbackCount = 0;\n  private modelErrorCount = 0;\n  private shadowScheduledCount = 0;""",
          )
          replace_once(
              production,
              """  private lastFallbackAt?: string;\n  private lastFallbackError?: string;""",
              """  private lastFallbackAt?: string;\n  private lastFallbackError?: string;\n  private lastModelErrorAt?: string;\n  private lastModelError?: string;""",
          )
          replace_once(
              production,
              """      fallbackCount: this.fallbackCount,\n      shadowScheduledCount: this.shadowScheduledCount,""",
              """      fallbackCount: this.fallbackCount,\n      modelOnly: this.mode === 'PRODUCTION',\n      fallbackEnabled: this.mode !== 'PRODUCTION',\n      modelErrorCount: this.modelErrorCount,\n      shadowScheduledCount: this.shadowScheduledCount,""",
          )
          replace_once(
              production,
              """      lastFallbackAt: this.lastFallbackAt,\n      lastFallbackError: this.lastFallbackError,""",
              """      lastFallbackAt: this.lastFallbackAt,\n      lastFallbackError: this.lastFallbackError,\n      lastModelErrorAt: this.lastModelErrorAt,\n      lastModelError: this.lastModelError,""",
          )
          old_recommend = """    this.requestCount += 1;\n    const requestedHeroId = request.heroId;\n    const canonicalRequest = createCanonicalRequest(request);\n    const canonicalBaseline = await super.recommend(canonicalRequest);\n    const baseline: HeroBuildRecommendationResponse = {\n      ...canonicalBaseline,\n      heroId: requestedHeroId,\n    };\n\n    if (this.mode === 'BASELINE') {\n      this.baselineResponseCount += 1;\n      return baseline;\n    }\n\n    if (this.mode === 'SHADOW') {\n      this.baselineResponseCount += 1;\n      this.scheduleContextualShadow(\n        canonicalRequest,\n        requestedHeroId,\n        baseline,\n      );\n      return baseline;\n    }\n\n    try {\n      const contextual = this.contextualV3LiveService.recommend(\n        canonicalRequest,\n        baseline,\n      );\n      this.contextualResponseCount += 1;\n      return {\n        ...contextual,\n        heroId: requestedHeroId,\n      };\n    } catch (error) {\n      this.recordFallback(error);\n      this.baselineResponseCount += 1;\n      return baseline;\n    }\n"""
          new_recommend = """    this.requestCount += 1;\n    const requestedHeroId = request.heroId;\n    const canonicalRequest = createCanonicalRequest(request);\n\n    if (this.mode === 'PRODUCTION') {\n      try {\n        const contextual = this.contextualV3LiveService.recommend(canonicalRequest);\n        this.contextualResponseCount += 1;\n        return {\n          ...contextual,\n          heroId: requestedHeroId,\n        };\n      } catch (error) {\n        this.recordModelError(error);\n        throw error;\n      }\n    }\n\n    const canonicalBaseline = await super.recommend(canonicalRequest);\n    const baseline: HeroBuildRecommendationResponse = {\n      ...canonicalBaseline,\n      heroId: requestedHeroId,\n    };\n\n    if (this.mode === 'BASELINE') {\n      this.baselineResponseCount += 1;\n      return baseline;\n    }\n\n    this.baselineResponseCount += 1;\n    this.scheduleContextualShadow(\n      canonicalRequest,\n      requestedHeroId,\n      baseline,\n    );\n    return baseline;\n"""
          replace_once(production, old_recommend, new_recommend)
          replace_once(
              production,
              """  private recordFallback(error: unknown): void {\n    const message = getErrorMessage(error);\n    this.fallbackCount += 1;\n    this.lastFallbackAt = new Date().toISOString();\n    this.lastFallbackError = message;\n    this.logger.warn(`Contextual V3 fallback to baseline: ${message}`);\n  }\n""",
              """  private recordFallback(error: unknown): void {\n    const message = getErrorMessage(error);\n    this.fallbackCount += 1;\n    this.lastFallbackAt = new Date().toISOString();\n    this.lastFallbackError = message;\n    this.logger.warn(`Contextual V3 shadow evaluation failed: ${message}`);\n  }\n\n  private recordModelError(error: unknown): void {\n    const message = getErrorMessage(error);\n    this.modelErrorCount += 1;\n    this.lastModelErrorAt = new Date().toISOString();\n    this.lastModelError = message;\n    this.logger.error(`Contextual V3 model-only request failed: ${message}`);\n  }\n""",
          )

          contextual = "apps/api/src/deadlock-live/hero-build-contextual-v3-live.service.ts"
          replace_once(
              contextual,
              """  recommend(\n    request: HeroBuildContextualRecommendationRequest,\n    baseline: HeroBuildRecommendationResponse,\n  ): ContextualV3LiveRecommendationResponse {""",
              """  recommend(\n    request: HeroBuildContextualRecommendationRequest,\n    baseline?: HeroBuildRecommendationResponse,\n  ): ContextualV3LiveRecommendationResponse {""",
          )
          replace_once(
              contextual,
              """    const action = actions[0];\n    const mode = baseline.mode === 'NO_MATCH' ? 'BACKOFF' : baseline.mode;\n\n    return {\n      ...baseline,""",
              """    const action = actions[0];\n    const mode = baseline\n      ? baseline.mode === 'NO_MATCH'\n        ? 'BACKOFF'\n        : baseline.mode\n      : 'BACKOFF';\n\n    return {\n      ...(baseline ?? {}),""",
          )
          replace_once(
              contextual,
              """      backoffReason:\n        baseline.mode === 'NO_MATCH' ? 'DIRECTIONAL_FALLBACK' : baseline.backoffReason,""",
              """      backoffReason:\n        baseline?.mode === 'NO_MATCH'\n          ? 'DIRECTIONAL_FALLBACK'\n          : baseline?.backoffReason,""",
          )

          poller = "apps/overwolf-client/src/live-build-recommendation-poller.ts"
          replace_once(
              poller,
              """export interface LiveBuildRecommendationPayload {\n  mode: 'EXACT' | 'BACKOFF' | 'NO_MATCH';\n  action: LiveBuildRecommendationAction;\n  alternatives: LiveBuildRecommendationAction[];\n}""",
              """export interface LiveBuildRecommendationPayload {\n  mode: 'EXACT' | 'BACKOFF' | 'NO_MATCH';\n  action: LiveBuildRecommendationAction;\n  alternatives: LiveBuildRecommendationAction[];\n  recommendationModel?: 'CONTEXTUAL_V3';\n  modelVersion?: string;\n  modelSha256?: string;\n  buildArchetypeId?: string;\n  contextualFeatures?: {\n    phase: 'EARLY' | 'MID' | 'LATE';\n    alliedHeroIds: number[];\n    enemyHeroIds: number[];\n    previousActionCount: number;\n    archetypeApplied: boolean;\n  };\n}""",
          )
          replace_once(
              poller,
              """    snapshot.recommendation?.mode ?? '',\n    snapshot.recommendation?.action.actionKey ?? '',""",
              """    snapshot.recommendation?.mode ?? '',\n    snapshot.recommendation?.recommendationModel ?? 'BASELINE',\n    snapshot.recommendation?.modelVersion ?? '',\n    snapshot.recommendation?.contextualFeatures?.phase ?? '',\n    snapshot.recommendation?.action.actionKey ?? '',""",
          )

          hud_ui = "apps/overwolf-client/src/live-build-recommendation-ui.ts"
          replace_once(
              hud_ui,
              """  const eyebrow = document.createElement('span');\n  eyebrow.className = 'live-build-eyebrow';\n  eyebrow.textContent = 'NEXT BUILD ACTION';""",
              """  const eyebrow = document.createElement('span');\n  eyebrow.className = 'live-build-eyebrow';\n  const source = snapshot.recommendation?.recommendationModel === 'CONTEXTUAL_V3'\n    ? 'MODEL V3'\n    : snapshot.recommendation\n      ? 'BASELINE'\n      : undefined;\n  const phase = snapshot.recommendation?.contextualFeatures?.phase;\n  eyebrow.textContent = ['NEXT BUILD ACTION', source, phase]\n    .filter((value): value is string => Boolean(value))\n    .join(' · ');""",
          )

          full_route = "apps/overwolf-client/src/live-build-desktop-full-build-ui.ts"
          replace_once(
              full_route,
              """  showBaseDesktop(createFullRouteSnapshot(snapshot));""",
              """  showBaseDesktop(snapshot);""",
          )
          replace_once(
              full_route,
              """function createFullRouteSnapshot(\n  snapshot: LiveBuildRecommendationSnapshot,\n): LiveBuildRecommendationSnapshot {\n  const heroId = Number(snapshot.heroId);\n  return {\n    ...snapshot,\n    itemIds: [],\n    inventoryStateKey: 'EMPTY',\n    gameTimeS: 0,\n    timeBucket: 0,\n    traversalKey: Number.isSafeInteger(heroId) && heroId > 0\n      ? `full-build:${heroId}`\n      : snapshot.traversalKey,\n  };\n}\n\n""",
              """""",
          )

          table_ui = "apps/overwolf-client/src/live-build-desktop-table-ui.ts"
          replace_once(
              table_ui,
              """const STYLE_ID = 'live-build-desktop-table-styles';""",
              """const STYLE_ID = 'live-build-desktop-table-styles';\nconst MODEL_ROLLOUT_STEP_S = 90;\nconst MODEL_ROLLOUT_MAX_STEPS = 24;""",
          )
          replace_once(
              table_ui,
              """interface ProjectedRecommendationResponse {\n  mode: 'EXACT' | 'BACKOFF' | 'NO_MATCH';\n  heroId: number;\n  requestedStateKey: string;\n  gameTimeS: number;\n  action: ExtendedLiveBuildRecommendationAction;\n  alternatives: ExtendedLiveBuildRecommendationAction[];\n}""",
              """interface ProjectedRecommendationResponse {\n  mode: 'EXACT' | 'BACKOFF' | 'NO_MATCH';\n  heroId: number;\n  requestedStateKey: string;\n  gameTimeS: number;\n  action: ExtendedLiveBuildRecommendationAction;\n  alternatives: ExtendedLiveBuildRecommendationAction[];\n  recommendationModel?: 'CONTEXTUAL_V3';\n}""",
          )
          replace_once(
              table_ui,
              """interface ProjectedBuildStep {\n  index: number;\n  mode: ProjectedRecommendationResponse['mode'];\n  requestedStateKey: string;\n  predictedStateKey: string;\n  action: ExtendedLiveBuildRecommendationAction;\n}""",
              """interface ProjectedBuildStep {\n  index: number;\n  mode: ProjectedRecommendationResponse['mode'];\n  gameTimeS: number;\n  requestedStateKey: string;\n  predictedStateKey: string;\n  action: ExtendedLiveBuildRecommendationAction;\n}""",
          )
          replace_once(
              table_ui,
              """  let gameTimeS = normalizeGameTime(snapshot.gameTimeS);\n  const steps: ProjectedBuildStep[] = [];""",
              """  let gameTimeS = normalizeGameTime(snapshot.gameTimeS);\n  const enemyHeroIds = [...(snapshot.enemyHeroIds ?? [])];\n  const previousActionKeys: string[] = [];\n  const steps: ProjectedBuildStep[] = [];""",
          )
          replace_once(
              table_ui,
              """  while (generation === projectionGeneration) {""",
              """  while (\n    generation === projectionGeneration &&\n    steps.length < MODEL_ROLLOUT_MAX_STEPS\n  ) {""",
          )
          replace_once(
              table_ui,
              """          gameTimeS,\n          limit: 5,""",
              """          gameTimeS,\n          enemyHeroIds,\n          previousActionKeys,\n          limit: 5,""",
          )
          replace_once(
              table_ui,
              """    if (!isProjectedRecommendationResponse(parsed)) {\n      throw new Error('Full build response has an invalid shape.');\n    }\n\n    const action = parsed.action;""",
              """    if (!isProjectedRecommendationResponse(parsed)) {\n      throw new Error('Full build response has an invalid shape.');\n    }\n    if (parsed.recommendationModel !== 'CONTEXTUAL_V3') {\n      throw new Error('Full build response did not come from Contextual V3.');\n    }\n\n    const action = parsed.action;""",
          )
          replace_once(
              table_ui,
              """    steps.push({\n      index: steps.length + 1,\n      mode: parsed.mode,\n      requestedStateKey: parsed.requestedStateKey,""",
              """    steps.push({\n      index: steps.length + 1,\n      mode: parsed.mode,\n      gameTimeS,\n      requestedStateKey: parsed.requestedStateKey,""",
          )
          replace_once(
              table_ui,
              """    itemIds = nextItemIds;\n    gameTimeS = Math.max(\n      gameTimeS + 1,\n      normalizeGameTime(action.averageGameTimeS),\n    );""",
              """    itemIds = nextItemIds;\n    previousActionKeys.push(action.actionKey);\n    gameTimeS = advanceModelRolloutTime(gameTimeS);""",
          )
          replace_once(
              table_ui,
              """    ['Recommendation mode', snapshot.recommendation?.mode ?? 'WAITING'],""",
              """    [\n      'Recommendation source',\n      snapshot.recommendation?.recommendationModel === 'CONTEXTUAL_V3'\n        ? `MODEL V3 ${snapshot.recommendation.contextualFeatures?.phase ?? ''}`.trim()\n        : snapshot.recommendation\n          ? 'BASELINE'\n          : 'WAITING',\n    ],""",
          )
          replace_once(
              table_ui,
              """function getStepTime(step: ProjectedBuildStep): number {\n  return normalizeGameTime(step.action.averageGameTimeS);\n}""",
              """function getStepTime(step: ProjectedBuildStep): number {\n  return normalizeGameTime(step.gameTimeS);\n}\n\nexport function advanceModelRolloutTime(gameTimeS: number): number {\n  return normalizeGameTime(gameTimeS) + MODEL_ROLLOUT_STEP_S;\n}""",
          )

          table_spec = "apps/overwolf-client/src/live-build-desktop-table-ui.spec.ts"
          replace_once(
              table_spec,
              """  classifyBuildPhase,\n  normalizeHeroName,""",
              """  advanceModelRolloutTime,\n  classifyBuildPhase,\n  normalizeHeroName,""",
          )
          replace_once(
              table_spec,
              """  it('preserves duplicate item counts from projected state keys', () => {""",
              """  it('advances model rollout time across phase boundaries', () => {\n    expect(advanceModelRolloutTime(0)).toBe(90);\n    expect(advanceModelRolloutTime(540)).toBe(630);\n    expect(classifyBuildPhase(advanceModelRolloutTime(1110))).toBe('LATE');\n  });\n\n  it('preserves duplicate item counts from projected state keys', () => {""",
          )

          version_file = "apps/overwolf-client/src/desktop-version.ts"
          replace_once(version_file, "const APP_VERSION = '0.1.9';", "const APP_VERSION = '0.1.10';")
          replace_once(version_file, "const APP_BUILD = '019';", "const APP_BUILD = '020';")
          replace_once(
              version_file,
              """    | { state?: string; matchId?: string; recommendation?: unknown }""",
              """    | {\n        state?: string;\n        matchId?: string;\n        recommendation?: { recommendationModel?: string };\n      }""",
          )
          replace_once(
              version_file,
              """  const matchLabel = matchId ? `MATCH ${matchId}` : '';\n  const label = [\n    `BUILD ${APP_BUILD}`,\n    `v${APP_VERSION}`,\n    matchLabel,\n    runtimeState,""",
              """  const matchLabel = matchId ? `MATCH ${matchId}` : '';\n  const recommendationSource = snapshot?.recommendation\n    ? snapshot.recommendation.recommendationModel === 'CONTEXTUAL_V3'\n      ? 'MODEL V3'\n      : 'BASELINE'\n    : '';\n  const label = [\n    `BUILD ${APP_BUILD}`,\n    `v${APP_VERSION}`,\n    matchLabel,\n    recommendationSource,\n    runtimeState,""",
          )

          replace_once(
              "apps/overwolf-client/package.json",
              '"version": "0.1.9"',
              '"version": "0.1.10"',
          )
          replace_once(
              "apps/overwolf-client/public/manifest.json",
              '"version": "0.1.9"',
              '"version": "0.1.10"',
          )

          model_only_spec = Path("apps/api/test/hero-build-production-model-only.spec.ts")
          model_only_spec.write_text("""import type { HeroBuildContextualV3LiveService } from '../src/deadlock-live/hero-build-contextual-v3-live.service';
          import type { HeroBuildTransitionAggregationService } from '../src/deadlock-live/hero-build-transition-aggregation.service';
          import { ProductionHeroBuildRecommendationService } from '../src/deadlock-live/production-hero-build-recommendation.service';
          import type { RecipeAwareTimelineReconciliationService } from '../src/deadlock-live/recipe-aware-timeline-reconciliation.service';

          describe('ProductionHeroBuildRecommendationService model-only mode', () => {
            const previousMode = process.env.DEADLOCK_CONTEXTUAL_V3_LIVE_MODE;

            beforeEach(() => {
              process.env.DEADLOCK_CONTEXTUAL_V3_LIVE_MODE = 'PRODUCTION';
            });

            afterEach(() => {
              if (previousMode === undefined) {
                delete process.env.DEADLOCK_CONTEXTUAL_V3_LIVE_MODE;
              } else {
                process.env.DEADLOCK_CONTEXTUAL_V3_LIVE_MODE = previousMode;
              }
              jest.restoreAllMocks();
            });

            it('returns Contextual V3 without loading the baseline policy', async () => {
              const transitionService = {
                ensureReady: jest.fn(async () => undefined),
                getStatus: jest.fn(),
                getHeroPolicy: jest.fn(),
              } as unknown as HeroBuildTransitionAggregationService;
              const recipeService = {
                getComponentItemIds: jest.fn(() => []),
              } as unknown as RecipeAwareTimelineReconciliationService;
              const contextualService = {
                getStatus: jest.fn(() => ({ state: 'READY' })),
                recommend: jest.fn((request: { heroId: number }) =>
                  createModelResponse(request.heroId),
                ),
              } as unknown as HeroBuildContextualV3LiveService;
              const service = new ProductionHeroBuildRecommendationService(
                transitionService,
                recipeService,
                contextualService,
              );

              const response = await service.recommend({
                heroId: 64,
                itemIds: [],
                gameTimeS: 180,
                enemyHeroIds: [3, 4],
                previousActionKeys: [],
                limit: 5,
              });

              expect(response.heroId).toBe(64);
              expect((response as { recommendationModel?: string }).recommendationModel).toBe(
                'CONTEXTUAL_V3',
              );
              expect(contextualService.recommend).toHaveBeenCalledWith(
                expect.objectContaining({ heroId: 2 }),
              );
              expect(transitionService.ensureReady).not.toHaveBeenCalled();
              expect(transitionService.getHeroPolicy).not.toHaveBeenCalled();
              expect(service.getStatus()).toEqual(
                expect.objectContaining({
                  modelOnly: true,
                  fallbackEnabled: false,
                  contextualResponseCount: 1,
                  baselineResponseCount: 0,
                  fallbackCount: 0,
                  modelErrorCount: 0,
                }),
              );
            });

            it('propagates model failures instead of returning baseline', async () => {
              const transitionService = {
                ensureReady: jest.fn(async () => undefined),
                getStatus: jest.fn(),
                getHeroPolicy: jest.fn(),
              } as unknown as HeroBuildTransitionAggregationService;
              const recipeService = {
                getComponentItemIds: jest.fn(() => []),
              } as unknown as RecipeAwareTimelineReconciliationService;
              const contextualService = {
                getStatus: jest.fn(() => ({ state: 'READY' })),
                recommend: jest.fn(() => {
                  throw new Error('model exploded');
                }),
              } as unknown as HeroBuildContextualV3LiveService;
              const service = new ProductionHeroBuildRecommendationService(
                transitionService,
                recipeService,
                contextualService,
              );

              await expect(
                service.recommend({
                  heroId: 2,
                  itemIds: [],
                  gameTimeS: 180,
                  limit: 5,
                }),
              ).rejects.toThrow('model exploded');

              expect(transitionService.ensureReady).not.toHaveBeenCalled();
              expect(service.getStatus()).toEqual(
                expect.objectContaining({
                  fallbackCount: 0,
                  baselineResponseCount: 0,
                  modelErrorCount: 1,
                  lastModelError: 'model exploded',
                }),
              );
            });
          });

          function createModelResponse(heroId: number) {
            return {
              mode: 'BACKOFF' as const,
              heroId,
              requestedStateKey: 'EMPTY',
              gameTimeS: 180,
              matchedStateKey: 'EMPTY',
              stateDistance: 0,
              missingItemCount: 0,
              extraItemCount: 0,
              matchedBySubset: true,
              observationCount: 10,
              candidateStateCount: 5,
              action: createAction(),
              alternatives: [],
              recommendationModel: 'CONTEXTUAL_V3' as const,
              modelVersion: 'CONTEXTUAL_V3_HIERARCHICAL_COUNT_RANKER_1',
              modelSha256: 'test',
              candidateSetPolicy: 'TRAIN_OBSERVED_GLOBAL_BACKOFF_LEGAL_SHORTLIST',
              candidateLimit: 128,
              buildArchetypeId: 'UNKNOWN',
              contextualFeatures: {
                phase: 'EARLY' as const,
                alliedHeroIds: [],
                enemyHeroIds: [],
                previousActionCount: 0,
                archetypeApplied: false,
              },
            };
          }

          function createAction() {
            return {
              type: 'BUY' as const,
              sourceActionType: 'BUY' as const,
              itemId: 100,
              actionKey: 'BUY:100',
              historicalCount: 10,
              historicalProbability: 1,
              averageGameTimeS: 180,
              matchedStateKey: 'EMPTY',
              matchedStateObservationCount: 10,
              stateDistance: 0,
              missingItemCount: 0,
              extraItemCount: 0,
              matchedBySubset: true,
              currentOwnedCount: 0,
              observedOwnedCountLimit: 1,
              predictedStateKey: '100x1',
              score: 1,
              confidence: 1,
            };
          }
          """.replace("          ", ""))

          workflow = Path('.github/workflows/apply-contextual-v3-model-only.yml')
          workflow.unlink()
          PY

      - name: Validate generated diff
        run: |
          git diff --check
          git status --short

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/deadlock-live/production-hero-build-recommendation.service.ts \
            apps/api/src/deadlock-live/hero-build-contextual-v3-live.service.ts \
            apps/api/test/hero-build-production-model-only.spec.ts \
            apps/overwolf-client/src/live-build-recommendation-poller.ts \
            apps/overwolf-client/src/live-build-recommendation-ui.ts \
            apps/overwolf-client/src/live-build-desktop-full-build-ui.ts \
            apps/overwolf-client/src/live-build-desktop-table-ui.ts \
            apps/overwolf-client/src/live-build-desktop-table-ui.spec.ts \
            apps/overwolf-client/src/desktop-version.ts \
            apps/overwolf-client/package.json \
            apps/overwolf-client/public/manifest.json \
            .github/workflows/apply-contextual-v3-model-only.yml
          git commit -m "feat: run Contextual V3 without baseline"
          git push origin HEAD:agent/contextual-v3-model-only-test

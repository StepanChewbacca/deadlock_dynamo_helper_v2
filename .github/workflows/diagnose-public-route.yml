name: Diagnose public route

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-public-route.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect active nginx route
        shell: bash
        run: |
          set +e
          echo '--- nginx files ---'
          sudo grep -R -n -E 'server_name[[:space:]]+aboba-telegramovich\.duckdns\.org|location[[:space:]]+/deadlock|proxy_pass' \
            /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -n 120 || true
          echo '--- nginx syntax ---'
          sudo nginx -t 2>&1 || true
          echo '--- direct API ---'
          curl --show-error --silent --output /tmp/direct-body --write-out 'status=%{http_code}\n' \
            'http://127.0.0.1:3000/deadlock/analysis/contextual-v3-live/status' || true
          head -c 600 /tmp/direct-body 2>/dev/null || true
          echo
          echo '--- nginx API ---'
          curl --insecure --show-error --silent --output /tmp/nginx-body --write-out 'status=%{http_code}\n' \
            --resolve 'aboba-telegramovich.duckdns.org:443:127.0.0.1' \
            'https://aboba-telegramovich.duckdns.org/deadlock/analysis/contextual-v3-live/status' || true
          head -c 600 /tmp/nginx-body 2>/dev/null || true
          echo
          exit 1

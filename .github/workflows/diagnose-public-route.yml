name: Diagnose public route

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-public-route.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect production reverse proxy
        shell: bash
        run: |
          set +e
          echo "runner_user=$(id -un)"
          echo "hostname=$(hostname)"
          echo '--- listeners ---'
          sudo ss -ltnp | grep -E ':(80|443|3000)\b' || true
          echo '--- services ---'
          for service in nginx caddy apache2; do
            echo "$service=$(sudo systemctl is-active "$service" 2>/dev/null || true)"
          done
          echo '--- nginx config ---'
          if command -v nginx >/dev/null 2>&1; then
            sudo nginx -T 2>&1 | grep -n -E -C 4 'server_name|location /deadlock|proxy_pass' | tail -n 160 || true
          fi
          echo '--- caddy config ---'
          if command -v caddy >/dev/null 2>&1; then
            sudo caddy adapt --config /etc/caddy/Caddyfile --pretty 2>&1 | tail -n 160 || true
          fi
          echo '--- local HTTPS probe ---'
          curl -vk --connect-timeout 5 --max-time 15 \
            --resolve 'aboba-telegramovich.duckdns.org:443:127.0.0.1' \
            'https://aboba-telegramovich.duckdns.org/deadlock/analysis/contextual-v3-live/status' || true
          echo '--- direct API probe ---'
          curl -v --connect-timeout 5 --max-time 15 \
            'http://127.0.0.1:3000/deadlock/analysis/contextual-v3-live/status' || true
          exit 1

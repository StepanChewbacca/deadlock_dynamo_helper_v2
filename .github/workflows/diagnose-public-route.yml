name: Diagnose public route

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-public-route.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Verify repaired public route
        shell: bash
        run: |
          set +e
          host='aboba-telegramovich.duckdns.org'
          echo '--- cleanup duplicate config ---'
          sudo rm -f "/etc/nginx/sites-enabled/${host}.before-deadlock-route"
          echo '--- active route ---'
          sudo grep -R -n -E 'location[[:space:]]+\^~[[:space:]]+/deadlock/|proxy_pass[[:space:]]+http://127\.0\.0\.1:3000' \
            /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true
          echo '--- nginx syntax and reload ---'
          sudo nginx -t
          syntax_status=$?
          if [ "$syntax_status" -eq 0 ]; then
            sudo systemctl reload nginx
          fi
          echo '--- local HTTPS ---'
          curl --show-error --silent --output /tmp/local-body --write-out 'status=%{http_code}\n' \
            --resolve "${host}:443:127.0.0.1" \
            "https://${host}/deadlock/analysis/contextual-v3-live/status"
          local_status=$?
          cat /tmp/local-body 2>/dev/null || true
          echo
          echo '--- public HTTPS ---'
          curl --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors \
            --output /tmp/public-body --write-out 'status=%{http_code}\n' \
            "https://${host}/deadlock/analysis/contextual-v3-live/status"
          public_status=$?
          cat /tmp/public-body 2>/dev/null || true
          echo
          echo "syntax_status=$syntax_status local_status=$local_status public_status=$public_status"
          exit 1

name: Recommendation V8 Runner Recovery V1

on:
  pull_request:
    paths:
      - '.github/training-requests/recommendation-v8-runner-recovery-v1.json'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Cancel stale V8 self-hosted jobs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.github/training-requests/recommendation-v8-runner-recovery-v1.json';
            const request = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (request.state === 'CONSUMED') {
              core.notice('Runner recovery request is already consumed.');
              return;
            }
            if (request.operation !== 'RECOVER_RECOMMENDATION_V8_SELF_HOSTED_RUNNER_V1') {
              core.setFailed('Unexpected runner recovery operation.');
              return;
            }
            const targetRunId = Number(request.targetRunId);
            const branch = context.payload.pull_request?.head?.ref || context.ref.replace('refs/heads/', '');
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, branch, per_page: 100 },
            );
            const cancelled = [];
            for (const run of runs) {
              if (run.id === targetRunId || !['queued', 'in_progress', 'pending', 'waiting', 'requested'].includes(run.status)) {
                continue;
              }
              if (!run.name.startsWith('Recommendation V8')) {
                continue;
              }
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100 },
              );
              const usesSelfHosted = jobs.some(job =>
                Array.isArray(job.labels) && job.labels.includes('self-hosted') &&
                ['queued', 'in_progress', 'waiting', 'pending'].includes(job.status)
              );
              if (!usesSelfHosted) {
                continue;
              }
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                cancelled.push({id: run.id, name: run.name, status: run.status});
              } catch (error) {
                if (![404, 409].includes(error.status)) throw error;
              }
            }
            core.notice(`Preserved target run ${targetRunId}.`);
            core.notice(`Cancelled stale self-hosted runs: ${JSON.stringify(cancelled)}`);
            fs.writeFileSync(path, JSON.stringify({
              ...request,
              state: 'CONSUMED',
              consumedAt: new Date().toISOString(),
              cancelledRuns: cancelled,
            }, null, 2) + '\n');
      - name: Commit recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/training-requests/recommendation-v8-runner-recovery-v1.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/training-requests/recommendation-v8-runner-recovery-v1.json
          git commit -m 'chore: record Recommendation V8 runner recovery'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

name: Build Overwolf OPK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Public HTTPS API base URL embedded into the Overwolf client
        required: true
        default: https://aboba-telegramovich.duckdns.org
        type: string

permissions:
  contents: read

concurrency:
  group: overwolf-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-opk:
    name: Build production OPK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build shared package
        run: yarn workspace @deadlock-live-probe/shared build

      - name: Build and validate Overwolf client
        env:
          OVERWOLF_API_BASE_URL: ${{ inputs.api_base_url }}
          OVERWOLF_PUBLIC_TARGET: ${{ runner.temp }}/overwolf-client/public
        run: yarn workspace @deadlock-live-probe/overwolf-client build

      - name: Create OPK package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/overwolf-client/package.json').version")"
          release_dir="$RUNNER_TEMP/overwolf-release"
          public_dir="$RUNNER_TEMP/overwolf-client/public"
          mkdir -p "$release_dir"
          (
            cd "$public_dir"
            zip -r "$release_dir/deadlock-live-probe-$version.opk" .
          )
          sha256sum "$release_dir/deadlock-live-probe-$version.opk" \
            > "$release_dir/deadlock-live-probe-$version.opk.sha256"

      - name: Upload Overwolf production package
        uses: actions/upload-artifact@v4
        with:
          name: overwolf-opk-${{ github.sha }}
          path: ${{ runner.temp }}/overwolf-release
          if-no-files-found: error
          retention-days: 30

      - name: Upload unpacked client for sideload testing
        uses: actions/upload-artifact@v4
        with:
          name: overwolf-unpacked-${{ github.sha }}
          path: ${{ runner.temp }}/overwolf-client/public
          if-no-files-found: error
          retention-days: 14
